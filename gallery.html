projectUrl":"https://docs.google.com/spreadsheets/d/1V_PcNIHq_8EEvS0uDIKySubgJAfWfMPdEssghzbF-AU/edit?usp=sharing","description":"自作のパズドラ周回編成サイトを宣伝したXのポスト（2026年9月30日）を選び、Xアナリティクスの数値と、サイト内の登録件数を集めた。表示数からリンククリック、サイト内の登録までを、「表示→反応→サイトへ移動→登録」の4段階の横棒グラフにした。14.3万回表示され、リンクは約5,000回クリックされたが、登録は2件（クリックの0.04%）にとどまり、「見に来る」人は多いのに「参加する」行動へは転換していないことが見える。表現の工夫として、横幅は件数に比例する線形のままにして、最後の段階だけオレンジの点で示し、差の大きさと「ほぼ0」であることをそのまま見せた。","imageIndex":65,"imageCount":2,"imageUrls":["assets/gallery/81db25a9d63b150564155dd5.png","assets/gallery/09a4cae64936d57e6906f181.png"],"imageUrl":"assets/gallery/81db25a9d63b150564155dd5.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"森本颯太SoutaMorimoto","title":"2025/26シーズン 欧州五大リーグの収益規模・シェア","tools":"python、Googleスプレッドシート","projectUrl":"https://www.google.com/url?sa=E\u0026source=gmail\u0026q=https://www.statista.com/statistics/261218/big-five-european-football-leagues-revenue/","description":"①デロイト等の統計を基に、最新の2025/26シーズンにおける欧州五大リーグの収益データを選び、②市場の構成比を直感的に比較できるグラフを用いて可視化しました。③これにより、プレミアリーグ単体で全体の4割近いシェアを占め、他リーグを圧倒する一強状態にあることが明確に見えるようになりました。④表現上の工夫として、五大リーグの国の色に分けて作成した。","imageIndex":110,"imageCount":2,"imageUrls":["assets/gallery/a73eba79a7b9291a46887f39.png","assets/gallery/c86d62b3d40754ce9bdddfcc.png"],"imageUrl":"assets/gallery/a73eba79a7b9291a46887f39.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"神戸宗一郎 Souichirou Kanbe","title":"MC Battle MAP","tools":"VS cord","projectUrl":"https://github.com/a250927s-create/data-vis.git","description":"前回同様MCバトルの優勝者データをマップに表示させた。\n前回からの改善点は、順位を1-3位にし、タイを繰り上げにした。また、ランキング内の都道府県名をクリックすることで、その都道府県に移動できるようにした。白い枠の中でリストをスクロールできるように改良した。","imageIndex":91,"imageCount":2,"imageUrls":["assets/gallery/00f3a869f8c203e9c6c03b5e.png","assets/gallery/63f6f0da1ddd2cdd15f2efe2.png"],"imageUrl":"assets/gallery/00f3a869f8c203e9c6c03b5e.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"須藤蒼太　Souta Sutou","title":"台北YouBikeの経路と建物陰の可視化","tools":"私はCodexで作成したHTML・CSS・JavaScriptのWebアプリを使用した。OpenStreetMapを背景地図とし、SVGで経路と建物影を描画した。データの前処理や太陽位置の計算にはPythonを使用している。","projectUrl":"https://drive.google.com/drive/u/1/folders/1rWwnfbNWRcV83DsFGapaq3gc_aD4Gr9B","description":"①どのデータを選んだか\n台北のYouBikeステーション間から選定した15組のOD（出発地と到着地）について、最短・S2日陰優先・S3日陰優先の計45経路を選んだ。これにOSM由来の道路・建物形状、建物高さ、日時別の太陽位置を組み合わせた。S2はOSMの高さと階数から高さを設定し、S3はさらに用途地域別の代表高さで欠損を補う。\n\n②どのように可視化したか\n予測された建物影を半透明の緑色の面、最短経路を灰色、S2を橙色、S3を青色の線で地図に重ねた。地図を大きく表示し、OD・日付・時刻・シナリオを選択できるようにした。時間バーを動かすと影と日陰率が連動して更新され、総距離・日陰距離・日陰率は比較カードで確認できる。経路自体は選定済みのものを固定している。\n\n③可視化によって何が見えるようになったか\n日陰が予測される道路の位置と、移動距離・日陰の多さの関係が分かるようになった。例えばD1の2026年9月13日9時では、S3評価の最短経路は約706m・日陰率26%、S3日陰優先経路は約1,003m・72%だった。同じ日陰優先経路も15時には約27%となる。時間バーで影の変化を確認することで、時刻によって経路の利点が変わることを読み取りやすくした。これらは建物影のモデル予測であり、実測値ではない。\n\n④表現上の工夫を一つ説明\n日陰を半透明の「面」、経路を「線」として重ねた。影の広がりと移動する位置を同時に示すことで、どの経路が影の中を通るかを読み取れる。さらに日陰の濃さを調整できるようにし、背景の道路や地名を読むときと、影の位置を確認するときで見やすさを変えられるようにした。\n\n改善版Webアプリへのリンク：https://taipei-shade-field-demo.hatsume1k4.chatgpt.site/#field/D1","imageIndex":103,"imageCount":2,"imageUrls":["assets/gallery/2df582ea3cb4fd4693de904c.png","assets/gallery/0f5f646735f54a98ce74e124.png"],"imageUrl":"assets/gallery/2df582ea3cb4fd4693de904c.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"石引響 Ishibiki Hibiki","title":"2020年から2025年の東京の降水量(改正版)","tools":"Microsoft Excel","projectUrl":"https://www.data.jma.go.jp/stats/etrn/index.php?prec_no=44\u0026block_no=47662\u0026year=\u0026month=\u0026day=\u0026view=","description":"①前回と同じく、東京都を対象として2020年から2025年までの月別にまとめた降水量のデータを使用。\n②今回は年毎の合計値と月別毎に集積した降水量のデータを分け、二つのグラフに可視化しました。月別は折れ線グラフ、年毎の合計値は棒グラフの二つで表して可視化することで、分かりやすくなりました。\n③年間に記録した降水量を比較しやすくなり、より正確に読み取れるようになった。月別のデータは折れ線グラフにすることで、月毎に降水量が比較できるようになり、年間を通した動きが見やすくなった。\n④前回可視化したグラフが非常に見にくく、比較することが難しかったので、月別の動きと年間の合計の二つの用途に分けて可視化することで、比較しやすくなった。","imageIndex":80,"imageCount":2,"imageUrls":["assets/gallery/521ad26f6cf470853d48ac3b.png","assets/gallery/66ac2734af61acd142510375.png"],"imageUrl":"assets/gallery/521ad26f6cf470853d48ac3b.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-05","studentName":"石原真汲　Makumi Ishihara","title":"妖怪ウォッチ1のプレイ時間と歩数の関係","tools":"Excel","projectUrl":"デジタルウィルビーイングによるスクリーンタイム計測とSamsung Healthによる歩数計測","description":"身の回りのデータで関連性があると思ったのがスクリーンタイムと歩数でした。歩数が多いとその分スクリーンタイムは減り、少ないとスクリーンタイムは増えます。左右にメモリをつけ折れ線と棒グラフによって異なる単位のものを関係を可視化できるようにしました。最大値と最小値を赤色で強調し、その差を明確化しました。可視化したことにより、いかに妖怪ウォッチ1にのめり込んでいるかがわかりました。","imageIndex":64,"imageCount":1,"imageUrls":["assets/gallery/d83cecfcc13447ba39578692.png"],"imageUrl":"assets/gallery/d83cecfcc13447ba39578692.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-07","studentName":"石川翔渉　ishikawa towa","title":"Nintendo Switchで最も売れたソフトは？改訂版","tools":"Googleスプレッドシート、Googleスライド","projectUrl":"https://www.nintendo.co.jp/ir/finance/software/switch.html","description":"① 任天堂公式のNintendo Switchソフトの世界累計販売本数のデータを使用しました\n② 販売本数の上位10作品を横棒グラフで可視化しました\n③ 前回はシリーズごとに色分けしていましたが、今回は1位のマリオカート8 デラックスだけを赤色にし、それ以外をグレーにすることで、最も重要な情報が最初に目に入るようにしました\n④ また、1位と2位の販売本数の差を吹き出しで強調し、このデータから分かることも追加することで、グラフから読み取れる特徴がより伝わりやすくなるように工夫しました","imageIndex":75,"imageCount":1,"imageUrls":["assets/gallery/b9615092a8a7c16536a6a178.png"],"imageUrl":"assets/gallery/b9615092a8a7c16536a6a178.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-02","studentName":"赤塚絆　Kizuna Akatsuka","title":"大谷翔平の打点と本塁打数の比較","tools":"Excel","projectUrl":"https://baseball.yahoo.co.jp/mlb/player/2100825/top","description":"①大谷翔平選手の年度別の打率と本塁打数 \n②1つの折れ線グラフにまとめた \n③双方の違いと推移\n④1つのグラフでまとめることで比較できるよう工夫した\n数値が高い順に上位3項目までピックアップし順位付けした上でグラフに表記した","imageIndex":58,"imageCount":1,"imageUrls":["assets/gallery/938e6328061b5de95cc43c79.png"],"imageUrl":"assets/gallery/938e6328061b5de95cc43c79.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"浅田寛弥　Asada　Hiroya","title":"種目別の推計実施人口","tools":"ChatGPT　Python","projectUrl":"https://www.ssf.or.jp/thinktank/sports_life/index.html","description":"① どのデータを選んだか\nスポーツ庁および笹川スポーツ財団の調査結果に基づく「日本における種目別のスポーツ・運動の推計実施人口データ」を選びました。\n② どのように可視化したか\n主要8種目の推計実施人口（万人）と実施率（%）を、数値が大きい順に並べた「横棒グラフ」で表現しました。\n③ 可視化によって何が見えるようになったか\n「散歩・ウォーキング（約4,361万人 / 45.0%）」が他の種目を圧倒しており、日本人の運動習慣が手軽で1人で始められる種目に大きく偏っている実態が一目で分かるようになりました。\n④ 表現上の工夫または選択\n棒グラフの右側に「具体人数（万人）」と「実施割合（%）」のテキストラベルを直接表示し、目盛りを参照しなくてもひと目で正確な規模感が伝わるようにしました。","imageIndex":106,"imageCount":1,"imageUrls":["assets/gallery/ba9b64eb1fe0ad487c4ba8c3.jpg"],"imageUrl":"assets/gallery/ba9b64eb1fe0ad487c4ba8c3.jpg"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"大友愛梨　Otomo Airi","title":"比較！私の好きな妖怪たち","tools":"Excel","projectUrl":"https://reitakujp-my.sharepoint.com/:x:/g/personal/a250321a_reitaku_jp/IQCsgF3QlUcLRoEKrVa-yDb9AcjlhSP3kgyOjxach2Z2vRI?e=JM9epf","description":"①妖怪ウォッチ３の各キャラクターの種族値②ランキングが分かるようにした③各キャラクターの特性が分かるようになった。④自分で見たいランキングを選択することでグラフが変化するようにした。（Excelを開いて各自で動かしていただく必要がある。以下Excelのリンク）　https://reitakujp-my.sharepoint.com/:x:/g/personal/a250321a_reitaku_jp/IQCsgF3QlUcLRoEKrVa-yDb9AcjlhSP3kgyOjxach2Z2vRI?e=Y6epPM","imageIndex":100,"imageCount":1,"imageUrls":["assets/gallery/28d869cbafaefaae47b6e2c9.png"],"imageUrl":"assets/gallery/28d869cbafaefaae47b6e2c9.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"大澤祥太郎　Osawa Shotaro","title":"サーブはリスクとリターンの関係","tools":"Excel、Python、ChatGPT","projectUrl":"https://en.volleyballworld.com/volleyball/competitions/volleyball-nations-league/statistics/men/best-servers/","description":"Volleyball World が公開しているVNL 2026男子のサーブ成績から、総サーブ数が100本以上の87選手を選んだ。横軸をサーブミス率、縦軸をサービスエース率とした散布図で、選手ごとの関係を可視化した。ミス率が高い選手ほどエース率も高い傾向があり、相関係数は r = 0.64 だった。円の大きさで総サーブ数を示し、Hanes・Leon・Darlanを強調して重要なパターンを見つけやすくした。","imageIndex":101,"imageCount":1,"imageUrls":["assets/gallery/bf8d3136427cba3c81df9d66.png"],"imageUrl":"assets/gallery/bf8d3136427cba3c81df9d66.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"猪狩蒼空　Igari Sora","title":"大学生がよく飲む飲み物","tools":"Googleスプレッドシート","projectUrl":"國學院大學「飲み物」アンケート調査","description":"大学生がよく飲む飲み物の割合データを選び、横棒グラフで可視化しました。割合が高い順に並べることで、どの飲み物が多いかを比較しやすくしました。特に、水や炭酸飲料、茶の割合が高いことが分かりやすくなりました。また、棒の横に具体的な割合を表示して、数値も確認しやすくしました。","imageIndex":82,"imageCount":1,"imageUrls":["assets/gallery/91c1ccf7f53ab1eb66269aa8.png"],"imageUrl":"assets/gallery/91c1ccf7f53ab1eb66269aa8.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"桃井優 Yu Momoi","title":"ヨルシカの楽曲分析","tools":"songdata,gemini,スプレッドシート,python","projectUrl":"https://songdata.io/https://docs.google.com/spreadsheets/d/1OJnjjLT6K3iDBFJwOlNzEw-73NON49AQgHFL7zYXyjg/edit?usp=sharing","description":"①②ヨルシカの楽曲データから物語上対をなすアルバムである だから僕は音楽を辞めた と エルマ の全収録曲を対象に選び、曲順に伴うテンポの推移を折れ線グラフで可視化しました。\n③この可視化により、冒頭の楽曲では同一のテンポで同期して始まるものの、物語が展開する中盤では一方が急減速する際にもう一方が急加速するなど、二人の感情が交差するようなドラマチックなテンポ設計が明らかになりました。\n④表現上の工夫として、各作品のプロットや軸の周辺にジャケット写真の画像を配置することで、どの系列がどちらの作品を表しているかを直感的に識別できるように工夫しました。","imageIndex":94,"imageCount":2,"imageUrls":["assets/gallery/96305af1ff07033af165f630.png","assets/gallery/d48fe9f77884c205debc20ad.png"],"imageUrl":"assets/gallery/96305af1ff07033af165f630.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"藤原叶　Fujiwara　Kanau","title":"世界と日本のFood比較","tools":"Excel , Chat GPT","projectUrl":"https://www.tasteatlas.com/best/dishes　https://share.google/ZaoCOBfu636ZDcVUq","description":"①TasteAtlas「100 Best Dishes in the World」\n　博報堂生活総研「生活定点：好きな料理ベスト3は何ですか？」\n② どのように可視化したか\n世界の人気料理100品と、日本人の好きな料理ランキングを比較できるようにした。世界のデータと日本のデータを棒グラフで表し、同じグラフの中に入れることで、世界と日本の料理の人気傾向を比べられるようにした。\n③世界では肉料理が多く含まれている一方、日本では寿司やラーメンなどが上位に入っていることが分かるようになった。世界で人気の料理と日本人が好きな料理には、共通する部分だけでなく違いもあることが見えるようになった。\n④２つの棒グラフを組み合わせ、世界と日本のデータを一つのグラフで比較できるようにした。特に、数字だけを見るのではなく、グラフの形の違いから人気の傾向を直感的に分かるようにした。","imageIndex":87,"imageCount":1,"imageUrls":["assets/gallery/59daea2eeb80bc6402d5db2a.png"],"imageUrl":"assets/gallery/59daea2eeb80bc6402d5db2a.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"八重樫旺樹","title":"leagueoflegendの降参率","tools":"java chatGPT","projectUrl":"https://developer.riotgames.com/docs/lol","description":"① どのデータを選んだか：LoLの地域・ランク別の降参率（FF率）データを選びました。\n② どのように可視化したか：地域ごとのFF率と、地域を選択したときのランク別FF率を棒グラフで可視化しました。\n③ 何が見えるようになったか：地域やランクによって降参率にどのような違いがあるかを比較でき、どの地域やランクで降参率が高いのかも分かるようにしました。\n④ 表現上の工夫：暗めのゲーム画面をイメージしたデザインとランクアイコンを使い、LoLのデータだと直感的に分かるようにしました。また、地域をクリックするとランク別のデータに切り替わるようにして、データを見やすくしました。","imageIndex":96,"imageCount":2,"imageUrls":["assets/gallery/ccb274813039bf367c77cd76.png","assets/gallery/ccb274813039bf367c77cd76.png"],"imageUrl":"assets/gallery/ccb274813039bf367c77cd76.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-06","studentName":"八木沼悠斗　Yaginuma Yuto","title":"県別の人口と睡眠グラフ","tools":"excel","projectUrl":"https://uub.jp/rnk/p_j.html　https://www.pokemonsleep.net/suimin-grandprix/","description":"①都道府県別の人口と平均睡眠時間のデータを選んだ。\n人口は都道府県ごとの規模を比較するために使用し、睡眠時間は各県の生活習慣を比較するために使用した。\n異なる2種類のデータを組み合わせることで、人口と睡眠時間にどのような関係があるのかを調べた。\n②人口と睡眠時間の関係を比較するために、組み合わせグラフを使用した。\nさらに近似曲線を追加することで、データ全体の傾向が分かるようにした。\nこれにより、各都道府県のデータだけでなく、人口が増えると睡眠時間がどのように変化するのかを視覚的に確認できるようにした。\n③グラフを確認すると、人口が多い都道府県ほど睡眠時間が短くなる傾向が見られた。\n反対に、人口が少ない都道府県では睡眠時間が長くなる傾向が見られた。\nこのことから、人口と睡眠時間には反比例に近い関係があることが分かり、人口の多さと睡眠時間の関係を視覚的に確認することができた。\n④グラフを見やすくするために、人口と睡眠時間で色を変えて区別した。\nまた、それぞれのデータに合ったグラフの種類を使用することで、数値の違いや全体的な傾向を確認しやすくした。\n情報を削るのではなく、色やグラフの種類を工夫することで、元のデータを残したまま見やすく表現することができた。","imageIndex":71,"imageCount":1,"imageUrls":["assets/gallery/9563a0d0b502c8938e0fb84b.png"],"imageUrl":"assets/gallery/9563a0d0b502c8938e0fb84b.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"木村英明　Kimura Hideaki","title":"フォートナイトコラボスキン実装年代統計","tools":"chatgpt","projectUrl":"https://fndb.gg/collaborations/?utm_source=chatgpt.com","description":"①毎日更新されているデータを使った\n②https://beamish-bublanina-da05fb.netlify.app/サイトを作った\n③2019年からアイコンシリーズの数が急速に増えた\n④カーソルを合わせるとすぐにわかるようにした","imageIndex":93,"imageCount":1,"imageUrls":["assets/gallery/247945c9669cd663d218b77f.png"],"imageUrl":"assets/gallery/247945c9669cd663d218b77f.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"矢部夢華　Yumeka Yabe","title":"スタジオジブリ映画の興行収入ランキング","tools":"Googleスプレッドシート","projectUrl":"https://www.nippon.com/ja/japan-data/h01730/","description":"スタジオジブリ映画10作品の国内興行収入のデータを選びました。興行収入を比較しやすくするため、作品をランキング順に並べた横棒グラフで可視化しました。グラフにすることで、「千と千尋の神隠し」が二位の「もののけ姫」と比べても興行収入が特に高いことがわかるようにしました。表現上の工夫として、最も興行収入が高い作品を目立たせ、棒グラフに具体的な数字を書きました。","imageIndex":84,"imageCount":1,"imageUrls":["assets/gallery/ae83b18cab09f184b71a2fdf.png"],"imageUrl":"assets/gallery/ae83b18cab09f184b71a2fdf.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"林瞳　Akira Hayashi","title":"J-POP・ボカロヒット曲と個人嗜好におけるポジショニング比較分析","tools":"Excel・powerpoint","projectUrl":"https://reitakujp-my.sharepoint.com/:x:/g/personal/a250743a_reitaku_jp/IQBJ9R1O5hAhSZLA5WpE-SccAUZ2a11ei_gCYc3oZQKPz6U?e=96pwS3","description":"①【選んだデータ】YouTubeや各種チャート上位のヒットJ-POP 10曲、ボカロヒット10曲、および自身の嗜好である叙情派・ダーク系10曲の計30曲を対象に、BPM（テンポ）、感情トーン（切ない ↔ 明るい）、サムネイル傾向を集計した独自データセットを作成しました。\n②【可視化の方法】縦軸に「楽曲のテンポ（BPM）」、横軸に「感情トーン」を設定したポジショニングマップ上に、著作権法の引用ルールに則り、統一サイズでカテゴリ別の色枠と曲名テキストを付与したサムネイルカードを配置して可視化しました。\n③【見えたこと（パターンと文脈）】可視化により、一般ヒット曲やボカロ曲が「明るい×ハイテンポ」を中心に分布（市場トレンド）するのに対し、自身の嗜好領域はBPMに関わらず「切ない・ダーク」な領域（個人嗜好）に一貫して特化しているという、両者の対比となる明確なパターンと文脈が浮き彫りになりました。\n④【表現上の工夫・選択】Data Visualizationとしての可読性と分析の即時性を高めるため、スプレッドシートと連動した枠線カラー（Semantic Color Mapping）の適用、背景色の調整、さらにマップ上へのパターン注釈カードの配置を行い、位置関係だけでなく視覚的・構造的な傾向の差異を直感的に捉えられるようデザインを設計しました。","imageIndex":92,"imageCount":2,"imageUrls":["assets/gallery/af9f3ea8af47c750533dbfc3.png","assets/gallery/7e02b8f3b7c16ce54bbb8d33.png"],"imageUrl":"assets/gallery/af9f3ea8af47c750533dbfc3.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"鈴木小太朗　Suzuki Kotarou","title":"4選手の打率推移（2015～2024年）","tools":"PowerPoint","projectUrl":"https://npb.jp/","description":"①プロ野球で活躍する４選手の打率を選んだ。\n②2015～2024年までの打率を折れ線グラフを使って比較した。\n③打率の上下が激しい選手と安定した選手がわかる。また選手の打率のピークや衰えも見える。\n④1回目では打率の数字が0.30とあまり野球では表さない表示の仕方だったので.300に変えた。また一つの基準である3割のところを赤線で強調した。","imageIndex":102, ":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"グェンチャンサオマイ　Nguyen Tran Sao Mai","title":"My Favourite Songs BPM Chart","tools":"鉛筆と紙","projectUrl":"Songs data from my Spotify","description":"I choose 5 songs, with the release years and BPM (tempo), from my Spotify playlist, then I made them into graph. Most of my favourite songs are soft, indie, so the tempo is about 100 BPM. I also noticed that newer songs I like tend to have higher BPM, while older or nostalgic songs are slower. This graph helps me understand my music taste visually.","imageIndex":45,"imageCount":2,"imageUrls":["assets/gallery/c36b738e249839d8b8ad7c4b.jpg","assets/gallery/5917c94429f1eba20e930ee1.jpg"],"imageUrl":"assets/gallery/c36b738e249839d8b8ad7c4b.jpg"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-30","studentName":"モンテッラ　エドウィン　Montella Edwin","title":"The Big Mac Index","tools":"VS code, Claude","projectUrl":"The Economist「The Big Mac index」（公式ページ） https://www.economist.com/big-mac-index The Economist ビッグマック指数データ（GitHub） https://github.com/TheEconomist/big-mac-data 使用したCSVファイル（2000年4月〜2026年7月、54か国） https://github.com/TheEconomist/big-mac-data/blob/master/output-data/big-mac-full-index.csv","description":"この作品では、The Economistの「ビッグマック指数」のデータを使い、54か国のビッグマックの価格をドルで比べました。バーガーの大きさや天びん、タイムマシン、一覧チャートなどを使って、楽しくデータを見られるようにしました。その結果、日本のビッグマックは2000年の世界5位から2026年には48位まで下がり、アメリカより約50%安いことが分かりました。最初は世界地図を使いましたが、バーガーが重なって見にくかったため、価格と地域を使った一覧チャートに変更しました。 https://edwin379.github.io/The-Big-Mac-Index/","imageIndex":21,"imageCount":2,"imageUrls":["assets/gallery/d22be25f36e254154b429c58.png","assets/gallery/c058e64b5c258f7118a5e750.png"],"imageUrl":"assets/gallery/d22be25f36e254154b429c58.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-27","studentName":"粟野翔　Awano Kakeru","title":"年齢の分布","tools":"Python","projectUrl":"https://docs.google.com/spreadsheets/d/1ZG5C8F2NKEpbc41lfUGUKE4qy8c1922gRfUGUaHUjQc/edit?usp=sharing","description":"①HARDCORE TANO*Cのメンバーの年齢　②Pythonで制作。縦軸人数、 うに、まずは各県店舗数一位のリストをエクセルで作成しその後DatawrapperでClaudeに作り方を聞きつつ作品を作成した。③可視化によって、想定以上にモーリーファンタジー系列が多いのと、人口が多い県や関東ではGIGOが多い傾向にあることが見えた。④工夫として、色を各ゲームセンターのメインカラーに合うように設定した。namcoが少々悩んだが、バンダイナムコも含まれるためオレンジにすることで、taitoとの赤被りを防ぐことができた。","imageIndex":6,"imageCount":1,"imageUrls":["assets/gallery/6688a2ea879288b1e7f9d836.png"],"imageUrl":"assets/gallery/6688a2ea879288b1e7f9d836.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-29","studentName":"永野虎太郎　Kotarou Nagano","title":"阪神タイガース","tools":"プロ野球速報","projectUrl":"https://docs.google.com/spreadsheets/d/1AFbgC1hbyVhKdBTWYjziu4jDlSqPAoq9Vbjup_5fvn0/edit?usp=sharing","description":"自分は阪神タイガースのファンで優勝のマジックが点灯したのにもかかわらず最近の連敗の原因を調べたいと思いこの議題にしました。可視化で注目してほしいのはOPSですこれはチームへの貢献度を数値化したものです。可視化しこれが1に近づければとても優秀であるとなる0.6でもよい選手とも言えます。打席数立っていない人間で結果をでせている人間とかなり優秀な人物を見ることができます工夫した点は元のデータだと一軍登録されていない人と投手がまとまっていいたが別にすることでわかり役しましたこれでの結果で個人的にここ最近のチーム成績が悪いのは個人成績のタイトル争いがチーム内で行われていることだと思いますほとんどの成績で佐藤輝明選手が４巻がほぼ確実で長距離打者の夢のタイトルが本塁打王でその争いに森下翔太選手が争っていて個人成績に争いをしているからだと感じます。","imageIndex":16,"imageCount":1,"imageUrls":["assets/gallery/7bd15fa567bedbfe20ceb854.png"],"imageUrl":"assets/gallery/7bd15fa567bedbfe20ceb854.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"奥田昭真 Shoma Okuda","title":"iPhone ScreenTime TOP 3","tools":"Exel","projectUrl":"https://1drv.ms/x/c/fda0ee3a225c10e9/IQBVxIfcO7gIQqCXWaoA34xCAcuGFXj_pHwSt5qriu9Jrj0?e=aAzU09","description":"①iPhoneのスクリーンタイム\n②Exelのグラフで可視化\n➂グラフからその日が忙しかったということが分かる\n④Youtube, X, Gameと大きく区分を分けることで、視覚的にもわかりやすくしている。","imageIndex":29,"imageCount":1,"imageUrls":["assets/gallery/1ca86175126bef68492acb9a.png"],"imageUrl":"assets/gallery/1ca86175126bef68492acb9a.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"岡本結衣　Yui Okamoto","title":"都道府県人口ランキング","tools":"紙","projectUrl":"https://www.chizu-seisaku.com/geography/jinkou/","description":"①都道府県別の人口データを選び、都道府県ごとの人口の違いを比較できるようにした。\n②各都道府県の人口を円の大きさで表し、人口が多い地域ほど円を増やして可視化しました。\n③東京都や大阪府などの大都市圏に人口が集中していることや、都道府県によって人口に大きな差があることが分かりやすくなった。\n④表現上の工夫として、人口の多さに合わせて円の数を変え、数字を細かく見なくても人口の分布を直感的に比較できるようにした。","imageIndex":25,"imageCount":1,"imageUrls":["assets/gallery/f3d21c33774dc1dcfcb847ab.jpg"],"imageUrl":"assets/gallery/f3d21c33774dc1dcfcb847ab.jpg"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-28","studentName":"岡野俊介　Syunsuke Okano","title":"オリックス・バファローズ 年度別順位の推移 (2015-2025)","tools":"Googleスプレッドシート","projectUrl":"https://docs.google.com/spreadsheets/d/1t5Wq-L8TrYYQLYlA5btTEcHzJ3L7qRlxJcmQm9sxmII/edit?usp=sharing","description":"私は、プロ野球のパ・リーグのオリックス・バファローズの年度別順位の推移(2015年~2025年)のデータを選びました。時系列に沿った順位の推移を直感的に見れるように折れ線グラフを使って可視化しました。可視化によって、長年の下位低迷期から一転して2021年からのリーグ３連覇を達成した劇的なチームの変化がよく読み取れるようになりました。表現上の工夫として、上位が上に来るように縦軸を反転させて１位を最上段に配置したことと、チームカラーの紺色と金色を使って見やすさと世界観を両立させました。","imageIndex":10,"imageCount":1,"imageUrls":["assets/gallery/496b74bebf950d662be56161.png"],"imageUrl":"assets/gallery/496b74bebf950d662be56161.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-25","studentName":"岡悠斗","title":"日本の競技レベルの推移","tools":"Excel","projectUrl":"https://rekidai-carnival.com/asian-games-japan-medals-history/","description":"①アジア大会日本の歴代メダル数一覧　②日本の歴代総メダル獲得数の時系列を棒グラフにまとめて視覚的にわかりやすく可視化した。③歴代の総メダル獲得数の年別の見比べだけでなく、金・銀・銅メダルの割合や数などを特定の年だけでなく複数の年を見比べることができる。④グラフを見ていると日本の獲得数は上振れもしている年も下振れしている年もあるが巨視的にみるとだんだんと獲得数が上がってきている。","imageIndex":2,"imageCount":1,"imageUrls":["assets/gallery/f8f763ea0bee9271e75dea5f.png"],"imageUrl":"assets/gallery/f8f763ea0bee9271e75dea5f.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-26","studentName":"我如古隼人　Hayato Ganeko","title":"Steam人気ゲームの歴代最高同時接続者数と24時間ピークの比較","tools":"Excel","projectUrl":"https://steamdb.info/charts/?sort=peak","description":"SteamDBから、歴代最高同時接続者数が多いSteamゲーム10作品の「歴代最高同時接続者数」と「24時間ピーク」のデータを選びました。\nまず2つの同時接続者数を比較し、さらに「24時間ピーク ÷ 歴代最高同時接続者数」で現在のプレイヤー維持率を計算して横棒グラフにしました。\n可視化することで、Counter-Strike 2やDota 2は歴代最高に対して現在も高い割合のプレイヤーがいる一方、他の多くのゲームでは大きく減っていることが分かります。\nゲームごとの差を比較しやすくするため、維持率が高い順に並べ、横棒グラフで表現しました。","image グラフとして可視化しました。この可視化により、トップ層が安定して高水準を維持する一方で、若手選手の価値が直近で急激に上昇しているトレンドが一目でわかるように見えた。","imageIndex":52,"imageCount":2,"imageUrls":["assets/gallery/4acc8213a8fdcec735ee26e8.png","assets/gallery/0f804179e486053ab5b06be2.png"],"imageUrl":"assets/gallery/4acc8213a8fdcec735ee26e8.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"神戸宗一郎 Kanbe Souichirou","title":"MC BATTLE 都道府県勢力図","tools":"VS cord html","projectUrl":"https://github.com/a250927s-create/data-vis.git","description":"1.https://mcbattlenow.com/database/mc/c682f001-d525-438f-8d56-7978cc0cd965\n前回授業で紹介したMCバトルの優勝者データを参考に、彼らの代表する街を調べ上げ地図に反映することで、データを可視化した。\n2.地図上に色の違い、クリックしたら優勝者一覧が表示され、サイドバーに最多優勝県が表示されるようにしている。\n3.ラップバトルが強い街が一目で分かるようになり、その街のバトル、サイファー、Liveイベント等に遊びに行くことでラップを上達させることができることがわかる。\n4.街の優勝者一覧から、そのラッパーがその大会で残したバトルを閲覧することができる。\n全体的に改良の余地があるため、改良を続けていく。","imageIndex":35,"imageCount":2,"imageUrls":["assets/gallery/5c1de30d7bebab7eb9392591.png","assets/gallery/b01bb10a73981ec322f7b2ab.png"],"imageUrl":"assets/gallery/5c1de30d7bebab7eb9392591.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"須藤蒼太　Souta Sutou","title":"台北YouBikeの経路と建物影の可視化","tools":"Codexを使って作成。HTML・CSS・JavaScriptのWebアプリで可視化した。背景にはOpenStreetMapの地図を使用し、その上にSVGで経路、建物影、出発地・到着地を描画した。データの前処理と太陽位置の計算にはPythonを使用し、主なライブラリはGeoPandas、Shapely、pyproj、Pysolarである。Webアプリ上の座標変換にはProj4js、日時変更に伴う日陰の計算にはJavaScriptのWeb Workerを使用している。","projectUrl":"https://drive.google.com/drive/folders/1rWwnfbNWRcV83DsFGapaq3gc_aD4Gr9B?usp=drive_link","description":"①台北のYouBike（レンタサイクル）ステーション間から研究用に選定した15組のODを対象に、最短経路、S2の日陰優先経路、S3の日陰優先経路の計45本を選んだ。ODは出発地（Origin）と到着地（Destination）の組を意味する。これにOSM由来の道路・建物形状と建物高さ、日付・時刻ごとの太陽位置、経路の総距離・日陰距離・日なた距離を組み合わせた。\nS2はOSMの建物高さを使い、高さがない場合には階数×3mで補う。S3はさらに、用途地域別に推定した高さの中央値で欠損を補う。\n予測対象の日時は2026年9月11～16日、台北時間9:00～17:00、1分単位である。\nこれは実際の利用者の走行記録や交通量のデータではなく、選定したODについてのモデル経路と建物影の予測データである。\n\n②地図上に予測された建物影を半透明の緑色の面として重ね、最短経路を灰色、S2を橙色、S3を青色の線で表示した。\n利用者はOD、日付、時刻、建物高さのシナリオ、表示する経路を選択できる。\n数値欄には経路の総距離、予測日陰距離、日なた距離、日陰率を表示する。日陰率は「日陰距離÷総距離」で求める。日時を変えると、建物影と固定経路上の日陰距離・率が再計算される。\n経路自体は代表日時に選定したものを固定しており、変更後の日時で最適経路を再探索する仕組みではない。\nまた、背景の建物影のシナリオと経路の評価シナリオは区別する必要がある。\nS2経路の数値はS2、S3経路の数値はS3で評価され、最短経路の数値は選択した背景シナリオで評価される。\n\n③どの道路に建物影がかかると予測されるか、建物高さの補完方法や時刻を変えると影の位置・広がりがどう変化するかを確認できるようになった。\nまた、移動距離の短さと日陰の多さの関係を読み取れる。\n例えばD1の2026年9月13日9:00では、同じS3の建物モデルで評価すると、最短経路は約706m・日陰率26%、S3の日陰優先経路は約1,003m・日陰率72%だった。\n約297mの迂回によって、予測日なた距離は約525mから約279mへ減る。一方、同じS3の日陰優先経路でも15:00には日陰率が約27%となる。この例から、朝に日陰が多い経路の利点が、別の時刻にも同程度に続くとは限らないことが分かる。\nこれらは建物形状・推定高さ・太陽位置に基づく計算結果であり、実測した日陰ではない。可視化だけで現地での予測精度やS3の優位性を証明できるものではなく、樹木、天候、体感温度はこの建物影モデルの対象に含まれていない。\n\n④日陰を半透明の「面」、経路を色付きの「線」として重ねた。面で影の空間的な広がりを示し、線で移動する位置を示すことで、どの経路が影の中を通るかを同じ地図上で読み取れる。半透明にすることで、背景の道路や地名も確認できる。この表現によって、数値表だけでは捉えにくい日陰と経路の位置関係を伝えられる。\n\n実際のwebアプリのURL：https://taipei-shade-field-demo.hatsume1k4.chatgpt.site/#field/D1","imageIndex":36,"imageCount":2,"imageUrls":["assets/gallery/ab840b58a67615f4b70f6c31.jpg","assets/gallery/b14d8d844c53c46c159b434e.jpg"],"imageUrl":"assets/gallery/ab840b58a67615f4b70f6c31.jpg"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"石引響 Ishibiki Hibiki","title":"2020年から2025年の東京の降水量","tools":"Microsoft Excel","projectUrl":"https://www.data.jma.go.jp/stats/etrn/index.php?prec_no=44\u0026block_no=47662\u0026year=\u0026month=\u0026day=\u0026view=","description":"①気象庁が公表している2020年から2025年までの東京都の月別にまとめた降水量のデータを月別と年ごとの合計値の二つでまとめ直しました。\n②月別の降水量を棒グラフ、年ごとの合計値を折れ線グラフとし、この二つのデータを統合した複合グラフにしました。\n③雨が集中している月と、年全体で見た時の合計値の差が分かりやすくなった。\n④量データを見比べることができるように複合グラフにして表したこと。","imageIndex":30,"imageCount":2,"imageUrls":["assets/gallery/869be3091e09f8c35fabcc16.png","assets/gallery/918404b5d60ff038ce8e7254.png"],"imageUrl":"assets/gallery/869be3091e09f8c35fabcc16.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-28","studentName":"石川翔渉　Towa Ishikawa","title":"Nintendo Switchで最も売れたソフトは？","tools":"Googleスプレッドシート","projectUrl":"https://www.nintendo.co.jp/ir/finance/software/switch.html","des ogle Sheets ChatGPT","projectUrl":"https://jp1.api.riotgames.com/lol/platform/v3/champion-rotations","description":"① どのデータを選んだか：LoLの地域・ランク別の降参率（FF率）データを選びました。\n② どのように可視化したか：地域ごとのFF率と、地域を選択したときのランク別FF率を棒グラフで可視化しました。\n③ 何が見えるようになったか：地域やランクによってFF率にどのような違いがあるかを比較できるようにしました。\n④ 表現上の工夫：暗めのゲーム画面をイメージしたデザインとランクアイコンを使い、LoLのデータだと直感的に分かるようにしました。","imageIndex":42,"imageCount":2,"imageUrls":["assets/gallery/d0b2d84bea0279d8aba76671.png","assets/gallery/04e1e818eb96fd9cc96b7e93.png"],"imageUrl":"assets/gallery/d0b2d84bea0279d8aba76671.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-25","studentName":"八木沼 悠斗","title":"睡眠時間と人口密度の比較(失敗)","tools":"googleスプレッドシート","projectUrl":"https://www.stat.go.jp/data/shakai/2026/campaign/ranking/　　　https://www.e-stat.go.jp/dbview?sid=0004050417\u0026utm_source=chatgpt.com","description":"1.睡眠時間と人口密度のデータを選択　2.棒グラフの形式で表した　3.数字だけで表されていたデータが見やすくなり、人口密度と睡眠時間が関連付いてるとみることもできるようになった。　4.二つのデータを比較することで新たな事実を見つけようとしたが、操作に不慣れだった為失敗した。失敗はしたが時間をかけて成長した手ごたえは感じている。","imageIndex":3,"imageCount":2,"imageUrls":["assets/gallery/78e6206d67484bee7b9a7ac3.png","assets/gallery/527fb44f098ed83c1d71b199.png"],"imageUrl":"assets/gallery/78e6206d67484bee7b9a7ac3.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-30","studentName":"北浦義就　Yoshiyuki Kitaura","title":"政党支持率の推移","tools":"JavaScript","projectUrl":"https://docs.google.com/spreadsheets/d/1Flszvzg9TWAiU-7_ujmSCdtw1M7nvwMlrTdXBF9feDo/edit?usp=sharing","description":"①社会実績データ図録にある政党支持率の推移のデータを選んだ。\n②イラストとして出ていたグラフをAIに数値化させてCSVにしたものをもう一度折れ線グラフにして可視化した。\n③阿部内閣になってからそれ以前までは低かった自民党の支持率が一気に約２倍まで上がったことが分かった。\n④グラフで表示する内容を1年に絞ることで元のグラフより見やすくした。","imageIndex":22,"imageCount":1,"imageUrls":["assets/gallery/1af826f664990ed7bf76863f.png"],"imageUrl":"assets/gallery/1af826f664990ed7bf76863f.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"木村英明　Kimura Hideaki","title":"フォートナイトコラボスキン別統計","tools":"chatgpt、Gemini","projectUrl":"https://fndb.gg/characters/?utm_source=chatgpt.com","description":"コラボスキンの全体、日本、アメリカの3つに分け、円グラフで見やすく棒グラフでカテゴリー別の差が分かった","imageIndex":38,"imageCount":2,"imageUrls":["assets/gallery/066fa4b06fb434afab98fbf4.png","assets/gallery/6166fa4fb4bb0adeb404c543.png"],"imageUrl":"assets/gallery/066fa4b06fb434afab98fbf4.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-29","studentName":"野村隆介　Nomura Ryuusuke","title":"米派とパン派の割合","tools":"エクセル","projectUrl":"https://www.e-stat.go.jp/dbview?sid=0004023612","description":"①政府統計の窓口e-statで家計調査家計収支編総世帯から米とパンの割合を求めた、②円グラフが分かりやすいだろうと考え円グラフで可視化した、③この可視化により米派よりパン派の方が多いことが見えるようになった④グラフにも円グラフや点線グラフなどがあるが割合を図るなら円グラフが最適だろうと考え、円グラフにした。","imageIndex":18,"imageCount":1,"imageUrls":["assets/gallery/166513ed41f8b39d311cfb5c.png"],"imageUrl":"assets/gallery/166513ed41f8b39d311cfb5c.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"矢部夢華　Yumeka Yabe","title":"スタジオジブリ映画の興行収入を比較する","tools":"Googleスプレッドシート","projectUrl":"スタジオジブリ映画10作品の日本国内での興行収入データ","description":"①ジブリ10作品の興行収入\n➁横向き棒グラフ\n③作品ごとの差、高い作品\n④横向きのグラフにして作品名を見やすくした","imageIndex":32,"imageCount":1,"imageUrls":["assets/gallery/d44d29a595bb89a236472d93.png"],"imageUrl":"assets/gallery/d44d29a595bb89a236472d93.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"林瞳　Hayashi Akira","title":"-POP・ボカロヒット曲と個人嗜好におけるポジショニングおよび視覚表現の比較分析","tools":"エクセル、パワーポイント、YouTube、Gemini","projectUrl":"エクセル(二枚目のスクリーンショット)にまとめたため、それで判断しでほしいです。","description":"①YouTubeにおける一般ヒットJ-POP 10曲、ボカロヒット10曲、および自身の嗜好である叙情派・ダーク系10曲の計30曲を対象に、BPM、感情トーン、サムネイル傾向を集計した独自データセットを作成しました。\n\n②縦軸にBPM、横軸に感情トーン（切ない ↔ 明るい）を設定したポジショニングマップ上に、著作権法の引用ルールに則り枠線で識別した各曲のサムネイルと曲名カードを配置して可視化しました。\n\n③一般ヒットやボカロ曲が「明るい×ハイテンポ」を中心に分布するのに対し、自身の嗜好領域はBPMに関わらず「切ない・ダーク」に強く密集しており、市場トレンドと個人嗜好の明確な差が浮き彫りになりました。\n\n④Data Visualizationの可読性と著作権配慮を両立するため、カテゴリ別の枠線色と引用注釈を設定し、位置だけでなくデザイン・表現傾向の違いも直感的に識別できるよう選択・設計しました。","imageIndex":43,"imageCount":2,"imageUrls":["assets/gallery/1bfc8b15aa8a1cc3768e4aca.png","assets/gallery/5c789695677ab84a9b6977c4.png"],"imageUrl":"assets/gallery/1bfc8b15aa8a1cc3768e4aca.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"鈴木小太朗　Kotarou Suzuki","title":"プロ野球トップ選手の打率比較","tools":"Excel","projectUrl":"https://npb.jp/","description":"①プロ野球選手４人の１０年間の打率データを選んだ。②棒グラフにすることで年度別で比較し１０年間の打率を可視化した。③１年ごとの打率の変化の特徴が可視化され、年齢による衰え方の違いも出た。④これは個人的なこだわりだが棒グラフの色を選手の所属球団の色に寄せてみた。","imageIndex":50,"imageCount":1,"imageUrls":["assets/gallery/f366f015b3ff442697c11fe0.png"],"imageUrl":"assets/gallery/f366f015b3ff442697c11fe0.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"鈴木優　Yu Suzuki","title":"中2の妹に対する小言・喧嘩ログ","tools":"紙・Googleスプレッドシート","projectUrl":"https://docs.google.com/spreadsheets/d/1h09dnTiUopct10Yk_4NEnKKMuSV9QEQQrezXomRsWmI/edit?usp=sharing","description":"① 実家で一緒に暮らしている中2の妹とのやり取りを5日間記録して、時間やきっかけ、妹の態度、自分のイライラ度（0〜5の6段階）をまとめたオリジナルのデータセットを作りました。\n\n② 横軸に日付を置いて、イライラした度合いを上向きの「トゲの高さ」、逆に妹が親に怒られて思わず笑ってしまった瞬間（怒り度0）を下向きの「緑の丸」にして、ノートに手描きで可視化しました。\n\n③ グラフにしてみると、学校が始まってからは顔を合わせる夕方以降に衝突が集中していることや、普段のちょっとした小言（青いトゲ）よりも、煽られたり理不尽なことを言われた日（9/28の赤い大きなトゲ）に怒りが跳ね上がっているのが一目で分かりました。\n\n④ せっかく初回の課題なのでこの授業を楽しんでできるよう堅苦しいデータではなく、そして誰もやらないような自分自身のデータを取ろうと考えこのデータを可視化しました。授業内ワークで見つけた『Dear Data』のように日常のチクチクした感情が直感的に伝わるトゲのモチーフを取り入れたのですが5日間だとデータ数が少なくて余白が寂しくなってしまったのが反省点です。","imageIndex":51,"imageCount":1,"imageUrls":["assets/gallery/59220dc8f63f1bbfe832520a.jpg"],"imageUrl":"assets/gallery/59220dc8f63f1bbfe832520a.jpg"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-30","studentName":"齋藤さくら Sakura Saito","title":"私はバイト限定雨女なのか","tools":"Excel","projectUrl":"https://tenki.jp/past/2026/08/weather/3/15/47682/","description":"「tenki.jp」というサイトで2026年8月において千葉県・千葉に雨が降った日を調べ、私が8月にバイトをした日に雨が降ったかどうかを調べた。Excelで雨が降った日とバイトがあった日をまとめ、「８月の雨が降った日の割合」「バイトをした日に雨が降った日の割合」の2つの円グラフにしてまとめた。可視化により、２つの割合はほとんど変わらないことがわかった。工夫としては円グラフの色分けをし、視覚的に雨が降ったかわかりやすくした。","imageIndex":20,"imageCount":1,"imageUrls":["assets/gallery/d5d148b4a1fe9187f759dfe0.png"],"imageUrl":"assets/gallery/d5d148b4a1fe9187f759dfe0.png"}]}</script><script src="assets/i18n.js?v=default-ja-20260925"></script><script src="assets/site.js?v=gallery-empty-feed-20261023"></script></body></html>
