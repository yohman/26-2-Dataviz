Tableau","projectUrl":"No Links available","description":"The data I selected is Players Name, Average Value, Average Growth Potential and Country of Origin. I visualized it through a Heatmap and a Scatter Chart. First one to portray the Value for Countries to have a high ROI on their players, and the Scatter Chart shows specific players and categorizes them. That countries in the Americas have the highest ROI on their players. I employed the heatmap to portray where they come from and if you click on it the scatter chart below will only show the players from that country to better analysis.\nLink:https://public.tableau.com/views/DataVis_Homework/Dashboard1?:language=en-US\u0026:sid=\u0026:redirect=auth\u0026:display_count=n\u0026:origin=viz_share_link","imageIndex":207,"imageCount":1,"imageUrls":["assets/gallery/504a159bbf501e25c892a2fa.png"],"imageUrl":"assets/gallery/504a159bbf501e25c892a2fa.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-21","studentName":"Welhemina Gansah","title":"Women at Work Over 130 Years: Different Starting Points, Similar Destination","tools":"Tableau","projectUrl":"https://ourworldindata.org/grapher/female-labor-force-participation-long-run","description":"I selected long-run data on female labor force participation for the United States, Canada, Germany and the United Kingdom, from the 1890s to 2024, using Our World in Data and the World Bank. In Tableau, I made a line chart with one colored line per country, direct labels at the end of each line, and the finding in the title. This made a pattern visible: the countries started far apart (Germany at 36% in 1895 and Canada at 16% in 1911) but all ended up between 57% and 61% in 2024. My creative choice was to make the lines play over time and make the U.S. line thicker, so viewers can watch who started where and see the U.S. rise from 18.6% in 1890 to about 57.5% today.","imageIndex":185,"imageCount":1,"imageUrls":["assets/gallery/35ad0d44dde75599357bb906.png"],"imageUrl":"assets/gallery/35ad0d44dde75599357bb906.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"グェンチャンサオマイ　Nguyen Tran Sao Mai","title":"Titanic Passenger Survival Analysis","tools":"Tableau","projectUrl":"I use the Titanic Passenger List from Tableau dataset https://public.tableau.com/app/learn/sample-data","description":"This dashboard explores factors related to passenger survival on the Titanic. The scatterplot shows the relationship between passenger age, ticket fare and survival status. The bar charts compare survival rates by passenger class and gender. \nThe results show that passengers who paid higher fares were more likely to survive. First-class passengers had the highest survival rate, while third-class passengers had the lowest. Female passengers also had a significantly higher survival rate than male passengers.\nI chose these visualizations because they clearly show both individual passenger data and overall survival trends, making patterns in the dataset easy to understand.","imageIndex":191,"imageCount":1,"imageUrls":["assets/gallery/cc0b3b038bf5a454c18b8f22.png"],"imageUrl":"assets/gallery/cc0b3b038bf5a454c18b8f22.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-20","studentName":"モンテッラ エドウィン　MONTELLA EDWIN","title":"Where Is the Big Mac Cheaper Than in the U.S.? (2000–2026)","tools":"Tableau","projectUrl":"https://github.com/TheEconomist/big-mac-data","description":"①The Economistが公開している「ビッグマック指数」（2000〜2026年）を使い、各国のビッグマック価格（米ドル換算）とアメリカの価格を比べるデータを選びました。②上には、アメリカの価格を1.0として各国を青（安い）とオレンジ（高い）に色分けした世界地図を置き、国をクリックするとフィルターがかかり、下のグラフにその国とアメリカの2000〜2026年の価格が年ごとに表示されるダッシュボードにしました。③その結果、2026年は54か国中40か国でビッグマックがアメリカより安いことが分かりました。日本を選ぶと、アメリカより高かったのは2000〜2001年と2009〜2012年（円高の時期）だけで、2026年には3.08ドル対6.22ドルと約半分まで差が広がっていることも見えるようになりました。④表現上の工夫として、下のグラフの点を線ではなくハンバーガーのアイコンにし、選んだ国を赤枠、アメリカを青枠で表すことで、どちらの価格が上にあるかを年ごとにひと目で比べられるようにしました。\nhttps://public.tableau.com/app/profile/edwin.montella/viz/BigMacDashboard/BigMacDashboard","imageIndex":181,"imageCount":2,"imageUrls":["assets/gallery/06c23d29a9859cc070d5dab2.png","assets/gallery/e0af38347afaf186a1ecb27a.png"],"imageUrl":"assets/gallery/06c23d29a9859cc070d5dab2.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-18","studentName":"粟野翔　Awano Kakeru","title":"石炭使用量×GDP","tools":"Tableau / Tableau Public","projectUrl":"https://public.tableau.com/views/4_17923019089280/1_1?:language=ja-JP\u0026publish=yes\u0026:sid=\u0026:redirect=auth\u0026:display_count=n\u0026:origin=viz_share_link","description":"①世界の石炭使用量の推移とGDPの推移。②Tableauで棒グラフをつくった。③石炭使用量が減っていてもGDPが下がるわけではなかった。④選択した国だけを強調するように他の国を薄くし目立たなくした。左右のグラフの色を統一し視線を動かしても見やすくした。","imageIndex":168,"imageCount":1,"imageUrls":["assets/gallery/cd9d7ac7919cd02446e14079.png"],"imageUrl":"assets/gallery/cd9d7ac7919cd02446e14079.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-21","studentName":"伊藤拓哉　Ito Takuya","title":"2022年 Spotify Japan ヒットチャート分析ダッシュボード","tools":"CSV","projectUrl":"データ：https://www.kaggle.com/search?q=spotify+viewedByYou%3AViewed作品のウェブサイト：https://public.tableau.com/app/profile/.61026182/viz/4_17925930329070/1?publish=yes","description":"①2022年のSpotify Japan Daily Top 200データ②上位20アーティストの総再生数と楽曲ごとの日次推移を可視化しました。上段の棒グラフで全体の年間規模を提示し、下段の折れ線グラフへダッシュボードアクションで流れるインタラクティブな構成にしています。③これにより、トップアーティスト間での再生規模の差だけでなく、タイアップや新曲リリース時に発生する急激な「再生数の伸びている現象」を瞬時に特定できるようになりました。④表現上の工夫として、上段（全体）から下段（詳細）へと視線が自然に移動する上下2段レイアウトを採用し、アーティストの曲別ごとに色分けしていて、直感的な探索を可能にしています。","imageIndex":186,"imageCount":2,"imageUrls":["assets/gallery/269b4b7524c14674a0e69700.png","assets/gallery/809bdbad2b0f4f7ac401cfeb.png"],"imageUrl":"assets/gallery/269b4b7524c14674a0e69700.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-16","studentName":"伊澤颯馬　Soma Izawa","title":"東京駅利用者推移","tools":"tableau、Claude","projectUrl":"https://public.tableau.com/app/profile/izawa.soma/viz/_17915496275990/sheet3?publish=yes","description":"今回は前年度比の可視化を最も重要視し、前年度－の場合は赤字に、大きくすることでいかにコロナ禍において、東京駅の利用者が減ったのかを一目でわかるように考えてみた。\n情報を足すというよりかは、引き算というか、伝えたい部分を強調するために省く部分もあった。","imageIndex":165,"imageCount":1,"imageUrls":["assets/gallery/660ba0c7f5725debf38b71f0.png"],"imageUrl":"assets/gallery/660ba0c7f5725debf38b71f0.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"岡本結衣　Okamoto Yui","title":"都道府県人口ランキング","tools":"Tableau","projectUrl":"藤堂府県別人口データ","description":"① 都道府県別の人口ランキングのデータを選びました。② 人口の多い順に都道府県を並べ、ランキング形式で可視化しました。③ どの都道府県の人口が多いのか、また都道府県ごとの人口の違いが分かるようになりました。④ 順位が分かりやすいように人口の多い順に並べ、比較しやすく工夫しました。","imageIndex":194,"imageCount":1,"imageUrls":["assets/gallery/b9501b3a2ff8fef31ba9ac42.png"],"imageUrl":"assets/gallery/b9501b3a2ff8fef31ba9ac42.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-19","studentName":"岡野俊介　Syunsuke Okano","title":"オリックス・バファローズ 投手陣パフォーマンス分析","tools":"Tableau","projectUrl":"https://npb.jp/bis/2026/stats/idp1_b.html","description":"オリックス・バファローズ投手陣の成績データを使って、投球回と防御率の散布図、制球力を示すK/BBの棒グラフをひとつの画面にまとめました。散布図をクリックするとその選手のスタッツへ連動するフィルターを付けたことで、長いイニングを投げる先発陣と短いイニングを締める救援陣の役割や強みの違いが直感的に見えてきます。分析結果からは、イニング消化と防御率の両面で突出している宮城の圧倒的な存在感や、救援陣の制球力の高さがよくわかりました。表現の工夫として、防御率が良いほどグラフの上側に配置されるように縦軸を反転させて、平均線をクロスさせて4つに分けることで、誰がどの領域で貢献しているかが一目で伝わるようにしました。","imageIndex":173,"imageCount":1,"imageUrls":["assets/gallery/45acd5e4b29b90d7b09a3d61.png"],"imageUrl":"assets/gallery/45acd5e4b29b90d7b09a3d61.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-18","studentName":"岡悠斗　Haruto Oka","title":"pokemon　種族値の箱ひげ図　平均種族値と攻撃力の関係性","tools":"Tableau public","projectUrl":"pokemon CSV","description":"①pokemon csvでデータを視覚化した。②シート３ではタイプ別に平均種族値のデータを箱ひげ図にして最小値、最大値、平均値などを表し可視化した。シート２では横軸に攻撃力、縦軸に平均種族値を表した。③シート３では箱ひげ図の特徴によって最大値と最小値が分かり最大値ではノーマルタイプが一番高く、最小値は水が一番低いことがわかる。シート２では平均種族値と攻撃力の関係値を表すので正の相関と近似していることがわかる。④相関図のほうは色をタイプごとにわかるようにしてどのタイプがどの位置に多いのかを視覚的にわかりやすくした。","imageIndex":169,"imageCount":1,"imageUrls":["assets/gallery/0aaf6107c57d23fa789f34bc.png"],"imageUrl":"assets/gallery/0aaf6107c57d23fa789f34bc.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-20","studentName":"我如古隼人　HayatoGaneko","title":"世界のCO₂排出量から見る国ごとの違いと変化","tools":"Tableau Public","projectUrl":"https://github.com/owid/co2-data?utm_source=chatgpt.com","description":"世界各国のCO₂排出量の違いを調べるため、Our World in Dataのデータを使用しました。Tableauを使い、国ごとの排出量を色の濃さで表した世界地図と、排出量の多い順に並べたランキングを1つのダッシュボードにまとめました。可視化した結果、中国やアメリカ、インドなどの排出量が特に多く、国によって大きな差があることが分かりました。また、年代を変更できるフィルターを設置し、年ごとの排出量の違いを比較できるように工夫しました。","imageIndex":178,"imageCount":1,"imageUrls":["assets/gallery/e8a1304ad763d820916b4b7c.png"],"imageUrl":"assets/gallery/e8a1304ad763d820916b4b7c.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-17","studentName":"柿木奏太　Kakinoki Souta","title":"GDP分析","tools":"Tabeau","projectUrl":"https://public.tableau.com/shared/25STRRRQX?:display_count=n\u0026:origin=viz_share_link","description":"前回やった課題を今回はダッシュボードなどを駆使して自分以外の人にも分かりやすくした。さらに前回は画像での共有だったが今回は共有リンクがあることにより操作ができるため前回よりも違いが分かりやすくなっている。\n前回と比べて違う点は、前回は円の大きさだったが今回をそれに加えて棒の長さでさらに分かりやすくしている。","imageIndex":166,"imageCount":2,"imageUrls":["assets/gallery/67f7b198cc2e30564b25426b.png","assets/gallery/5642ed6ef5e1d75bfef7eac5.png"],"imageUrl":"assets/gallery/67f7b198cc2e30564b25426b.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"岩田知機　iwata chiki","title":"当落可視化","tools":"Tableau","projectUrl":"https://docs.google.com/spreadsheets/d/1Blz-dGHC1LSv-LsM9NzBNjiXCZ7QFW6cYl3jbHLQ7dg/edit?usp=sharing","description":"①自分の推し活当落データ②棒グラフにしてどれくらい買ったかわかりやすく可視化した。③可視化によってシリアルが一番積んで一番当たっていた。④当たったものだけ色付けして何が当たったかわかりやすくした。また、何のイベントの種類かと積んだものの種類を見比べられるようにした。\nhttps://public.tableau.com/app/profile/chiki.iwata/viz/2_17921197580970/22?publish=yes","imageIndex":195,"imageCount":1,"imageUrls":["assets/gallery/d43d4973b5262dc2576f93c3.png"],"imageUrl":"assets/gallery/d43d4973b5262dc2576f93c3.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"鬼塚駿　Onitsuka Shun","title":"ポケモンのタイプ別分布と総合ステータス分析","tools":"Tableau","projectUrl":"第4回講義のデータ","description":"ポケモンのタイプを対象にタイプ別の分布とステータス傾向を分析しました。メインタイプとしては「みず（134体）」「ノーマル（118体）」「くさ（103体）」の順に数が多く、「ひこう」などはメインタイプとしての登録数が非常に少ないという特徴が分かりました。 また、物理と特殊を合算した「総合火力（攻撃+特攻）」と「総合耐久（防御+特防）」の計算フィールドを作成し、ポケモンの総合的な性能分布を散布図で可視化しています。 ダッシュボード上で「タイプ別概要」の棒グラフをクリックすると、下の散布図が自動で連動し、選択したタイプのポケモンのみをインタラクティブに絞り込んで分析できます。 ※なお本来はポケモン徹底攻略をデータの元にする予定でしたがphpによるメンテナンスで開けなかったため第四回で使用したデータを利用しています Link:https://public.tableau.com/app/profile/.73385761/viz/_17926697052600/1?publish=yes\u0026showOnboarding=true","imageIndex":202,"imageCount":1,"imageUrls":["assets/gallery/d05d4b5e8bc80513bbbd61ce.png"],"imageUrl":"assets/gallery/d05d4b5e8bc80513bbbd61ce.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"吉田爽二　Soji Yoshida","title":"Superstoreで利益を生むのはどのサブカテゴリか","tools":"Tableau","projectUrl":"https://public.tableau.com/app/profile/soji.yoshida/viz/_17926629411700/1#1","description":"① データ: Tableau標準のサンプルデータ「Superstore」を選びました。\n② 可視化: 月ごとの売上と利益を2段の折れ線グラフに、サブカテゴリごとの利益を降順の棒グラフにして、1つのダッシュボードにまとめました。Regionフィルターで、両方のグラフを同時に絞り込めます。\n③ 見えたこと: 売上・利益とも年末の11〜12月が高く、1〜2月は低い傾向が見えました。サブカテゴリでは、Copiersの利益が最も大きく、Tables、Bookcases、Suppliesは赤字だと分かりました。\n④ 工夫: 利益の棒を色で塗り分け、赤字のサブカテゴリが一目で分かるようにしました。","imageIndex":199,"imageCount":1,"imageUrls":["assets/gallery/f611de42896db0fdc701fd60.png"],"imageUrl":"assets/gallery/f611de42896db0fdc701fd60.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"宮武蒼惟　miyatake aoi","title":"2026ワールドカップ出場時間と得点数の関係性","tools":"tableau public","projectUrl":"https://public.tableau.com/app/profile/.65337180/viz/2026_17926711148620/1?publish=yes\u0026showOnboarding=true","description":"① どのデータを選んだか\nサッカーワールドカップ2026\n② どのように可視化したか\n横軸を得点数、縦軸をアシスト数とした散布図で表現した。また、選手のポジションごとに色を変え、円の大きさによって選手ごとの成績の違いも表した。\n③ 可視化によって何が見えるようになったか\n出場時間が長ければ点が取れるわけではないことがわかる。得点数やアシスト数が多い選手と、少ない選手の違いが分かるようになった。また、フォワード（FW）は得点数の多い選手が目立ち、ポジションによって成績の傾向が異なることも確認できた。\n④ 表現上の工夫または選択を一つ\nポジションごとに色を分けたことが工夫した点である。色によってFW、MF、DFを区別できるため、ポジションごとの成績を比較しやすくした。","imageIndex":203,"imageCount":1,"imageUrls":["assets/gallery/02b0393d008bea7c0f7631f1.png"],"imageUrl":"assets/gallery/02b0393d008bea7c0f7631f1.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"桑久保陽平 Kuwakubo Youhei","title":"Minecraft 鉱石生成量","tools":"tableau","projectUrl":"https://public.tableau.com/views/1_17926359645230/1_1?:language=en-US\u0026publish=yes\u0026:sid=\u0026:redirect=auth\u0026:display_count=n\u0026:origin=viz_share_link","description":"1.マイクラの鉱石のデータ\n2.折れ線グラフ\n3.高さ別生成量および合計の生成量\n4.種類別のグラフは色を実際にアイテムに合わせて見やすくした","imageIndex":187,"imageCount":1,"imageUrls":["assets/gallery/8936587fe355ae2142d5ecf3.png"],"imageUrl":"assets/gallery/8936587fe355ae2142d5ecf3.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"黒川旺汰　Kurokawa Outa","title":"距離の違いによる旅行者の人数の違い","tools":"chat gpt Tableau Public","projectUrl":"https://www.mlit.go.jp/kankocho/tokei_hakusyo/shukuhakutokei.html?utm_source=chatgpt.com","description":"①観光庁の「宿泊旅行統計調査」から、2026年7月の国・地域別外国人延べ宿泊者数のデータを選びました。 \n②各国・地域の首都などから東京までの直線距離によってどれぐらい旅行者の数に違いがあるのかを可視化しました。\n③高ければ旅行者は多くなるがある一定の距離を超えるとそこまで距離によっての差はなく別の要因が大きく関係しているのではないかと感じました。\n④元のデータには距離のデータは入ってなかったのでchat gptにお願いして追加してもらいました。","imageIndex":196,"imageCount":1,"imageUrls":["assets/gallery/0357693ef213ae8ec1e5b053.png"],"imageUrl":"assets/gallery/0357693ef213ae8ec1e5b053.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-18","studentName":"佐藤陸  Riku Sato","title":"野菜の価格変動","tools":"Table","projectUrl":"https://public.tableau.com/app/profile/.11316593/viz/2_17919518237690/1_1?publish=yes","description":"①農林水産省の食品価格動向調査(野菜)を使いました。 \n②Tableのダッシュボードを使い前回から1日の価格を縦棒グラフで表示できるようにしました。\n③野菜の価格の推移とその日の価格を詳しく見れるようになりました\n④前回から色の使い方を変えました。（トマトを赤など）\n　1日の価格をフィルターで見れるようにしたことで、自分が見たい日の価格を詳しく見れるようにしました。","imageIndex":171,"imageCount":1,"imageUrls":["assets/gallery/a4d562c095e6481d5cf9dc7c.png"],"imageUrl":"assets/gallery/a4d562c095e6481d5cf9dc7c.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"坂本快　Kai Sakamoto","title":"トリッカル・もちもちほっぺ大作戦1周年人気投票ランキングTOP30","tools":"Tableau","projectUrl":"https://public.tableau.com/views/1254810976_DataVisualization04/1_1?:language=ja-JP\u0026publish=yes\u0026:sid=\u0026:redirect=auth\u0026:display_count=n\u0026:origin=viz_share_link","description":"①週刊ファミ通No.1966特集：トリッカル・もちもちほっぺ大作戦の「人気投票結果＆使徒紹介」からランキングと票数を取得 \n②トップ30（総票数1767）のランキング昇順でツリーマップにもう一つは種族ごとの累計得票数の横棒グラフ \n③マップの大きさの比でキャラクターの人気度の割合がわかるようになった \n④ツリーマップからキャラクターの名前をクリックするとそのキャラクターがどの種族で何票得たか横棒グラフの方でフィルタリングされる","imageIndex":200,"imageCount":2,"imageUrls":["assets/gallery/0b8bacefd6dd8f40fe41605f.png","assets/gallery/9418556da752d200f21f2924.png"],"imageUrl":"assets/gallery/0b8bacefd6dd8f40fe41605f.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"山口颯太","title":"インターネット利用率","tools":"Tableau","projectUrl":"https://ourworldindata.org/grapher/share-of-individuals-using-the-internet","description":"①Our World in Dataが公開している、国別のインターネット利用率（1990〜2025年、元データはITU・世界銀行）のデータを選びました。②上に2024年の利用率を色の濃さで表した世界地図、下に年ごとの推移を表す折れ線グラフを置き、地図で国をクリックすると下のグラフがその国の推移に絞り込まれるフィルターを付けました。③日本・韓国・中国・インド・ナイジェリアを比べると、韓国は2000年前後に急速に普及した一方、中国は2010年代に伸び続けて2023年ごろに日本を上回り、ナイジェリアは2024年でも約40%にとどまっていることが分かりました。④表現上の工夫として、データに含まれていた「Africa」「Asia」などの地域合計の行を除外し、国どうしだけを公平に比べられるようにしました。また、Ctrlキーを押しながら複数の国をクリックすると、気になる国を並べて比較できるようにしました。","imageIndex":211,"imageCount":1,"imageUrls":["assets/gallery/9ad549d3b0a05514a1bfc6c2.png"],"imageUrl":"assets/gallery/9ad549d3b0a05514a1bfc6c2.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"山口颯太　Yamaguchi Souta","title":"インターネット利用率","tools":"Tableau","projectUrl":"https://ourworldindata.org/grapher/share-of-individuals-using-the-internet","description":"①Our World in Dataが公開している、国別のインターネット利用率（1990〜2025年、元データはITU・世界銀行）のデータを選びました。②上に2024年の利用率を色の濃さで表した世界地図、下に年ごとの推移を表す折れ線グラフを置き、地図で国をクリックすると下のグラフがその国の推移に絞り込まれるフィルターを付けました。③日本・韓国・中国・インド・ナイジェリアを比べると、韓国は2000年前後に急速に普及した一方、中国は2010年代に伸び続けて2023年ごろに日本を上回り、ナイジェリアは2024年でも約40%にとどまっていることが分かりました。④表現上の工夫として、データに含まれていた「Africa」「Asia」などの地域合計の行を除外し、国どうしだけを公平に比べられるようにしました。また、Ctrlキーを押しながら複数の国をクリックすると、気になる国を並べて比較できるようにしました。","imageIndex":213,"imageCount":1,"imageUrls":["assets/gallery/346436e7a905c4f6b01e7130.png"],"imageUrl":"assets/gallery/346436e7a905c4f6b01e7130.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-16","studentName":"山崎来斗　Yamasaki Raito","title":"都道府県別の大学生数と国公私立別の大学生数","tools":"Tableau Public","projectUrl":"https://www.mext.go.jp/b_menu/toukei/chousa01/kihon/1267995.htm","description":"①都道府県別の大学生数と国公私立別の大学生数\n②シート１では学生数を棒グラフにして降順にしました。シート２では国公私立別の大学生数を棒グラフ、降順を行いました。\n③学生数の上位は圧倒的に私立大学が多く目立ちます。一方、学生数のランキングが下がるごとに私立大学の割合は低下していき、国立大学の割合が増えてきます。ダッシュボードを活用したことで新たに気づくことが出来ました。\n④都道府県別でデータを比較するので「合計」「外国」の項目は除外しました。","imageIndex":163,"imageCount":1,"imageUrls":["assets/gallery/e03242b634e6140491968293.png"],"imageUrl":"assets/gallery/e03242b634e6140491968293.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"山本涼美　Yamamoto Suzumi","title":"千葉ロッテマリーンズ打者別の傾向分析","tools":"Tableau","projectUrl":"https://npb.jp/bis/2026/stats/idb1_m.html","description":"1、　2026年千葉ロッテマリーンズ一軍選手成績\n2、ダッシュボードを活用して選手別の得意分野や、チームの得点傾向などについて散布図と棒グラフを組み合わせたボードを作成した\n3、小川選手は打者であるが得点源は少ないものの、出場試合数が非常に多いことから打つことより守備で活躍している場面が多いのではないかということが考えられる。他の選手でもずば抜けた項目がありながらも値が低い項目もあり選手一人ひとりの得意とする分野が明確になることが分かった。\n4、選手の成績はたくさんの項目がありすべてを入れると見ずらい為に分析したい内容に合わせてどのデータをどのくらい使うべきかを自分で考えて作成することを心掛けて作った。また、","imageIndex":188,"imageCount":1,"imageUrls":["assets/gallery/872c235ce6187567705ac64c.png"],"imageUrl":"assets/gallery/872c235ce6187567705ac64c.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"柴田尚槻　Naoki Shibata","title":"都市別年平均気温の可視化","tools":"Tableau、Excel","projectUrl":"制作物（https://public.tableau.com/app/profile/naoki.shibata4658/viz/_17926612789170/sheet2?publish=yes）、気温データ（https://www.data.jma.go.jp/cpdinfo/himr/himr_temp3.html）","description":"１，\n気象庁より大都市における年平均した平均気温のデータを選んだ。\n２，\n上部には全11都市の傾向を強調した折れ線グラフを配置し、下部には都市別のヒートマップを配置した。\n３，\n可視化によって温暖化の傾向が可視化され11都市の中で「仙台」「東京」「福岡」が比較的強い傾向を持っていることが分かった。\n４，\n表現上の工夫として、ヒートマップの色を2色の分化にすることで気温の変化をわかりやすくした。","imageIndex":197,"imageCount":1,"imageUrls":["assets/gallery/794db0c56cf463095e76d4aa.png"],"imageUrl":"assets/gallery/794db0c56cf463095e76d4aa.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"小川望　Nozomu Ogawa","title":"Pokemon type and physical","tools":"Tableau","projectUrl":"https://public.tableau.com/app/profile/.21388843/viz/pokemon_17926785453980/1_1?publish=yes","description":"１，授業で扱ったポケモンのデータの気になった部分\n２，Tableauでグラフを作成\n３，ポケモンが持つタイプの分布の仕方と、ポケモンの体重と身長の関係\n４，シンプルに見やすいものを作りました。一枚でわかるような余計な情報を入れていないグラフです。ただ、その分味気なくなってしまったかもしれませんが、そんな時なひこうタイプを見てください。","imageIndex":212,"imageCount":1,"imageUrls":["assets/gallery/7670e1208b0b716a52856a16.png"],"imageUrl":"assets/gallery/7670e1208b0b716a52856a16.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-19","studentName":"松村輝 Hikaru Matsumura","title":"系統から見える周回時間と手順の長さの関係","tools":"tableau claude","projectUrl":"自作のパズドラ周回編成サイト「周回レシート図鑑」の登録データ（133編成、2026年10月時点）　https://padultima127.github.io/shukai-receipt/","description":"2つのシート（周回時間×手順の文字数の散布図と、ダンジョン別の中央値の横棒グラフ）を1つのダッシュボードにまとめ、「ダンジョン系統（王・守護者・龍）」のフィルターで両方を同時に絞り込めるようにした。龍に絞ると、周回が速く手順も短い編成が多く、王に絞ると手順が長いダンジョンが上位に並ぶ。守護者に絞ると、月の守護者は周回時間が最も長い（中央値約17.6分）のに、手順の長さ（約514字）は太陽の守護者（約605字）より短く、時間の長さと手順の手間が一致しないことが見える。","imageIndex":174,"imageCount":1,"imageUrls":["assets/gallery/6f6b1af005ed2ef419c6a92c.png"],"imageUrl":"assets/gallery/6f6b1af005ed2ef419c6a92c.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"森本颯太 Souta Morimoto","title":"FIFAランキング世界地図 ― 1992〜2024年の順位変動","tools":"Tableau Public","projectUrl":"https://public.tableau.com/shared/383SMNGXW?:display_count=n\u0026:origin=viz_share_link","description":"①KaggleのFIFA男子ランキング(1992〜2024年)から、各年の最後の順位を使いました。②世界地図で順位を色分けし、国をクリックすると、その国の順位推移が折れ線に表示されるようにしました。年はスライダーで切り替えられます。③1992年はドイツとイタリアが同率1位でしたが、2024年はアルゼンチンが1位で、トップの顔ぶれが大きく入れ替わっています。日本は1992年の66位から2024年の15位まで上がり、途中で何度か上下しながら全体として上昇していることが読み取れます。④折れ線は国が200以上あって見づらいため、地図で国を選ぶ操作で絞り込めるようにしました。なお、FIFAではイギリスが4チームに分かれているため、地図では表示されませんでした。","imageIndex":217,"imageCount":1,"imageUrls":["assets/gallery/da2f562d995acdd68a3c4e6a.png"],"imageUrl":"assets/gallery/da2f562d995acdd68a3c4e6a.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"神戸宗一郎","title":"MC victory road","tools":"tableau","projectUrl":"https://mcbattlenow.com/database/mc/c682f001-d525-438f-8d56-7978cc0cd965","description":"1,MCバトル優勝者たちの統計優勝回数とその年、優勝した大会\n2,MCの合計優勝回数を棒グラフにし昇順に、大会を年と大会にしポイントと色で可視化した。\n3,本当に強いMCは誰なのか、その大会に強いMCは誰なのか、MCの全盛期はいつだったのか可視化できる。\n4,シート1をフィルターにすることで、数十種類のMCのデータを可視化することができる。","imageIndex":190,"imageCount":2,"imageUrls":["assets/gallery/0e57352d7fb803a69eb80e5f.png","assets/gallery/624909be72020c0b61360b7c.png"],"imageUrl":"assets/gallery/0e57352d7fb803a69eb80e5f.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-19","studentName":"須藤蒼太　Souta Sutou","title":"台北YouBike・15 ODの日陰の時間変化","tools":"Python・JavaScript（データ整形と日陰の計算）、Tableau Public（可視化・ダッシュボード作成）","projectUrl":"https://drive.google.com/file/d/1ffwXIbu-IOyDmZpVFiOzGBGhDRbpPMxu/view?usp=drive_link","description":"発見とフィルターの短い説明\n同じ時刻でも、ODによって日陰距離や日陰率が異なることが分かった。日付・経路種別を選び、時間スライダーを動かすことで、各経路の日陰が時間とともにどう変わるかを比較できる。円の横位置は日陰距離、縦位置は日陰率、大きさは経路全体の距離を表している。\n\n作品へのURL：https://public.tableau.com/shared/TBQPTBJ3P?:display_count=n\u0026:origin=viz_share_link","imageIndex":172,"imageCount":2,"imageUrls":["assets/gallery/4a8d4d7db1516114aed07fa1.png","assets/gallery/d87622b6b4fbdea4fb3787ca.png"],"imageUrl":"assets/gallery/4a8d4d7db1516114aed07fa1.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"石引響 Ishibiki Hibiki","title":"モンスターハンター","tools":"Microsoft Excel/Tableau Public","projectUrl":"https://www.reddit.com/r/MonsterHunterWorld/comments/1ijsfrr/weapon_usage_rates_february_2025/?tl=ja/https://doropiza.com/monster-hunter-uriage-ranking/","description":"①モンスターハンターの武器使用率、各シリーズごとの売り上げのデータをExcelでまとめて使用しました。\n②武器使用率は棒グラフ、各シリーズの売り上げは売上高に応じて円の大きさに差異が生むようにしました。今回はメインシリーズを対象にし、シリーズごとに色を割り振って可視化しました。\n③売り上げからモンスターハンターの人気と、年月に応じて売り上げを伸ばしていることが分かる。また、モンスターハンターワールドが歴代シリーズの中でも飛び抜けており、2000万本以上の売り上げを出している。\n④武器のアイコンを表示できるように、それぞれ対応するURLを用意しました。また、売り上げを細かく確認できるようにデータラベルを張り付けました。","imageIndex":215,"imageCount":1,"imageUrls":["assets/gallery/2a763ba71d56fd8554d32cec.png"],"imageUrl":"assets/gallery/2a763ba71d56fd8554d32cec.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"石川翔渉　Ishikawa Towa","title":"任天堂のゲーム機は時代によってどう変わった？","tools":"Tableau Public","projectUrl":"https://www.nintendo.co.jp/ir/finance/hard_soft/index.html","description":"① どのデータを選んだか\n任天堂の歴代ゲーム機について発売年、ゲーム機の種類、世界累計販売台数のデータを使用しました。\n\n② どのように可視化したか\nゲーム機ごとの販売台数を比較する横棒グラフと、発売年と販売台数の関係を見るグラフを作成し、1つのダッシュボードにまとめました。\n\n③ 可視化によって何が見えるようになったか\nNintendo SwitchやニンテンドーDSなどの販売台数が多いことや、ゲーム機によって販売台数に大きな差があることが分かりました。また、発売された年代による違いも比較できるようになりました。\n\n④ 表現上の工夫または選択\n据え置き、携帯、ハイブリッドを色分けし、種類ごとの違いが分かりやすくなるようにしました。また、種類を選択できるフィルターを付け、見たいゲーム機だけを比較できるようにしました。","imageIndex":189,"imageCount":2,"imageUrls":["assets/gallery/eb91926f3fce11e04ca6ab16.png","assets/gallery/9a99139ccee535ca37e0fc75.png"],"imageUrl":"assets/gallery/eb91926f3fce11e04ca6ab16.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-16","studentName":"赤塚絆　Akatsuka kizuna","title":"各国のGDP","tools":"Tableau","projectUrl":"https://1drv.ms/x/c/48FAEEE068DCA226/IQBNh1mbVBbxT7Cu-dZF1aitAT-1tZEJCMIH5OgMql1b5C4?e=VqGGDc","description":"①GDPとcountry\n②行にGDPに列にcountryを選択した \n③各国におけるGDPを比較できる \n④それによって一目で数値の高さを比較できるとう、各項目ごとに数値が高ければ大きく、低ければ小さくし、数値が高ければ色を濃く、低ければ色を薄く設定した。","imageIndex":164,"imageCount":1,"imageUrls":["assets/gallery/98dbd19d4029174b6d030491.png"],"imageUrl":"assets/gallery/98dbd19d4029174b6d030491.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"浅田寛弥　Asada　Hiroya","title":"オフィス機器・家具の売上分析ダッシュボード","tools":"Tableau Public","projectUrl":"https://www.tableau.com/ja-jp/resources/sample-data","description":"①データの選択：Tableauのサンプル売上データ（電化製品・家具・事務用品）を選択しました。\n②可視化の方法：カテゴリ別売上の棒グラフと月別売上推移の折れ線グラフをひとつのダッシュボードにまとめて可視化しました。\n③見えたこと（発見）：可視化を行った結果、秋から冬にかけて売上が伸びる傾向や、関東では電化製品、その他の地域では家具が売れるという地域ごとの需要特性を発見しました。\n④表現上の工夫：表現上の工夫として「地域」フィルターを配置し、選択した地域に応じて2つのグラフがリアルタイムに連動して切り替わる構成にしました。","imageIndex":205,"imageCount":1,"imageUrls":["assets/gallery/b2ee8621074a1e5b89f463fa.png"],"imageUrl":"assets/gallery/b2ee8621074a1e5b89f463fa.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"大友愛梨　Otomo Airi","title":"Sランクは本当に強いのか","tools":"Excel","projectUrl":"https://public.tableau.com/views/_17926711441190/1_1?:language=ja-JP\u0026:sid=\u0026:redirect=auth\u0026:display_count=n\u0026:origin=viz_share_link　http://xn--3-meuj0hj7183d2vjv0jcu0b.xyz/status-ranking.html","description":"①妖怪ウォッチ３の各妖怪の種族値②箱ひげ図やランキングのグラフにすることで可視化した。③Sランクの合計値最低キャラとEランクの最高値のキャラの値には大きく差がなかった。しかし一応ランクが上がれば合計値はおおむね増えていた。④種族で色分けしたのとランキングの横にランクを表示させた。","imageIndex":204,"imageCount":1,"imageUrls":["assets/gallery/bf622e428baab996a2a2059e.png"],"imageUrl":"assets/gallery/bf622e428baab996a2a2059e.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"大澤祥太郎　Shotaro Osawa","title":"VNL男子：サーブはリスクとリターンの関係","tools":"Tableau ChatGPT","projectUrl":"https://en.volleyballworld.com/volleyball/competitions/volleyball-nations-league/statistics/men/best-servers/","description":"VNL 2026男子のサーブ統計から、総サーブ数100本以上の87選手を可視化しました。左の散布図ではサーブミス率とサービスエース率の関係を示し、右の棒グラフではエース率の高い選手を比較できます。全体には正の相関（r = 0.64）があり、Hanes、Leon、Darlanはエース率が特に高いことが分かります。右の選手別棒グラフをクリックすると左の散布図がその選手に絞られるため、全体傾向の中で各選手の位置を確認できます。","imageIndex":209,"imageCount":1,"imageUrls":["assets/gallery/64b6f9922fe05bf04315e6b5.png"],"imageUrl":"assets/gallery/64b6f9922fe05bf04315e6b5.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-19","studentName":"猪狩蒼空　Igari Sora","title":"大学生がよく飲む飲み物の可視化","tools":"Tableau Public","projectUrl":"https://public.tableau.com/app/profile/.85233318/viz/3_17923934847630/1_1?publish=yes","description":"大学生がよく飲む飲み物に関するデータを選びました。棒グラフと円グラフを使って、飲み物ごとの割合を可視化しました。棒グラフでは、飲み物ごとの数値を比較でき、円グラフでは全体に占める割合を確認できます。また、棒グラフをクリックすると円グラフも連携するフィルターを設定し、飲み物ごとの情報を詳しく確認できるように工夫しました。","imageIndex":175,"imageCount":1,"imageUrls":["assets/gallery/61376e229c9480e69c8729d5.png"],"imageUrl":"assets/gallery/61376e229c9480e69c8729d5.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"桃井優　Yu Momoi","title":"ヨルシカのアルバム別・楽曲店舗と曲順の分析","tools":"Tableau","projectUrl":"https://public.tableau.com/views/2_17926775704980/1?:language=ja-JP\u0026publish=yes\u0026:sid=\u0026:redirect=auth\u0026:display_count=n\u0026:origin=viz_share_link","description":"アルバム別の一覧グラフをフィルターとして設定しました。任意のアルバムを選択すると、連動してその作品の曲順とBPMの推移グラフに絞り込まれる仕様にしています。\n全アルバムを俯瞰するとBPM120から140前後のアップテンポな楽曲が中心ですが、アルバムごとに絞り込むと、中盤に極端にテンポを落としたインストゥルメンタル楽曲を配置して物語全体の緩急を意図的に作っている構成が明確に確認できました。","imageIndex":208,"imageCount":1,"imageUrls":["assets/gallery/4c3f9991cfbd7a8b7c63c797.png"],"imageUrl":"assets/gallery/4c3f9991cfbd7a8b7c63c797.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-20","studentName":"藤井航己　Koki Fujii","title":"学年・科目別テスト点数分析","tools":"Excel,tableau","projectUrl":"https://www.kyoiku.metro.tokyo.lg.jp/documents/d/kyoiku/furoku_01","description":"今回は、学年別・科目別のテスト点数のサンプルデータを使用した。Tableauを使って、科目別平均点と学年別平均点をそれぞれ棒グラフで可視化した。グラフを比較することで、国語の平均点が最も高く、学年別では3年生の平均点が最も高いことが分かった。また、学年ごとにデータを切り替えられるフィルターを設置し、比較しやすいように工夫した。","imageIndex":180,"imageCount":1,"imageUrls":["assets/gallery/1bbe7c6b5c95ba45758a288d.png"],"imageUrl":"assets/gallery/1bbe7c6b5c95ba45758a288d.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-20","studentName":"藤原　叶","title":"月別の気温とアイスの支出金額にどのような関係があるのか？","tools":"Table Public","projectUrl":"https://public.tableau.com/app/profile/kanau.fujiwara/viz/_17923943420930/1_1?publish=yes","description":"私は、月別の気温とアイスの支出金額にどのような関係があるのかを調べるために、2つのデータを選んだ。棒グラフと折れ線グラフを組み合わせたグラフと散布図を作成し、1つのダッシュボードによって、月ごとの変化を比較しやすくした。グラフから、気温が高くなるにつれてアイスの支出金額も増加する傾向があり、特に7月から8月にかけて両方の数値が高くなることが分かった。フィルター特定の月のデータに絞って詳しく比較できるように工夫した。","imageIndex":177,"imageCount":1,"imageUrls":["assets/gallery/31144c16d9fb9730b76ae917.png"],"imageUrl":"assets/gallery/31144c16d9fb9730b76ae917.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"八重樫旺樹　yaegashi hiroki","title":"lol ffdate","tools":"tableau","projectUrl":"https://public.tableau.com/app/profile/hiroki.yaegashi/viz/lolFFdate/1_1?publish=yes","description":"今回は、League of Legendsの地域別・ランク別の降参率に関するデータを選んだ。ランクごとの降参率を棒グラフにし、地域ごとの降参率も比較できるように可視化した。これにより、地域やランクによって降参率にどのような違いがあるのかを確認できるようにした。また、地域のフィルターを付けることで、JPやKRなどの地域を切り替えて比較できるように工夫した。","imageIndex":206,"imageCount":1,"imageUrls":["assets/gallery/1922e08ee24a372e476386b2.png"],"imageUrl":"assets/gallery/1922e08ee24a372e476386b2.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"八木沼悠斗　Yaginuma Yuto","title":"県別漁獲量","tools":"TABLEAU","projectUrl":"https://public.tableau.com/app/profile/yaginuma.yuuto/viz/a240435y-DataVisualization-4/1?publish=yes","description":"①海面漁業漁獲量累年統計の中から県別の総合漁獲量と年代のみ抽出し活用した。 \n②年をページ、県別の漁獲量を色で表すことで県別の漁獲量がわかるようにした。\n③漁獲量が一番多いのは北海道であり、2位以降と大きな差があることがわかった。\n④ページを利用したデータにしたかったので、ページを移動させることで県の色を変化させる工夫をした。","imageIndex":192,"imageCount":2,"imageUrls":["assets/gallery/04320f5f1a3593bebe378f3a.png","assets/gallery/5dc00f0ced20d9e1e21c9ff1.png"],"imageUrl":"assets/gallery/04320f5f1a3593bebe378f3a.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-21","studentName":"北浦義就　Yoshiyuki Kitaura","title":"都道府県別のサバゲーマーの人数と歴","tools":"Tableau Public, Google Sheets","projectUrl":"https://public.tableau.com/shared/Q6G9YXZ3C?:display_count=n\u0026:origin=viz_share_link","description":"①サバゲーマーの主な活動地域と始めてからの歴\n②活動地域からマップでグラフを生成し都道府県別の人数のグラフと歴ごとの年齢層別の人数のグラフを作成した。\n③サバゲーマーの一部の間で噂されている「サバゲー衰退論(新規の人や若い年代の人達が減っているという説)」は回答者数が少ないためあまり参考にはならないが現時点ではいうほど衰退していないということが分かった。\n④マップの方の人数がぱっとわかるように円の下に人数をつけた","imageIndex":183,"imageCount":1,"imageUrls":["assets/gallery/8e0b79fc31ca9157db44e412.png"],"imageUrl":"assets/gallery/8e0b79fc31ca9157db44e412.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"木村英明　Kimura Hideaki","title":"ポケモンの身長体重可視化グラフ","tools":"Tableau　chatgpt","projectUrl":"https://github.com/PokeAPI/pokeapi/blob/master/data/v2/csv/pokemon.csv?utm_source=chatgpt.com","description":"①ポケモンのデータ②色や大きさで表した③似た目通りに重いポケモンは重いことが分かった④色で重さや身長の高さが分かるようにした","imageIndex":214,"imageCount":1,"imageUrls":["assets/gallery/93f2b818444ed54a00c00758.png"],"imageUrl":"assets/gallery/93f2b818444ed54a00c00758.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-20","studentName":"野村隆介　Nomura Ryuusuke","title":"米とパンの比較","tools":"タベロー","projectUrl":"https://www.e-stat.go.jp/stat-search/files?cycle=7\u0026data=1\u0026kikan=00200\u0026layout=dataset\u0026metadata=1\u0026page=1\u0026query=%E7%A9%80%E9%A1%9E\u0026result_back=1\u0026tclass1=000000330001\u0026tclass2=000000330004\u0026tclass3=000000330006\u0026tclass4val=0\u0026toukei=00200561\u0026tstat=000000330001\u0026utm_source=chatgpt.com","description":"今回は、2024年の米とパンの年間購入数量のデータを選んだ。Tableauを使い、地域ごとの購入数量を棒グラフで可視化し、米とパンを色分けして比較した。これにより、地域による購入数量の違いや、米とパンの購入量の差が分かりやすくなった。また、地域をフィルターで選択できるようにし、特定の地域に絞って比較できるように工夫した。","imageIndex":179,"imageCount":1,"imageUrls":["assets/gallery/7d077d13872d7c9456ce363d.png"],"imageUrl":"assets/gallery/7d077d13872d7c9456ce363d.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"矢部夢華　Yumeka Yabe","title":"ジブリ映画興行収入ランキング","tools":"Tableau","projectUrl":"https://public.tableau.com/app/profile/.66537061/viz/1_17926461473560/1_1?publish=yes","description":"ジブリ映画の作品名と興行収入のデータを選び、棒グラフを使って可視化した。横棒グラフと縦棒グラフを作成することで、作品ごとの興行収入の数値を表示し、データを見比べやすく工夫した。","imageIndex":193,"imageCount":1,"imageUrls":["assets/gallery/c6127b8c9946afed05db99ef.png"],"imageUrl":"assets/gallery/c6127b8c9946afed05db99ef.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-18","studentName":"林瞳　Akira Hayashi","title":"カンザキイオリ 成功ロジックモデル分析","tools":"Tableau Ecxel","projectUrl":"https://public.tableau.com/views/4_17921244400160/1_1?:language=ja-JP\u0026publish=yes\u0026:sid=\u0026:redirect=auth\u0026:display_count=n\u0026:origin=viz_share_link","description":"1. 選んだデータ・出典\n\nデータ名 / 出典： 授業配布データ（KPI_TimeSeries.csv）／ カンザキイオリ各種公開KPIデータ\n\n2. どのように可視化したか（表現上の工夫）\n\n可視化構成： 代表曲の認知獲得を示す「『命に嫌われている。』の推移」を上段に、その後の展開を示す「多角化・メディアミックス成果」を下段に配置したダッシュボードを作成しました。\n\n表現上の工夫： 下段グラフにおいて数値規模の乖離（数百から一桁・二桁）による潰れを防ぐため、Y軸の上限範囲を「30」にカスタム設定し、凡例を浮動配置することで視認性とレイアウトの美しさを両立させました。\n\n3. 可視化による発見\n\n発見内容： 代表曲『命に嫌われている。』による爆発的なヒット（2017〜2021年）を起点・基盤として、2020年以降の小説刊行や他アーティストへの楽曲プロデュースといった「多角化・メディアミックス展開」へ成果が連動して広がっていく成功プロセスが明確に見えるようになりました。\n\n4. フィルターの説明\n\nフィルター機能： 上段のグラフに漏斗アイコン（Use as Filter）を設定しました。上段の特定の「年」をクリックすることで、下段の多角化・メディアミックスデータがその年の値だけに自動的に絞り込まれ、インタラクティブに年度ごとの実績を確認できる仕組みにしています。","imageIndex":170,"imageCount":1,"imageUrls":["assets/gallery/05a930e3610265c7e389fa14.png"],"imageUrl":"assets/gallery/05a930e3610265c7e389fa14.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-17","studentName":"鈴木小太朗　Suzuki Kotarou","title":"プロ野球界の打低について","tools":"Tableau、Excel","projectUrl":"https://baseball-data.com/team/hitter.html","description":"①2009年から2025年までのプロ野球12球団のチーム打撃成績\n②打率や得点数、ホームラン数をグラフにして可視化した。\n③打低の年と打高の年が分かり、全体ホームラン数の推移が分かりやすくなった。\n④ダッシュボードの利用により、ホームランだけの推移を別で移すことによって、見やすくなった。","imageIndex":167,"imageCount":1,"imageUrls":["assets/gallery/65560d08c531d93534e2306c.png"],"imageUrl":"assets/gallery/65560d08c531d93534e2306c.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-19","studentName":"鈴木優　Yu Suzuki","title":"珍名・おもしろバス停マップ","tools":"tableau","projectUrl":"https://public.tableau.com/app/profile/.84256689/viz/_17921269069340/1_1, https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-P11-2022.html","description":"1. 発見：\n日本全国に点在する珍名・おもしろバス停の地理的な分布傾向と、カテゴリごとの偏りを1つの画面で同時に俯瞰できるようにしました。特定の地域やカテゴリに偏りがあるのか、あるいは全国津々浦々にユニークな名前のスポットが存在しているかを視覚的に明らかにしました。\n\n2. フィルターの説明：\n日本地図および右下のカテゴリ別棒グラフに「フィルターとして使用（Use as Filter）」機能を設定しました。地図上のエリアやグラフのバーをクリックすることで、連動して下部の詳細なテキスト表（都道府県・バス停名）が瞬時に絞り込まれ、気になるスポットの具体名をピンポイントで詳細に探求できるように工夫しました。","imageIndex":176,"imageCount":1,"imageUrls":["assets/gallery/4567394d1fabb502bfdf1147.png"],"imageUrl":"assets/gallery/4567394d1fabb502bfdf1147.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-22","studentName":"鈴木陽太","title":"2025年の謎","tools":"Excel","projectUrl":"犯罪統計｜警察庁Webサイト","description":"①警察庁が毎年出している犯罪統計データ\n②詐欺による被害が一番多いのは今年だけなのか調べるために令和全体のデータを棒グラフで表した\n③2019年から2024年までは10000件近い数しかなかったが2025年、2026年では2024年の4，5倍の件数被害にあっている\n④追加した令和の詐欺被害の件数のデータは一目見ただけでわかるほどグラフの大きさが違うのでそれをより強調した","imageIndex":216,"imageCount":1,"imageUrls":["assets/gallery/9f4c444b1ea18b3921ce67a2.png"],"imageUrl":"assets/gallery/9f4c444b1ea18b3921ce67a2.png"},{"week":4,"challenge":"第4週｜発見","submittedAt":"2026-10-21","studentName":"齋藤さくら　Sakura Saito","title":"映画の興行収入とナンバリング","tools":"Excel, Tableau","projectUrl":"https://reitakujp-my.sharepoint.com/:x:/g/personal/a250355s_reitaku_jp/IQCit-fLAxfCT5R7b4L5VGkOAazJUSBY4KiQvxUt8gC__30?rtime=MZH4yRQv30g","description":"春セメスターの別授業で集めたデータを使い、映画のナンバリング（その映画が何作目かを示す）と興行収入、公開年と興行収入の関係について調べた。 判例は画像上部と横に表示してある。 この可視化により、全体としては1より1以降の興行収入が落ちているように見えるが（二枚目）、SF/アメコミヒーローのジャンルにおいては2作目のほうが興行収入が高い傾向が見られた。工夫としては興行収入も公開年も数字としては大きいので、軸の最小値を調整したり、AIによるジャンル分けでどの映画ジャンルが興行収入を高くしているのかわかりやすくした。","imageIndex":182,"imageCount":2,"imageUrls":["assets/gallery/32c6e6f4732497d4565f47ce.png","assets/gallery/c063df8c887efb93a3f4a9eb.png"],"imageUrl":"assets/gallery/32c6e6f4732497d4565f47ce.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"Kimura Hideaki","title":"2024年度フォートナイトスキンの総数","tools":"Tableau、chatgpt","projectUrl":"https://github.com/YanehCheck/fortnite-cosmetic-list/blob/main/items.json","description":"①既にあったデータを選んだ、②chatgptが読み取りやすいようにCSVファイルにした③コラボ系ではマーベル系が多かった④色に気を付けた","imageIndex":155,"imageCount":1,"imageUrls":["assets/gallery/320d3ce62a0503015710057c.png"],"imageUrl":"assets/gallery/320d3ce62a0503015710057c.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-14","studentName":"Tim von Scharpen","title":"Global Football Talent Analytics","tools":"Tableau, Gemini, Google Colab","projectUrl":"I used Code to access data but I think it was from Github.","description":"The data I selected is Players Name, Average Value, Average Growth Potential and Country of Origin. I visualized it through a Heatmap and a Scatter Chart. First one to portray the Value for Countries to have a high ROI on their players, and the Scatter Chart shows specific players and categorizes them. That countries in the Americas have the highest ROI on their players. I employed the heatmap to portray where they come from and if you click on it the scatter chart below will only show the players from that country to better analysis. \nLink:https://public.tableau.com/views/DataVis_Homework/Dashboard1?:language=en-US\u0026:sid=\u0026:redirect=auth\u0026:display_count=n\u0026:origin=viz_share_link","imageIndex":127,"imageCount":1,"imageUrls":["assets/gallery/504a159bbf501e25c892a2fa.png"],"imageUrl":"assets/gallery/504a159bbf501e25c892a2fa.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"Welhemina Gansah","title":"Female labor force long run countries","tools":"Tableau","projectUrl":"https://ourworldindata.org/grapher/unemployment-rate-women?tab=discrete-bar\u0026time=2025\u0026country=NER~QAT~KOR~CAN","description":"I selected data from the World Bank on female labor force participation because its video playback view was very visual for me. It showed countries from South Korea to Niger changing over time, so I could see how women’s work was growing and who started where. In Tableau, I built something similar but different, using line charts of female participation by world region from 1990 to 2024, plus long-run lines for the U.S., Canada, Germany and the U.K. going back to the 1890s. The visualization made a large disparity (a noticeable difference between groups that might be expected to be similar) visible: in 2024, Sub-Saharan Africa was at about 65% while the Middle East and North Africa was at about 20%. My creative choice was to make the lines play over time, so you can watch who is growing, how they are growing, and who started where.","imageIndex":160,"imageCount":1,"imageUrls":["assets/gallery/b996638ce97c3fe445fc7fd9.png"],"imageUrl":"assets/gallery/b996638ce97c3fe445fc7fd9.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"グェンチャンサオマイ　Nguyen Tran Sao Mai","title":"Relationship Between Passenger Age, Ticket Fare, and Survival on the Titanic","tools":"Tableau","projectUrl":"Titanic Passenger List https://public.tableau.com/app/learn/sample-data","description":"This scatterplot shows the relationship between passenger age and ticket fare on the Titanic. Blue points represent survivors, and orange points represent non-survivors. The chart suggests that passengers who paid higher fares were more likely to survive, while age had a weaker effect on survival. I chose a scatterplot because it allows multiple variables (age, fare, and survival status) to be visualized in a single chart, making patterns easier to identify.","imageIndex":140,"imageCount":1,"imageUrls":["assets/gallery/01b0ae38bd483609d331384e.png"],"imageUrl":"assets/gallery/01b0ae38bd483609d331384e.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"ディララ・テズジャン Dilara Tezcan","title":"Who gets better at both serve and return? ATP tour, 1991–2025","tools":"Claude, Microsoft PowerPoint","projectUrl":"https://public.tableau.com/views/Tennis_17918959994060/Sheet1?:language=en-GB\u0026:sid=\u0026:redirect=auth\u0026:display_count=n\u0026:origin=viz_share_link","description":"I used ATP tour match data from Jeff Sackmann (Tennis Abstract), 1991–2025, and calculated for each player and season the share of service points won and the share of return points won; I kept the 40 players with the most matches each year (at least 30). Inspired by Hans Rosling's animated chart, I built an animated bubble chart: the x-axis shows service points won, the y-axis shows return points won, bubble size shows matches played, color shows the player's continent, and the bubbles move through the years. \nLink to tableau Public: https://public.tableau.com/views/Tennis_17918959994060/Sheet1?:language=en-GB\u0026:sid=\u0026:redirect=auth\u0026:display_count=n\u0026:origin=viz_share_link","imageIndex":134,"imageCount":2,"imageUrls":["assets/gallery/e601b68d4fe53fa36b9f3efe.png","assets/gallery/dd2cf8cb93585a242dab8607.png"],"imageUrl":"assets/gallery/e601b68d4fe53fa36b9f3efe.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-10","studentName":"モンテッラ エドウィン　Montella Edwin","title":"Japan vs. the U.S.: How the Big Mac Price Flipped (2000–2026)","tools":"Tableau, Claude","projectUrl":"https://github.com/TheEconomist/big-mac-data https://www.economist.com/big-mac-index","description":"①The Economistが公開している「ビッグマック指数」（2000〜2026年、2000年は28か国・2026年は54か国）を使い、各国のビッグマック価格（米ドル換算）と1人当たりGDPのデータを選びました。②ハンス・ロスリングのグラフを参考に、横軸を1人当たりGDP（対数）、縦軸をビッグマック価格とする散布図を作りました。各国をハンバーガーのアイコンで表し、アイコンの大きさでアメリカと比べた価格の比率を示しています。③その結果、豊かな国ほどビッグマックが高い傾向がある一方で、日本は2000年にはアメリカより高かった（2.77ドル対2.24ドル）のに、2026年にはアメリカの約半分（3.08ドル対6.22ドル）になり、価格が逆転したことが見えるようになりました。④表現上の工夫として、アメリカの価格を赤い基準線で示し、日本とアメリカだけをハイライトしました。他の国は背景として残しつつ、2国の位置関係と変化がひと目で分かるようにしています。","imageIndex":116,"imageCount":2,"imageUrls":["assets/gallery/67ea6604c06ad9c236373eec.png","assets/gallery/71bc61c3b5f9a4e9660b6bda.png"],"imageUrl":"assets/gallery/67ea6604c06ad9c236373eec.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-13","studentName":"粟野翔　Awano Kakeru","title":"石炭使用量はどのように推移したか","tools":"Tableau","projectUrl":"https://catalog.ourworldindata.org/energy/owid_energy","description":"①ourworldindataのEnergy dataset：石炭使用量　1985年からのデータ②国ごとの石炭使用量を推移を棒グラフで可視化。③デンマークの石炭使用量が大きく減少した。1991~1997年は5000kwhを超えていた。その後徐々に石炭使用量が減少し、2025年には148kwhまで減少した。④実際には1900年からのデータがあったが、国同士の比較を目的にしたため年数を限定し見やすくした。","imageIndex":126,"imageCount":1,"imageUrls":["assets/gallery/2aa1d479d36036e348c2e4ca.png"],"imageUrl":"assets/gallery/2aa1d479d36036e348c2e4ca.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-13","studentName":"伊藤拓哉　Ito Takuya","title":"2022年Spotify国内Top200における再生数とDanceability(踊りやすさ)の相関","tools":"Kaggle","projectUrl":"https://www.kaggle.com/search?q=spotify+dataset+%2F+spotify+top+songs+Japan","description":"①近年ストリーミングサービスでヒットする楽曲の多様化が進む中、日本国内で多くの再生数を獲得している楽曲に共通する音響特性（ダンス度・テンポなど）が存在するのかを検証するため、2022年のSpotify国内Top200の楽曲データを選定しました。②散布図（X軸：合計Streams［再生回数］、Y軸：合計Danceability［ダンス度・踊りやすさ］③分析の結果、全体としては再生数が多くなるにつれてグラフ右側の特定のダンス度領域（150〜250付近）にヒット曲が集中的に分布していることが判明しました。\n特に『W/X/Y』や『シンデレラボーイ』『ベテルギウス』などの2022年を代表する大ヒット曲は、極端にダンス度が高いわけではなく、中程度の心地よいリズム感を持った楽曲に集中しています。一方で『KICK BACK』や『新時代』のように比較的ダンス度が低め（あるいは独自のリズム構造）でありながら爆発的な再生数を記録している例外的な作品もあり、大ヒット曲の中にも「王道のリズム傾向」と「独自性で勝負する作品」の二極化が存在することが視覚的に裏付けられました。④再生回数をプロットの大きさと色の濃淡（オレンジ〜青のグラデーションの2要素に二重で紐づけることで、ランキング上位の超メガヒット曲が散布図上のどの位置に集まっているかを視覚的に際立たせる工夫をしました。","imageIndex":125,"imageCount":1,"imageUrls":["assets/gallery/6d2a984e503f4c0672db59ab.png"],"imageUrl":"assets/gallery/6d2a984e503f4c0672db59ab.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-09","studentName":"伊澤颯馬　Soma Izawa","title":"東京駅　利用者推移","tools":"tableau　Claude","projectUrl":"https://www.jreast.co.jp/company/data/passenger/　https://public.tableau.com/app/profile/izawa.soma/viz/_17915496275990/sheet0?publish=yes","description":"東京駅の一日当たりの利用者平均を在来線、JR東日本管轄の新幹線、JR東海管轄の新幹線に分け、それを複数年集計し、claudeにエクセル（CSV）形式にさせた。その後、tableauで積み上げ面グラフを作った。カーソルを合わせると前年比の増減を％で、＋なら黒字、－なら赤字とし、より視覚的にわかりやすくした。大きな事象に注釈、そして利用人口の多い在来線をオレンジとした。今回のグラフによって、2020年にコロナの影響で利用者が格段に減った一方、東日本及び東海管轄の新幹線は前年比－65%越えに対し、在来線は－36.5%に留まっていることから、在来線は新幹線よりは安定した利用客が見込めると考えた。","imageIndex":115,"imageCount":1,"imageUrls":["assets/gallery/230229e148678d3a08ed349d.png"],"imageUrl":"assets/gallery/230229e148678d3a08ed349d.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-09","studentName":"永野虎太郎　Kotaro Nagano","title":"阪神活躍率","tools":"https://public.tableau.com/newWorkbook/a24c51d6-eba9-40b3-8212-f2238c06afd5#1","projectUrl":"https://baseball.yahoo.co.jp/npb/teams/5/battingstats","description":"1.前回のものをグラフ化してみました。2.今回は活躍の指数を出すOPSは出塁率と長打率を縦と横にしてそこに打席数を大きさで表せた。3.これにより多くの試合に出た持続的に活躍する選手が帆と目で判断できるようになっています。4.工夫点としては大きさと守備位置を変換をすることによりそのポジションの難しさがわかった。","imageIndex":112,"imageCount":1,"imageUrls":["assets/gallery/21098dd849715476453a11a1.png"],"imageUrl":"assets/gallery/21098dd849715476453a11a1.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"奥田昭真　Shoma Okuda","title":"若者は都市と大学のまちに集まる ― 都道府県別 15〜29歳の割合（2024年）","tools":"Claude","projectUrl":"https://www.e-stat.go.jp/stat-search/files?page=1\u0026layout=datalist\u0026lid=000001457290","description":"①e-stats「人口推計（2024年）」の都道府県別・年齢別人口を使い、15〜29歳の人口が総人口に占める割合（若者割合）を計算しました。②Tableauで、若者割合を色で表した日本地図と、47都道府県を高い順に並べた棒グラフを作りました。③若者割合が最も高いのは東京都（17.6%）、最も低いのは秋田県（10.4%）で、大都市圏が上位を占める一方、京都府が2位に入っており、大学の多さが影響していると考えられます。また地図では、東北や四国で若者割合が低い県がまとまっていることが見えるようになりました。④色は、全国の値（14.7%）を中央にしたオレンジと青の2色にし、全国より若者が多い県と少ない県が一目で分かるようにしました。","imageIndex":146,"imageCount":2,"imageUrls":["assets/gallery/7a909185f8428ef589527bb6.png","assets/gallery/d77f634a83b241fb197d2936.png"],"imageUrl":"assets/gallery/7a909185f8428ef589527bb6.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"岡本結衣　Okamoto Yui","title":"都道府県別人口ランキング","tools":"tableau","projectUrl":"貼れないです泣","description":"① 2020年の国勢調査による都道府県別の人口データを選んだ。\n② Tableauを使って、47都道府県の人口を棒グラフで可視化し、人口が多い順に並べた。\n③ 東京都や神奈川県など人口の多い地域と、人口の少ない地域の違いが分かりやすくなった。\n④ 人口の多い順に並べることで、都道府県ごとの順位や人口の差を比較しやすくした。","imageIndex":136,"imageCount":1,"imageUrls":["assets/gallery/62e2a158c6aa4c64a133552f.png"],"imageUrl":"assets/gallery/62e2a158c6aa4c64a133552f.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-12","studentName":"岡野俊介　Syunsuke Okano","title":"オリックス・バファローズ：防御率の劇的改善と勝率のV字回復（2015-2024)","tools":"Tableau","projectUrl":"NPB（日本野球機構）年度別チーム成績（https://npb.jp/bis/teams/yearly_b.html）","description":"オリックス・バファローズが最下位から3連覇へと急浮上した要因を探すために、2015〜2024年の勝率・チーム防御率・順位のデータを選びました。上の段には勝率と防御率の2軸推移グラフ、下の段にはその2つの関係性を確かめる散布図と傾向線を配置して可視化しています。グラフ化してみると、勝率のアップと防御率の改善が驚くほどきれいに連動しており、チームのV字回復を支えた最大の強みが投手力だったことが視覚的にハッキリ分かりました。工夫した点は、防御率は数字が小さいほど優秀な指標なので、軸を上下反転させてグラフが上にいくほど成績が良い、と直感的に伝わるようにしたところです。","imageIndex":120,"imageCount":1,"imageUrls":["assets/gallery/ee7ea4cddc710b417ed2ea9e.png"],"imageUrl":"assets/gallery/ee7ea4cddc710b417ed2ea9e.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-12","studentName":"岡悠斗","title":"1人当たりのGDP と平均寿命","tools":"excel","projectUrl":"Hans CSV","description":"①HansCSV\n②散布図で表し横軸に平均寿命、縦軸に1人当たりのGDPを当てはめた。\n③一人当たりのGDPと平均寿命は正の\n相関が見えてきた。だがデータの可視化（というよりグラフ化）はただ単にそのデータの規則性や法則性をわかりやすく伝えるだけでなく、例外を見つけることが容易になる。この散布図を見ていると一番目に付くのはmonacoだと個人的に思う。\n④多くの国を詰め込んであるので色を各地域に分けて設定している。それぞれの国の名前を表示している。","imageIndex":119,"imageCount":1,"imageUrls":["assets/gallery/23f8e9cd48ae3e3156bd1fad.png"],"imageUrl":"assets/gallery/23f8e9cd48ae3e3156bd1fad.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-13","studentName":"我如古隼人","title":"世界のCO₂排出量から見る国ごとの違いと変化","tools":"Tableau Public","projectUrl":"https://github.com/owid/co2-data","description":"世界各国のCO₂排出量の違いを調べるため、Our World in Dataのデータを使用しました。Tableauを使って、国ごとの排出量を色の濃さで表した世界地図と、排出量の多い順に並べた棒グラフを作成しました。可視化した結果、中国やアメリカなどの排出量が特に多く、国によって大きな差があることが分かりました。また、地図では年代を切り替えられるようにし、排出量の変化を視覚的に比較できるよう工夫しました。","imageIndex":123,"imageCount":2,"imageUrls":["assets/gallery/216230cf9dab63542710da6f.png","assets/gallery/8efc1530e7f8a2b10c7c5b89.png"],"imageUrl":"assets/gallery/216230cf9dab63542710da6f.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"貝賀杏奈　anna kaiga","title":"自分がみた今までの映画","tools":"Excel、タブロロ","projectUrl":"https://public.tableau.com/app/profile/anna.kaiga/viz/1_17920745242980/1?publish=yes","description":"今回も自分が見た映画のデータを使いました。今回は世界興行収入でバブルが大きいほど人気の映画だとわかるようにしました。本当はジャンル別で色を分けようと思いましたがデータが消えてしまってジャンル分けすることができませんでした","imageIndex":158,"imageCount":1,"imageUrls":["assets/gallery/a741e0206e69cf17810d845a.png"],"imageUrl":"assets/gallery/a741e0206e69cf17810d845a.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-09","studentName":"柿木奏太　KakinokiSouta","title":"GDPTier表","tools":"Tableau、TierMakerPro","projectUrl":"https://reitakujp-my.sharepoint.com/:x:/g/personal/a250829s_reitaku_jp/IQC9KG-dasicQKYIj-9KNsZtAfXFxps6dcwMjvKeA7bIqb8?e=1bAlBt","description":"①TableauのGDP\n②世界地図にしてGDPをマーカーの上にカーソルを置いたら可視化されるようにして、それをTier（ランキング形式）にして見やすくした。\n③GDPの値が多い国の名称\n④ただのマーカーの画像ではすごく見にくいので、Tier表にしてどの国が多いのかを見やすくした。","imageIndex":114,"imageCount":2,"imageUrls":["assets/gallery/5642ed6ef5e1d75bfef7eac5.png","assets/gallery/9f00fc3053adda4168ff362e.png"],"imageUrl":"assets/gallery/5642ed6ef5e1d75bfef7eac5.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"岩田知機　iwata chiki","title":"推し活の当落","tools":"Tableau","projectUrl":"https://docs.google.com/spreadsheets/d/1Blz-dGHC1LSv-LsM9NzBNjiXCZ7QFW6cYl3jbHLQ7dg/edit?usp=sharing","description":"①推し活の当落データ②バブル型にしてバブルの大きさの変化で買った枚数を表した。③多く買った方が当たりやすくなることと、種類によって買った枚数の差があることが分かった。④当たったものだけ色を付けたり当たった枚数を表示することによって何が当たったのかを分かりやすくした。","imageIndex":141,"imageCount":2,"imageUrls":["assets/gallery/6bd1c70f8288553c55ae03ce.png","assets/gallery/c9c5a409894dc1661b57c8db.png"],"imageUrl":"assets/gallery/6bd1c70f8288553c55ae03ce.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"吉野翔大　Shota Yoshino","title":"GDPとLife Expectancyの分散","tools":"Tableau","projectUrl":"Hansデータ","description":"Hansデータを使って、合計(population)、Country, Regionを数値で見れるようにした。国ごとにGDPとその国がどれくらいの人口がいるのかなど見れるようになった。また、大陸事に６つに色分けして、大体この大陸はこれくらいあるんだなという風に見れるように工夫しました。","imageIndex":152,"imageCount":1,"imageUrls":["assets/gallery/9a8d0de5391037f36a393b55.jpg"],"imageUrl":"assets/gallery/9a8d0de5391037f36a393b55.jpg"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-14","studentName":"桑久保陽平 Youhei Kuwakubo","title":"Minecraft 鉱石生成量 -Tableau Ver-","tools":"tableau","projectUrl":"https://ja.minecraft.wiki/w/%E9%89%B1%E7%9F%B3","description":"①第1.2回同様マイクラの鉱石の生成量の分布データを選んだ\n②折れ線グラフにまとめて、ぱっと見るだけでも大まかな値が分かるようにした\n③高さ別の各鉱石の生成量が数値として見えるようになった\n④グラフの線にカーソルを合わせると鉱石の種類と数値が表示されるようになっているのでより正確な値がわかりやすくなった","imageIndex":131,"imageCount":2,"imageUrls":["assets/gallery/64a8e0432be69ad92c813321.png","assets/gallery/01a32f1645b029dce87e2367.png"],"imageUrl":"assets/gallery/64a8e0432be69ad92c813321.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-14","studentName":"黒川 旺汰　Kurokawa Outa","title":"どの国・地域の人が日本に多く宿泊している？―2026年7月","tools":"chat gbt　Tableau","projectUrl":"https://www.mlit.go.jp/kankocho/tokei_hakusyo/shukuhakutokei.html?utm_source=chatgpt.com","description":"①\n観光庁の「宿泊旅行統計調査」から、2026年7月の国・地域別外国人延べ宿泊者数のデータを選びました。\n②\nTableauを使い、横軸に国・地域、縦軸に延べ宿泊者数を置いた棒グラフで可視化しました。\n③\nこれにより、台湾が最も多く、次いで中国、韓国、米国の順に多いことや、国・地域による宿泊者数の差が確認しやすくなりました。\n④\n国・地域ごとの宿泊者数の違いを棒の長さで比較しやすくするため、棒グラフを選び、元のデータをTableauで扱いやすい形に整理する際には、使いたいデータと可視化の目的をChatGPTに伝えて活用しました。","imageIndex":132,"imageCount":1,"imageUrls":["assets/gallery/36dc7eba9f88e5767a4c7719.png"],"imageUrl":"assets/gallery/36dc7eba9f88e5767a4c7719.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-14","studentName":"佐藤陸　Riku Sato","title":"野菜価格の変動","tools":"Tableau","projectUrl":"https://www.maff.go.jp/j/zyukyu/anpo/kouri/k_yasai/h22index.html","description":"①農林水産省の食品価格動向調査(野菜)を使いました。\n②EXCELでデータを少し調整して、Tableで折れ線グラフを使い可視化をしました。\n③野菜の価格変動でトマトの推移が一番大きいことがわかりました。\n④いろいろな野菜の比較をしたかったので折れ線で一つのグラフにまとめるという工夫をしました。Tableを使うのが初めてで難しくできなかったが時間別に再生できるようにしたいと思いました。","imageIndex":128,"imageCount":1,"imageUrls":["assets/gallery/fe82c53454cc1e4c28a57227.png"],"imageUrl":"assets/gallery/fe82c53454cc1e4c28a57227.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"坂本快　Kai Sakamoto","title":"トリッカル人気投票ランキング","tools":"Excel, Tableau","projectUrl":"https://docs.google.com/spreadsheets/d/1wifhqYVdhb6B-AJFvaMXwTPBZzGHYJWM_O0LutRjdCc/edit?usp=sharing","description":"①週刊ファミ通No.1966特集：トリッカル・もちもちほっぺ大作戦の「人気投票結果＆使徒紹介」からランキングと票数を取得\n②トップ30（総票数1767）のランキング昇順でツリーマップに\n③マップの大きさの比でキャラクターの人気度の割合がわかるようになった\n④1列目がトップ３、2列目が4~8位とある程度のまとまりを持って並べられるようにレイアウトを調節しました。","imageIndex":149,"imageCount":1,"imageUrls":["assets/gallery/121137c8ac7197fc96a033ce.png"],"imageUrl":"assets/gallery/121137c8ac7197fc96a033ce.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"坂野真人　Masato Sakano","title":"ポケモンタイプ別の平均攻撃力","tools":"Tableau Public","projectUrl":"https://github.com/lgreski/pokemonData/blob/master/Pokemon.xlsx","description":"① ポケモンのタイプ別の平均攻撃力のデータを選んだ。データには、むしタイプやほのおタイプ、ドラゴンタイプなど、さまざまなタイプのポケモンの攻撃力が含まれている。\n② Tableau Publicを使い、タイプごとの平均攻撃力を棒グラフで可視化し、それぞれの数値を比較できるようにした。\n③ グラフから、かくとうタイプやドラゴンタイプは平均攻撃力が高く、むしタイプやフェアリータイプは比較的低いことが分かった。また、タイプによって平均攻撃力に違いがあることも確認できた。\n④ 表現上の工夫として、タイプごとに棒の色を変え、右側に凡例を表示した。これにより、各タイプを区別しやすくなり、どのタイプの平均攻撃力が高いのかを視覚的に比較できるようにした。","imageIndex":156,"imageCount":1,"imageUrls":["assets/gallery/f2c35fdfafc2e0605d0b8b00.png"],"imageUrl":"assets/gallery/f2c35fdfafc2e0605d0b8b00.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-22","studentName":"山口颯太　Yamaguchi Souta","title":"インターネット利用率","tools":"Tableau","projectUrl":"https://public.tableau.com/shared/59SFQK98B?:display_count=n\u0026:origin=viz_share_link","description":"①Our World in Dataが公開している、国別のインターネット利用率（1990〜2025年、元データはITU・世界銀行）のデータを選びました。②上に2024年の利用率を色の濃さで表した世界地図、下に年ごとの推移を表す折れ線グラフを置き、地図で国をクリックすると下のグラフがその国の推移に絞り込まれるフィルターを付けました。③日本・韓国・中国・インド・ナイジェリアを比べると、韓国は2000年前後に急速に普及した一方、中国は2010年代に伸び続けて2023年ごろに日本を上回り、ナイジェリアは2024年でも約40%にとどまっていることが分かりました。④表現上の工夫として、データに含まれていた「Africa」「Asia」などの地域合計の行を除外し、国どうしだけを公平に比べられるようにしました。また、Ctrlキーを押しながら複数の国をクリックすると、気になる国を並べて比較できるようにしました。","imageIndex":210,"imageCount":1,"imageUrls":["assets/gallery/346436e7a905c4f6b01e7130.png"],"imageUrl":"assets/gallery/346436e7a905c4f6b01e7130.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-09","studentName":"山崎来斗　Raito Yamasaki","title":"都道府県別　大学の学生数（国立、公立、私立）","tools":"Tableau","projectUrl":"https://www.e-stat.go.jp/stat-search/files?page=1\u0026query=%E5%AD%A6%E7%94%9F%E6%95%B0\u0026layout=dataset\u0026toukei=00400001\u0026stat_infid=000040489913\u0026metadata=1\u0026data=1","description":"1都道府県別の学生数の合計\n2棒グラフで可視化\n3日本の大学生はどの都道府県にどれくらい集中しているか\n4都道府県ごとの数量の差や順位を直感的に比較するため、降順にしました","imageIndex":113,"imageCount":2,"imageUrls":["assets/gallery/9c84e18e0f2b7c2cffae8757.png","assets/gallery/8a002bdcf1cd6b99b70ff2b7.png"],"imageUrl":"assets/gallery/9c84e18e0f2b7c2cffae8757.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"山本涼美　Yamamoto Suzumi","title":"2026年　千葉ロッテマリーンズ　優秀打者","tools":"Tableau","projectUrl":"https://npb.jp/bis/2026/stats/idb1_m.html","description":"1千葉ロッテマリーンズ2026一軍選手　成績\n2散布図を使って、特に伝えたい情報を色分けした\n3「打率が高い＝得点源になる選手」かどうかを見てみると最も打率が高い選手よりも二番目に打率が高い選手の方が本塁打数が圧倒的に多いことがあきらかになり、このことから打率が低くても本塁打数が多くチームの得点に貢献していることが分かった。\n4散布図は散らばりが多いので平均値を図に取り込みグループ分けすることで選手ごとの特徴が明確になるようにしたり、それぞれの項目で注目してほしい選手を色分けした。値が0の選手を図から省いたこともデータ量を少なくしてできるだけ見やすい表を作るための工夫である。","imageIndex":143,"imageCount":1,"imageUrls":["assets/gallery/01cfa9c6487d4dd12e26887a.png"],"imageUrl":"assets/gallery/01cfa9c6487d4dd12e26887a.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"柴田尚槻 Naoki Shibata","title":"日本の気温偏差と東京都の気温偏差の比較（1989～2025年）","tools":"Tableau(グラフ作成), 気象庁(データ収集), ChatGPT(グラフ作成の手順)","projectUrl":"東京都気温データ（https://www.data.jma.go.jp/cpdinfo/himr/himr_temp3.html）, 日本気温偏差（https://www.data.jma.go.jp/cpdinfo/temp/clc_jpn.html）","description":"１，\n気象庁より日本の年平均気温偏差、大都市における年平均した平均気温、日最高気温、日最低気温の長期変化傾向のデータを選んだ。また、後者については東京都に限定してデータを使用した。\n２，\n日本全体で見た気温偏差と東京都のみの気温偏差を折れ線にして可視化した。また、東京都のほうが強調されるような色を選んだ。\n３，\nまた、このグラフからわかったこととして、日本全体と東京どちらも長期的に上昇するという傾向がみられた。特に東京は過去の気温偏差が大きくマイナスだった時期から、近年では日本全体の偏差と比較しても大きくプラスになっており、日本全体と比べ気温変化の幅が大きいことが分かった。\n４，\n色分けを工夫して行った。東京都の気温偏差のほうが変化の幅が大きいためそちらを主として見せたいと考え日本全体の色を薄いグレーに、東京都の色をオレンジにすることで東京をのデータに目が行くようにした。","imageIndex":161,"imageCount":1,"imageUrls":["assets/gallery/035e058cc60fbdae5fbe8d25.png"],"imageUrl":"assets/gallery/035e058cc60fbdae5fbe8d25.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-14","studentName":"小川望　Nozomu Ogawa","title":"麦わら懸賞金年表","tools":"Excel、Tableau、ChatGPT","projectUrl":"https://zorilover.com/navi-bounty-strawhat/#google_vignette","description":"１，「ワンピースの」から、麦わらの一味のみんなの懸賞金の推移\n２，Excelに数値をまとめてからTableauに映した\n３，麦わらの一味の常人離れした大きな成長速度\n４，僕はルフィがすきなので、このグラフではだれが見ても一番大きな懸賞金のルフィに目が行くと思います。色はそれぞれのキャラクターのイメージに合わせました。","imageIndex":130,"imageCount":2,"imageUrls":["assets/gallery/dd6d293748edf0e73b878910.png","assets/gallery/3402ee3206d12ed37757c66f.png"],"imageUrl":"assets/gallery/dd6d293748edf0e73b878910.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"小林画廉","title":"猫の戦争","tools":"Excel 等","projectUrl":"自分で作成","description":"①　自分で作成したデータを使用　\n②　晴れの日をオレンジ、空模様が悪い日は青めの色で表した\n③　前回は晴れの日の方が喧嘩は少ないのではという結論に終わったが、今回のデータでは晴れてようが雷が降ってようがあまり関係がないことがよく分かった。\n④　晴れてる日は暖色、天気の悪い日は寒色","imageIndex":148,"imageCount":1,"imageUrls":["assets/gallery/ff6a2ffc3562eb5e2e165c7e.png"],"imageUrl":"assets/gallery/ff6a2ffc3562eb5e2e165c7e.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-11","studentName":"松村輝 Matsumura Hikaru","title":"周回時間と文字数の相関","tools":"tableau","projectUrl":"https://public.tableau.com/app/profile/.17823751/viz/1_17916485890730/1?publish=yes","description":"自作のパズドラ周回編成サイトに登録された133編成について、周回時間と、手順（PDCレシート）の文字数を使った。Tableauで横軸に周回時間、縦軸に手順の文字数をとった散布図を作り、1点を1編成として、ダンジョンの系統（龍・守護者・王）で色分けした。周回時間が長い編成ほど手順も長い傾向はあるが、同じ8〜10分台でも259字から1,080字まで3〜4倍の差があり、龍系は速く短い編成に、王系は長い編成に集まっていた。平均や合計にまとめると個々の編成の差が消えてしまうため、全編成を1つずつ点で見せる散布図を選んだ。","imageIndex":117,"imageCount":1,"imageUrls":["assets/gallery/e368f00a023758ada386f846.png"],"imageUrl":"assets/gallery/e368f00a023758ada386f846.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-14","studentName":"森本颯太　Souta Morimoto","title":"2026年のNPBパ・リーグ主要打者の成績データ（打数、安打数、打率）の比率","tools":"Excel、Tableau","projectUrl":"https://nf3.sakura.ne.jp/php/stat_disp/stat_disp.php?y=0\u0026leg=1\u0026tm=Sta\u0026fp=0\u0026dn=6\u0026dk=0","description":"①2026年のパ・リーグ主要打者における安打数と打率のデータを選びました。②横軸に安打数、縦軸に打率を配置し、選手ごとの成績を散布図として可視化しました。③この可視化によって、千葉ロッテの西川史礁選手のように打席数をこなして安打を稼ぐタイプと、日本ハムのレイエス選手のように少ない打数で確実に高打率を残すタイプの違いが明確に見えるようになりました。④表現上の選択として、マークの色を球団ごとに分け、ラベルに選手名を表示したことで、各球団の主力打者の傾向をひと目で直感的に比較できるように工夫しました。。","imageIndex":129,"imageCount":1,"imageUrls":["assets/gallery/0d9414ba92c992ab6b3ac25e.png"],"imageUrl":"assets/gallery/0d9414ba92c992ab6b3ac25e.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"神戸宗一郎","title":"MC BATTLE VICTORY Tableau","tools":"Tableau","projectUrl":"https://mcbattlenow.com/database/mc/c682f001-d525-438f-8d56-7978cc0cd965","description":"1,前回のデータから優勝者データを追加し、テキストファイルにし使用した。\n2,tableauのフィルター機能を追加し、フィルターによってMCを選択すると、グラフ上で誰が何年にどの大会で優勝したか可視化することができる。\n3,点が多い年がMCの全盛期であることがわかる。MCの成長とともにどのようなスキルを磨いて優勝したのか可視化できるようにしたい。\n4,準優勝のデータも追加し、優勝を黄、準優勝を赤にし表現した。","imageIndex":142,"imageCount":2,"imageUrls":["assets/gallery/3c7920f23c5bb0d96c3a8767.png","assets/gallery/12826130ce2bdb8347c1910c.png"],"imageUrl":"assets/gallery/3c7920f23c5bb0d96c3a8767.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"須藤蒼太　Souta Sutou","title":"台北YouBikeのOD別日陰率の比較","tools":"Tableau、Python","projectUrl":"https://drive.google.com/drive/folders/1XmQnOcZGtfDBU2X6UPAubSVgSepXyUYd?usp=drive_link","description":"①どのデータを選んだか  \n台北YouBikeの研究対象126 OD（標準車62組、電動車64組）について、最短経路の距離と、その経路に占める日陰の割合を選んだ。日陰率は、2024年8月1日の建物影モデルによる予測値で、午前8時30分～9時30分と午後14時30分～15時30分を、それぞれ5分間隔で計算した平均値を使用した。往路・復路も分け、126 OD×2方向×2時間帯の計504行を対象とした。\n\n②どのように可視化したか  \n横軸に最短経路の距離（m）、縦軸に日陰率（%）を配置した散布図で表現した。時間帯と方向を一つずつ選ぶと、一つの円が一つのODを表す。日陰率が高いほど円を大きくし、標準車と電動車は色で区別した。さらに、午前・午後と往路・復路を切り替えて比較できるようにした。\n\n③可視化によって何が見えるようになったか  \n横軸上で近い位置にある円の高さを比べることで、移動距離が同程度でも、日陰の多いODと少ないODを区別できるようになった。また、同じODについて時間帯を切り替えると午前・午後の日陰率の違いを、方向を切り替えると往路・復路の経路による違いを確認できる。\n\n④表現上の工夫を一つ説明してください  \n日陰率を縦軸の位置と円の大きさの両方に割り当てた。例えば、日陰率40%のODは10%のODより上に位置し、円も大きく表示される。これにより、日陰の多いODを円の大きさから見つけ、縦軸で日陰率の違いを読み取れるようにした。","imageIndex":154,"imageCount":2,"imageUrls":["assets/gallery/1b4d45757c6800690451e6bc.png","assets/gallery/a6e4ab7bb323d55988721804.png"],"imageUrl":"assets/gallery/1b4d45757c6800690451e6bc.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"石引響 Ishibiki Hibiki","title":"10カ国を対象としたGDP平均の推移と比較","tools":"Tableau Public","projectUrl":"Hans CSV","description":"①授業内で使用したハンスのデータを使用しました。今回のGDPの平均値を使い、個人的に選んだ10カ国の比較を行いました。また、10カ国を比較する上で現代までの推移を表したグラフと、世界地図でGDPを表現しています。\n②アメリカ、オーストラリア、カナダ、中国、ドイツ、インド、日本、ロシア、南アフリカ、スペインの10カ国を対象に、GDPの推移(平均)を1800年から2025年までを範囲として、折れ線グラフにして表しました。二つ目として先述した10カ国を世界地図に表記し、2025年を対象に各国のGDPを大きさで表しました。\n③国内総生産が可視化されたことにより、大まかにだが対象とした各国の国力が暫定的にですが分りました。中でもアメリカ、オーストラリア、ドイツは群を抜いていることが分かります。\n④複数の国がありましたので、代表的な国をいくつか選出して比較を行いました。今回がTableau Publicを使うのが初めてでしたので、色々と使用の理解に時間がかかりましたが、初めて使ってそれなりに形になったと思います。そして次はパッと見て分かりやすいグラフを作れるように工夫したいです。","imageIndex":162,"imageCount":2,"imageUrls":["assets/gallery/c075c6a6ebf8804a29ad6074.png","assets/gallery/ed2eb6c36d2a3c00dd751656.png"],"imageUrl":"assets/gallery/c075c6a6ebf8804a29ad6074.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-14","studentName":"石原真汲　Makumi Ishihara","title":"1976年~2026年にかけての各都道府県の最低賃金と物価指数の変化","tools":"Gemini and Tableau","projectUrl":"https://public.tableau.com/shared/JBR5YCDTP?:display_count=n\u0026:origin=viz_share_link","description":"1976年~2026年にかけての各都道府県の最低時給とそれに比例して増えるであろう物価指数をバブルチャートで可視化しました。緯度経度を用いることで日本地図を出し、どの範囲に大きい数値が集中しているのかがわかりました。工夫は、低い数値を暗い色、大きい数値を明るい色にすることで、また円を大きくすることで強調しました。","imageIndex":133,"imageCount":1,"imageUrls":["assets/gallery/b143fa689d5d7764c26410c6.png"],"imageUrl":"assets/gallery/b143fa689d5d7764c26410c6.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"石川翔渉　Ishikawa Towa","title":"Steamでは高いゲームほど評価も高い？","tools":"Tableau Public","projectUrl":"https://github.com/clivewearing/SteamGamesDataAnalysis","description":"① どのデータを選んだか\nSteamゲームの価格、ユーザー評価、レビュー数のデータを使用しました。\n\n② どのように可視化したか\n横軸にゲームの価格、縦軸にユーザー評価を置き、レビュー数を円の大きさで表した散布図を作成しました。\n\n③ 可視化によって何が見えるようになったか\n価格が高いゲームほど評価も高くなるとは限らず、全体として価格と評価に強い正の関係は見られないことが分かりました。\n\n④ 表現上の工夫または選択\n無料ゲームやレビュー数が少ないゲームを除外し、傾向線を追加することで、価格と評価の関係が見やすくなるように工夫しました。","imageIndex":147,"imageCount":1,"imageUrls":["assets/gallery/e45adf16515e8bf42838410e.png"],"imageUrl":"assets/gallery/e45adf16515e8bf42838410e.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-09","studentName":"赤塚絆　Akatsuka kizuna","title":"メジャーバリューとGDP","tools":"Tableau","projectUrl":"https://1drv.ms/x/c/48FAEEE068DCA226/IQBNh1mbVBbxT7Cu-dZF1aitAT-1tZEJCMIH5OgMql1b5C4?e=ezl5kw","description":"①GDPとメジャーバリュー\n②列にGDPに行にメジャーバリューを選択した\n③各国におけるGDPに対するメジャーバリューを比較できる\n④ページにyearを選択することで年代別に比較することができる。","imageIndex":111,"imageCount":1,"imageUrls":["assets/gallery/8816c3bbfb5a4d7fb1908ee6.png"],"imageUrl":"assets/gallery/8816c3bbfb5a4d7fb1908ee6.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"大友愛梨　Otomo Airi","title":"妖怪ウォッチの各種族の特徴は何か！！","tools":"Excel ,Tableau public","projectUrl":"妖怪ウォッチ３スシ・テンプラ・スキヤキ攻略情報","description":"①妖怪ウォッチ３の各キャラクターのパラメーター（約600種）を使用②各キャラクターの値を散布図にした③”はやさ”と”まもり”には負の相関がみられた（はやさの値が高ければ高いほど守りは低かった）”ちから”と”ようりょく”どちらも高い妖怪は存在せず、どちらかが高ければどちらかは低いということがわかった。④種族を色分けすることで種族ごとに特徴があるのか分かりやすくした。","imageIndex":137,"imageCount":2,"imageUrls":["assets/gallery/ed9c7c6c682892ffb5644edf.png","assets/gallery/6506c94f0a424881f7b7877e.png"],"imageUrl":"assets/gallery/ed9c7c6c682892ffb5644edf.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"大澤祥太郎　Shotaro Osawa","title":"サーブはリスクとリターンの関係","tools":"Tableau、Microsoft Excel、Codex","projectUrl":"https://en.volleyballworld.com/volleyball/competitions/volleyball-nations-league/statistics/men/best-servers/","description":"VNL 2026男子のサーブ統計から、総サーブ数100本以上の87選手を選びました。横軸にサーブミス率、縦軸にサービスエース率を置き、円の大きさで総サーブ数を表す散布図にしました。全体には正の相関（r = 0.64）があり、ミス率が高い選手ほどエース率も高い傾向が見えます。Hanes、Leon、Darlanを色とラベルで強調し、注目すべき選手と全体の傾向を同時に読み取れるようにしました。","imageIndex":153,"imageCount":1,"imageUrls":["assets/gallery/0573606e721c9cba908da90a.png"],"imageUrl":"assets/gallery/0573606e721c9cba908da90a.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-13","studentName":"猪狩蒼空　Igari Sora","title":"大学生がよく飲む飲み物","tools":"Tableau","projectUrl":"國學院大學「飲み物」アンケート調査","description":"大学生がよく飲む飲み物のデータを選んだ。飲み物ごとの割合を横棒グラフで表した。水や炭酸飲料を飲む人が多いことが分かった。棒の先に数値を表示することで、割合が分かりやすくなるように工夫した。また、多い順に並べることで、飲み物ごとの違いを比べやすくした。","imageIndex":121,"imageCount":1,"imageUrls":["assets/gallery/ea5e84bcfb1fa90a4f44a044.png"],"imageUrl":"assets/gallery/ea5e84bcfb1fa90a4f44a044.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-11","studentName":"島田晟　Joe Shimada","title":"NPBのチームソフトバンクの選手の成績と年俸の比例について","tools":"Tableal","projectUrl":"https://baseball-data.com","description":"①ソフトバンクの選手成績とその選手の年俸のデータ\n②これを比較し、年俸が高い選手は良い成績を残しているのか\n③全体的に年俸が高い選手は良い成績を残していて試合数や成績もしっかり良い数字残せていた。\n④データを視覚化したかったので野手では安打数、投手は試合数ごとに選手のデータの色を赤くしています","imageIndex":118,"imageCount":2,"imageUrls":["assets/gallery/08407b8895c08153b1846796.png","assets/gallery/0d0fffde2426c1ac4c8ca2ae.png"],"imageUrl":"assets/gallery/08407b8895c08153b1846796.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"桃井優","title":"アルバムごとのBPM波","tools":"Tableau","projectUrl":"https://docs.google.com/spreadsheets/d/1OJnjjLT6K3iDBFJwOlNzEw-73NON49AQgHFL7zYXyjg/edit?usp=sharing","description":"ヨルシカの歴代アルバムデータから、アルバム名、曲順、そしてテンポを表すBPMの指標を選定しました。表の各行にアルバム名を配置し、セル内に曲順ごとのBPMの推移を小さな折れ線グラフとして可視化しています。これにより、各アルバムにおける序盤から終盤へのテンポの起伏や緩急のつけ方といった楽曲構成の流れが、作品間で一目で比較できるようになりました。表現上の工夫として、各アルバムの最高テンポと最低テンポの地点だけに数値を表示することで全体の要所を瞬時に把握できるようにしています。","imageIndex":157,"imageCount":1,"imageUrls":["assets/gallery/59b6d4e84d4b5f474f23caaa.png"],"imageUrl":"assets/gallery/59b6d4e84d4b5f474f23caaa.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"藤井航己　Koki Fujii","title":"関東5都県の人口比較（2020年）","tools":"Excel,Tableau","projectUrl":"https://www.stat.go.jp/data/kokusei/2020/index.html","description":"総務省統計局の2020年国勢調査から、関東5都県（東京、神奈川、埼玉、千葉、茨城）の人口データを選んだ。Tableauを使い、都県ごとの人口を棒グラフで可視化した。その結果、東京都の人口が最も多く、茨城県が最も少ないことが一目で分かった。表現上の工夫として、都県ごとの人口の違いを比較しやすいように棒グラフを使用した。","imageIndex":151,"imageCount":1,"imageUrls":["assets/gallery/86cea3bd7fe0caf578980979.png"],"imageUrl":"assets/gallery/86cea3bd7fe0caf578980979.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"藤原　叶","title":"月別気温とアイスの支出金額の関係","tools":"Excel, Tableau Public","projectUrl":"https://www.icecream.or.jp/iceworld/data/expenditures.html https://www.data.jma.go.jp/stats/etrn/view/monthly_s3.php?%20prec_no=44\u0026block_no=47662","description":"①気象庁　東京（東京都) 日平均気温の月平均値（℃）\n　日本アイスクリーム協会　家計調査実績（日本）データで見るアイスクリーム\n\n② 気温を折れ線グラフ、アイスの支出金額を棒グラフにして、月ごとの変化を比較できるようにした。\n\n③ 気温が高くなるとアイスの支出金額も増える傾向が見られたが、12月は11月より気温が低いのに支出金額が増えており、気温以外にも影響する理由があるのではないかと考えた。\n\n④ 気温と支出金額は単位が違うため、左右で目盛りを分け、棒グラフと折れ線グラフを組み合わせることで、2つの変化を一目で比較できるように工夫した。","imageIndex":138,"imageCount":1,"imageUrls":["assets/gallery/44da51d99723cf7e5d757294.png"],"imageUrl":"assets/gallery/44da51d99723cf7e5d757294.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"八木沼悠斗　Yuto Yaginuma","title":"日本の漁獲量の推移","tools":"Tableau","projectUrl":"https://www.e-stat.go.jp/stat-search/files?page=1\u0026layout=datalist\u0026toukei=00500216\u0026tstat=000001015174\u0026cycle=0\u0026year=20240\u0026month=0\u0026tclass1=000001034726\u0026tclass2val=0","description":"①海面漁業漁獲量累年統計の中から総合漁獲量と年代のみ抽出し活用した。\n②年を列とページ、漁獲量を行にすることで年代ごとの漁獲量がわかるようにした。\n③1988年から現在まで、徐々に漁獲量が下がっている事がわかった。\n④ページを利用したデータにしたかったので、ページを移動させることでデータを表す円の大きさと色を変化させる工夫をした。","imageIndex":135,"imageCount":1,"imageUrls":["assets/gallery/b4a4297acf0da0effeed07ae.png"],"imageUrl":"assets/gallery/b4a4297acf0da0effeed07ae.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-13","studentName":"矢部夢華　Yumeka Yabe","title":"スタジオジブリ映画の興行収入ランキング","tools":"Tableau","projectUrl":"https://www.nippon.com/ja/japan-data/h01730","description":"ジブリ映画の興行収入のデータを選び、Tableauを使って棒グラフで可視化した。映画ごとの興行収入を高い順に並べることで、それぞれの作品の興行収入の違いがわかるようにした。グラフから、「千と千尋の神隠し」の興行収入が最も高く、ほかの作品と大きな差があることがわかった。棒の長さで比較できるようにし、数値も表示することで、作品ごとの違いが見やすくなるように工夫した。","imageIndex":122,"imageCount":1,"imageUrls":["assets/gallery/a012c1abbeaa80e659d9bbff.png"],"imageUrl":"assets/gallery/a012c1abbeaa80e659d9bbff.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"林瞳　1254730299","title":"カンザキイオリ 成功ロジックモデル分析","tools":"Woard・Tableau","projectUrl":"https://1drv.ms/x/c/6d1f0baefbddd86d/IQBVuVChzXIERYVD89JLi-T5AXqTowzk0SAR-FQy7tlrmhU?e=DCwO38","description":"本分析では、カンザキイオリ氏の活動実績を集約した『KPI_TimeSeries』データセットを選定し、Tableau Publicにて「命に嫌われている。の推移」と「多角化・メディアミックス成果」の2つの折れ線グラフを上下に配したダッシュボードを作成しました。\n\nこの可視化により、代表曲『命に嫌われている。』による爆発的な認知獲得が、その後の小説刊行や他アーティストへの楽曲プロデュースといった多角化・メディアミックス展開の成果へと連動していく成功プロセスが明確に見えるようになりました。\n\n表現上の工夫として、指標による数値規模の乖離（数百から一桁・二桁）に対応するため、2つ目のグラフの軸上限を「30」にカスタム設定し、凡例を浮動配置することで視認性とレイアウトの美しさを両立させました。","imageIndex":145,"imageCount":1,"imageUrls":["assets/gallery/05a930e3610265c7e389fa14.png"],"imageUrl":"assets/gallery/05a930e3610265c7e389fa14.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"鈴木小太朗　Kotarou Suzuki","title":"プロ野球の打低問題","tools":"Excel、tableau","projectUrl":"https://npb.jp/","description":"①プロ野球のチーム打撃成績\n②打率や本塁打数を年度別で散布図グラフにした。\n③プロ野球の各年のチーム打撃成績が年度別で見れるのでどの年が打低か打高かが見えてきた。\n④球団の色分け","imageIndex":159,"imageCount":2,"imageUrls":["assets/gallery/8f25f8fda7da8838e9331fb3.png","assets/gallery/6987bf557296c53250d25bfa.png"],"imageUrl":"assets/gallery/8f25f8fda7da8838e9331fb3.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-13","studentName":"鈴木優　Yu Suzuki","title":"珍名・おもしろバス停マップ","tools":"Tableau Public, Excel","projectUrl":"https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-P11-2022.html, https://reitakujp-my.sharepoint.com/:x:/g/personal/a250857y_reitaku_jp/IQBdlK6OsNbcSLvyyN2aMM8gAUk5A-xtBRHnelwm4SaywFU?e=J8SFaT","description":"① データとして日本全国に点在する「珍名・難読のバス停」の位置情報と分類（動物、SF、インパクト系など）をまとめたオリジナルデータセットを選びました。\n\n② Tableauのマップ機能を用いて緯度・経度を日本地図上にプロットし、名前のネーミング傾向（Category）ごとにピンの色を分けて可視化しました。\n\n③ これにより、珍名バス停や駅名が特定の都市部だけでなく日本全国の様々な地域に点在していることや、命名のパターンにどのような種類があるかを視覚的に把握できるようになりました。\n\n④ 表現上の選択として、ただのテキスト一覧では伝わらない「全国の地理的な広がりや位置の意外性」を直感的に伝えるため、Tableauの強みであるインタラクティブなマップ形式を採用しました。","imageIndex":124,"imageCount":1,"imageUrls":["assets/gallery/e3be8615c161518d47935ed0.png"],"imageUrl":"assets/gallery/e3be8615c161518d47935ed0.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"鈴木陽太","title":"20代が巻き込まれやすい犯罪","tools":"Excel","projectUrl":"https://www.npa.go.jp/publications/statistics/sousa/statistics.html","description":"①警視庁が出している年別の犯罪統計のデータ。\n②多く被害にあったものを見やすくした。\n③20代では詐欺による被害が圧倒的に多い\n④初めは犯罪の種類によって色を変え見やすくしたが項目の内容が犯罪に関することなのでカラフルに表現するのは違うと思い色を暗めにした。","imageIndex":150,"imageCount":1,"imageUrls":["assets/gallery/c623783913edda8e484af1a5.png"],"imageUrl":"assets/gallery/c623783913edda8e484af1a5.png"},{"week":3,"challenge":"第3週｜Tableau／Gapminder","submittedAt":"2026-10-15","studentName":"齋藤さくら　Sakura Saito","title":"ナンバリングと興行収入の関係","tools":"Excel, Gemini, Tableau","projectUrl":"https://reitakujp-my.sharepoint.com/:x:/g/personal/a250355s_reitaku_jp/IQCit-fLAxfCT5R7b4L5VGkOAazJUSBY4KiQvxUt8gC__30?e=5EOsLW","description":"春セメスターの別授業で集めたデータを使い、映画のナンバリング（その映画が何作目かを示す）と興行収入の関係について調べた。\n最初は興行収入とナンバリングだけで比較しようとしたがあまりパッとしなかったので、二枚目ではAIを使用して公開年を調べ、興行収入を図の大きさにして表すことにした。判例は画像上部と横に表示してある。\nこの可視化により丸が大きいほど（ナンバリングが増えるほど）、興行収入が低くなりがちということがわかった。\n工夫としては興行収入も公開年も数字としては大きいので軸の数値を調整した。","imageIndex":144,"imageCount":2,"imageUrls":["assets/gallery/e7a938cd91355e9bc7a5ebb4.png","assets/gallery/6f312836957c3162123b680c.png"],"imageUrl":"assets/gallery/e7a938cd91355e9bc7a5ebb4.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"Welhemina Gansah","title":"Teen Fitness and the Planet Fitness High School Summer Pass","tools":"Google Sheets","projectUrl":"https://www.prnewswire.com/news-releases/planet-fitness-inspires-approximately-3-7-million-teens-to-prioritize-fitness-through-its-high-school-summer-pass-program-302876527.html","description":"I selected survey results from Planet Fitness's 2026 High School Summer Pass, a free summer program in which about 3.7 million teens ages 14-19 took part. I entered six percentages into Google Sheets and made a horizontal bar chart, ordered from highest to lowest, so the results can be compared at a glance. What became evident is that teens reported the biggest benefits for mood (93%), mental health (84%), and self-confidence (83%), while working out with a friend (53%) was far more common than working out with a sibling (20%) or a group of friends (15%). My creative choice was to color the three well-being bars one color and the three social bars another, with the percentage written on each bar, so the two themes are easy to tell apart. These results are self-reported in a survey run by Planet Fitness itself.","imageIndex":95,"imageCount":1,"imageUrls":["assets/gallery/7fcb428f189646be4f1f2b28.png"],"imageUrl":"assets/gallery/7fcb428f189646be4f1f2b28.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-06","studentName":"ティム フォン シャルペン","title":"Bundesliga Football Players Peak Value compared to their Age","tools":"Claude Ai, GitHub","projectUrl":"https://github.com/dcaribou/transfermarkt-datasets","description":"1. I used player value data from Bundesliga Strikers and Goalkeepers between the ages of 17 and 36. In total I used data from 734 Strikers and 274 Goalkeepers between 2000 and 2026. 2. I converted each players market value into percentages of their own career-high value and plotted the age-based medians using two line graphs. 3. The visualization shows that goalkeepers and strikers market value progresses relatively the same early on but strikers reach their peak market value earlier and start declining faster in comparison to the goalkeepers. 4. I used percentages instead of Euro market value as some super stars might disproportionately affect the real comparison. \n\nLink for the interactive chart:https://claude.ai/artifact/6jZZr3nfjhzgUnD8ZVHEN6","imageIndex":72,"imageCount":1,"imageUrls":["assets/gallery/6ec0681b506159ef1270753e.png"],"imageUrl":"assets/gallery/6ec0681b506159ef1270753e.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-07","studentName":"テズジャン  デイララ  Dilara Tezcan","title":"Did Asia feel as different as the research says?","tools":"Power Point , Claude, Excel","projectUrl":"Hofstede Country comparison: https://geerthofstede.com/country-comparison-bar-charts/","description":"I chose Hofstede's cultural dimension scores (power distance, individualism, uncertainty avoidance, long-term orientation) for Germany, Thailand, Malaysia, China and Japan and compared them with my own 0–100 ratings of how different each country felt from Germany. I visualized the research as a table, my experience as a dumbbell chart for Japan, and the gaps between the two as a ranked bar chart. The visualization shows that Japan is closest to Germany on paper, but that my biggest surprise was Japan's individualism, which felt 49 points more different than the research says. To guide the eye, I used orange for the key result and kept everything else in muted beige and brown tones.","imageIndex":76,"imageCount":2,"imageUrls":["assets/gallery/34325cc15b02979b3859eb3d.jpg","assets/gallery/933daf6d86d00f0ce9378b29.jpg"],"imageUrl":"assets/gallery/34325cc15b02979b3859eb3d.jpg"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-07","studentName":"モンテッラ エドウィン　MONTELLA EDWIN","title":"The Big Mac Index V2","tools":"VS Code, Claude","projectUrl":"The Economist「The Big Mac index」（公式ページ） https://www.economist.com/big-mac-index The Economist ビッグマック指数データ（GitHub） https://github.com/TheEconomist/big-mac-data 使用したCSVファイル（2000年4月〜2026年7月、54か国） https://github.com/TheEconomist/big-mac-data/blob/master/output-data/big-mac-full-index.csv","description":"本作品では、The Economistが公開している「ビッグマック指数」（2000年〜2026年、54か国）のデータを使い、同じ商品の価格をドル換算で比べることで、各国通貨の強さを読み取りました。可視化は、スライド形式のインタラクティブなウェブサイトとして制作しました。日本の対ドル評価の推移を、再生すると線が描かれていく折れ線グラフで、2000年と2026年の26か国の変化をスロープチャートで、現在の54か国を地域別のドットチャートで示しました。その結果、日本のビッグマックはアメリカより24%高かった状態から50%安い状態へと74ポイント下落し、これは26か国の中で最大の下落であることが一目で分かるようになりました。改善点として、各スライドの見出しを「何が分かるか」という結論の文にしたうえで、日本だけを青で強調し、他の国をグレーにすることで注目点を明確にしました。さらに、2008年の金融危機、2013年のアベノミクス、2022年の日米金利差という出来事の注釈をグラフに加え、変化の理由も読み取れるようにしました。\nThe Big Mac Index V1 :  https://edwin379.github.io/The-Big-Mac-Index/\nThe Big Mac Index V2 : https://edwin379.github.io/The-Big-Mac-Index-V2/","imageIndex":74,"imageCount":2,"imageUrls":["assets/gallery/bd0ab0b491c124385081a75c.png","assets/gallery/578828bda9151bbacd8f7d37.png"],"imageUrl":"assets/gallery/bd0ab0b491c124385081a75c.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-06","studentName":"粟野翔　Awano Kakeru","title":"年齢と活動開始時期の関係","tools":"Python　Claude","projectUrl":"https://docs.google.com/spreadsheets/d/1ZG5C8F2NKEpbc41lfUGUKE4qy8c1922gRfUGUaHUjQc/edit?usp=sharing","description":"①HARDCORE TANO*Cメンバーの年齢と活動年数②ダンベルチャートで年齢と活動年数の関係を可視化③活動を開始した時期は17~21歳に集中していることが分かった。④ダンベルチャートを用いることでどのメンバーが何歳で活動を開始したかを比較して可視化することができた。","imageIndex":67,"imageCount":1,"imageUrls":["assets/gallery/8d59ce324e5e3abaaa471eb4.png"],"imageUrl":"assets/gallery/8d59ce324e5e3abaaa471eb4.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"伊藤千夏Ito Chinatsu","title":"駅の利用ランキング","tools":"神","projectUrl":"https://drive.google.com/file/d/1ySGCCEbR_0Tv8rPEqoaLYD2LJVYSqG それといろいろな記事ト過去の傾向からなどを見て阪神の残留率を独断と偏見ではありますがつけてみました。\n3．今回のかしかで来シーズンに三連覇できる確率が合わってくると感じました。\n4．過去の傾向と去年の契約交渉の際佐藤選手の交渉方法と球団からの条件提示でのを見てこのような少ない確率にしました低確率ではありますがメジャーの球団の事情もあるためこのくらいの数字にしました外人選手の確率も過去の傾向をこのようにしました。","imageIndex":70,"imageCount":1,"imageUrls":["assets/gallery/1d908aaae8c6c0d72efea1d1.png"],"imageUrl":"assets/gallery/1d908aaae8c6c0d72efea1d1.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"岡本結衣　Okamoto Yui","title":"都道府県別人口ランキング","tools":"Excel、チャットGPT","projectUrl":"https://memorva.jp/ranking/japan/soumu_population_pref.php","description":"①47都道府県の人口データを選び、人口の多い都道府県を比較した。\n②人口の多い順に並べ、都道府県ごとの人口を棒グラフで表した。\n③可視化することで、東京都の人口が特に多く都道府県によって人口に大きな差があることが分かりやすくなった。\n④表現上の工夫としてシンプルな棒グラフにして、余計な装飾を減らし人口の違いに注目できるようにした。","imageIndex":78,"imageCount":1,"imageUrls":["assets/gallery/04140a37276269503aeaa03b.png"],"imageUrl":"assets/gallery/04140a37276269503aeaa03b.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-05","studentName":"岡野俊介　Syunsuke Okano","title":"オリックス・バファローズ 年度別順位の推移(2015-2025)","tools":"Googleスプレッドシート","projectUrl":"https://docs.google.com/spreadsheets/d/1t5Wq-L8TrYYQLYlA5btTEcHzJ3L7qRlxJcmQm9sxmII/edit?usp=sharing","description":"オリックス・バファローズの年度別順位データ（2015〜2025年）を選び、順位の変遷を折れ線グラフで表現しました。可視化したことで、長年のBクラス低迷から2021年の中嶋監督就任を機に3連覇という黄金期を築き上げた劇的なV字回復の軌跡が一目で読み取れるようになりました。工夫した点として、3位と4位の間にAクラスの境界線を引くとともに、最も強調したい3連覇の期間に黄色の網掛けと注釈を添え、単なる順位推移だけでなく、チームの背景や文脈が直感的に伝わるようにしました。","imageIndex":66,"imageCount":1,"imageUrls":["assets/gallery/2a5997529d5525fb7dda9e37.png"],"imageUrl":"assets/gallery/2a5997529d5525fb7dda9e37.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-04","studentName":"岡悠斗","title":"アジア大会でのメダルによる分析","tools":"Excel","projectUrl":"https://rekidai-carnival.com/asian-games-japan-medals-history/","description":"①アジア大会での日本のメダルの獲得総数などが記載されていたWebページ②Excelで歴代のアジア大会の日本のメダルの割合やメダルの総数などをグラフでわかりやすくまとめた。③そのグラフなどを見て分析を行った。\nスクリーンショット1では一番右のグラフで日本のメダルの内訳や金、銀、銅メダルの割合をまとめた。左のグラフでは自分が独自の評価基準で歴代の日本の競技レベルの推移を可視化した。\nスクリーンショ
