品では、The Economistの「ビッグマック指数」のデータを使い、54か国のビッグマックの価格をドルで比べました。バーガーの大きさや天びん、タイムマシン、一覧チャートなどを使って、楽しくデータを見られるようにしました。その結果、日本のビッグマックは2000年の世界5位から2026年には48位まで下がり、アメリカより約50%安いことが分かりました。最初は世界地図を使いましたが、バーガーが重なって見にくかったため、価格と地域を使った一覧チャートに変更しました。 https://edwin379.github.io/The-Big-Mac-Index/","imageIndex":21,"imageCount":2,"imageUrls":["assets/gallery/d22be25f36e254154b429c58.png","assets/gallery/c058e64b5c258f7118a5e750.png"],"imageUrl":"assets/gallery/d22be25f36e254154b429c58.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-27","studentName":"粟野翔　Awano Kakeru","title":"年齢の分布","tools":"Python","projectUrl":"https://docs.google.com/spreadsheets/d/1ZG5C8F2NKEpbc41lfUGUKE4qy8c1922gRfUGUaHUjQc/edit?usp=sharing","description":"①HARDCORE TANO*Cのメンバーの年齢　②Pythonで制作。縦軸人数、横軸年齢の棒グラフにした。③年齢の偏りが多く30代のメンバーが多いことがわかる。1歳刻みにすると36歳が3人いることが分かった。　④年齢ごとの人数を比較しやすくするために棒グラフを選択した。年齢の偏りをわかりやすく見れると思う。","imageIndex":9,"imageCount":2,"imageUrls":["assets/gallery/be3c1c6d54db669c1643f6ed.png","assets/gallery/e6ca3afe51edf6754016f296.png"],"imageUrl":"assets/gallery/be3c1c6d54db669c1643f6ed.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"伊藤千夏 Ito Chinatsu","title":"1週間の電車利用ランキング","tools":"鉛筆","projectUrl":"https://drive.google.com/file/d/1PNdE_QbvzrPfMR3z0gPXCSyVQaw74PUb/view?usp=drivesdk","description":"①交通系ICカードの利用履歴から、8月10日から16日までの1週間に利用した駅と利用回数をデータとして選んだ。\n②駅ごとの利用回数をマス目のように変えて、ランキング形式で可視化した。\n③どの駅を頻繁に利用しているのか、また利用がどの駅に集中しているのかが見えるようになった。\n④数字だけのランキングではなく、利用回数合わせてマス目が増えることで、駅ごとの差を直感的に分かるようにした。","imageIndex":47,"imageCount":1,"imageUrls":["assets/gallery/7bd4c32144662ab081e4cb24.jpg"],"imageUrl":"assets/gallery/7bd4c32144662ab081e4cb24.jpg"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"伊藤拓哉　Ito　Takuya","title":"2025年 プロ野球12球団の1試合平均観客動員数","tools":"Flourish","projectUrl":"https://baseball-freak.com/audience/25/","description":"①プロ野球12球団の1試合平均観客動員数のデータを選択②Flourishを用いて縦棒グラフで可視化しました。③可視化したことで、阪神や読売といった上位球団が1試合平均約4万人規模という圧倒的な集客力を誇る一方で、球団間で明確な集客差が存在することが一目で把握できるようになりました。④表現上の工夫として、数値を降順（大きい順）に整列させつつ色を分けて配置することで、視覚的な識別性と順位関係の分かりやすさを両立させています。","imageIndex":26,"imageCount":1,"imageUrls":["assets/gallery/db7b97ecfb21cc290dc1012f.png"],"imageUrl":"assets/gallery/db7b97ecfb21cc290dc1012f.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-26","studentName":"伊澤颯馬　Soma Izawa","title":"都道府県別店舗数一位のゲームセンターチェーン","tools":"Claude excel Datawrapper","projectUrl":"https://datawrapper.dwcdn.net/eFVzj/1/　https://www.fantasy.co.jp/molly-fantasy/shoplist/　https://www.gigo.co.jp/shops　https://bandainamco-am.co.jp/game_center/　https://www.taito.co.jp/store　https://www.round1.co.jp/company/company/all-shop.html","description":"①Claudeに各主要なゲームセンターの公式サイトから店舗の集計をさせ、エクセルに反映させてデータを作成した。②都道府県ごとに色でわかりやすく店舗がわかるように、まずは各県店舗数一位のリストをエクセルで作成しその後DatawrapperでClaudeに作り方を聞きつつ作品を作成した。③可視化によって、想定以上にモーリーファンタジー系列が多いのと、人口が多い県や関東ではGIGOが多い傾向にあることが見えた。④工夫として、色を各ゲームセンターのメインカラーに合うように設定した。namcoが少々悩んだが、バンダイナムコも含まれるためオレンジにすることで、taitoとの赤被りを防ぐことができた。","imageIndex":6,"imageCount":1,"imageUrls":["assets/gallery/6688a2ea879288b1e7f9d836.png"],"imageUrl":"assets/gallery/6688a2ea879288b1e7f9d836.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-29","studentName":"永野虎太郎　Kotarou Nagano","title":"阪神タイガース","tools":"プロ野球速報","projectUrl":"https://docs.google.com/spreadsheets/d/1AFbgC1hbyVhKdBTWYjziu4jDlSqPAoq9Vbjup_5fvn0/edit?usp=sharing","description":"自分は阪神タイガースのファンで優勝のマジックが点灯したのにもかかわらず最近の連敗の原因を調べたいと思いこの議題にしました。可視化で注目してほしいのはOPSですこれはチームへの貢献度を数値化したものです。可視化しこれが1に近づければとても優秀であるとなる0.6でもよい選手とも言えます。打席数立っていない人間で結果をでせている人間とかなり優秀な人物を見ることができます工夫した点は元のデータだと一軍登録されていない人と投手がまとまっていいたが別にすることでわかり役しましたこれでの結果で個人的にここ最近のチーム成績が悪いのは個人成績のタイトル争いがチーム内で行われていることだと思いますほとんどの成績で佐藤輝明選手が４巻がほぼ確実で長距離打者の夢のタイトルが本塁打王でその争いに森下翔太選手が争っていて個人成績に争いをしているからだと感じます。","imageIndex":16,"imageCount":1,"imageUrls":["assets/gallery/7bd15fa567bedbfe20ceb854.png"],"imageUrl":"assets/gallery/7bd15fa567bedbfe20ceb854.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"奥田昭真 Shoma Okuda","title":"iPhone ScreenTime TOP 3","tools":"Exel","projectUrl":"https://1drv.ms/x/c/fda0ee3a225c10e9/IQBVxIfcO7gIQqCXWaoA34xCAcuGFXj_pHwSt5qriu9Jrj0?e=aAzU09","description":"①iPhoneのスクリーンタイム\n②Exelのグラフで可視化\n➂グラフからその日が忙しかったということが分かる\n④Youtube, X, Gameと大きく区分を分けることで、視覚的にもわかりやすくしている。","imageIndex":29,"imageCount":1,"imageUrls":["assets/gallery/1ca86175126bef68492acb9a.png"],"imageUrl":"assets/gallery/1ca86175126bef68492acb9a.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"岡本結衣　Yui Okamoto","title":"都道府県人口ランキング","tools":"紙","projectUrl":"https://www.chizu-seisaku.com/geography/jinkou/","description":"①都道府県別の人口データを選び、都道府県ごとの人口の違いを比較できるようにした。\n②各都道府県の人口を円の大きさで表し、人口が多い地域ほど円を増やして可視化しました。\n③東京都や大阪府などの大都市圏に人口が集中していることや、都道府県によって人口に大きな差があることが分かりやすくなった。\n④表現上の工夫として、人口の多さに合わせて円の数を変え、数字を細かく見なくても人口の分布を直感的に比較できるようにした。","imageIndex":25,"imageCount":1,"imageUrls":["assets/gallery/f3d21c33774dc1dcfcb847ab.jpg"],"imageUrl":"assets/gallery/f3d21c33774dc1dcfcb847ab.jpg"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-28","studentName":"岡野俊介　Syunsuke Okano","title":"オリックス・バファローズ 年度別順位の推移 (2015-2025)","tools":"Googleスプレッドシート","projectUrl":"https://docs.google.com/spreadsheets/d/1t5Wq-L8TrYYQLYlA5btTEcHzJ3L7qRlxJcmQm9sxmII/edit?usp=sharing","description":"私は、プロ野球のパ・リーグのオリックス・バファローズの年度別順位の推移(2015年~2025年)のデータを選びました。時系列に沿った順位の推移を直感的に見れるように折れ線グラフを使って可視化しました。可視化によって、長年の下位低迷期から一転して2021年からのリーグ３連覇を達成した劇的なチームの変化がよく読み取れるようになりました。表現上の工夫として、上位が上に来るように縦軸を反転させて１位を最上段に配置したことと、チームカラーの紺色と金色を使って見やすさと世界観を両立させました。","imageIndex":10,"imageCount":1,"imageUrls":["assets/gallery/496b74bebf950d662be56161.png"],"imageUrl":"assets/gallery/496b74bebf950d662be56161.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-25","studentName":"岡悠斗","title":"日本の競技レベルの推移","tools":"Excel","projectUrl":"https://rekidai-carnival.com/asian-games-japan-medals-history/","description":"①アジア大会日本の歴代メダル数一覧　②日本の歴代総メダル獲得数の時系列を棒グラフにまとめて視覚的にわかりやすく可視化した。③歴代の総メダル獲得数の年別の見比べだけでなく、金・銀・銅メダルの割合や数などを特定の年だけでなく複数の年を見比べることができる。④グラフを見ていると日本の獲得数は上振れもしている年も下振れしている年もあるが巨視的にみるとだんだんと獲得数が上がってきている。","imageIndex":2,"imageCount":1,"imageUrls":["assets/gallery/f8f763ea0bee9271e75dea5f.png"],"imageUrl":"assets/gallery/f8f763ea0bee9271e75dea5f.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-26","studentName":"我如古隼人　Hayato Ganeko","title":"Steam人気ゲームの歴代最高同時接続者数と24時間ピークの比較","tools":"Excel","projectUrl":"https://steamdb.info/charts/?sort=peak","description":"SteamDBから、歴代最高同時接続者数が多いSteamゲーム10作品の「歴代最高同時接続者数」と「24時間ピーク」のデータを選びました。\nまず2つの同時接続者数を比較し、さらに「24時間ピーク ÷ 歴代最高同時接続者数」で現在のプレイヤー維持率を計算して横棒グラフにしました。\n可視化することで、Counter-Strike 2やDota 2は歴代最高に対して現在も高い割合のプレイヤーがいる一方、他の多くのゲームでは大きく減っていることが分かります。\nゲームごとの差を比較しやすくするため、維持率が高い順に並べ、横棒グラフで表現しました。","imageIndex":8,"imageCount":2,"imageUrls":["assets/gallery/e4b340fbd8d830a1c94505b8.png","assets/gallery/1af9c98abbfbddfe3e3cca69.png"],"imageUrl":"assets/gallery/e4b340fbd8d830a1c94505b8.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-29","studentName":"貝賀杏奈　Anna Kaiga","title":"My Movie-Watching History by year","tools":"Excel","projectUrl":"自分がこれまでに視聴した映画を記録したオリジナルデータ","description":"自分がこれまでに試聴した映画を記録したオリジナルデータを使いました。エクセルを使って、関数を使い細かくグラフ化にして可視化しました。可視化してわかったことは、2016年に公開された映画の視聴数が一番多かったことで。工夫したことは、グラフを1年づつ細かく作って比べやすくしました。","imageIndex":19,"imageCount":2,"imageUrls":["assets/gallery/d0e13313baf18ceab2c69869.png","assets/gallery/96789dda35f67644a33e824e.png"],"imageUrl":"assets/gallery/d0e13313baf18ceab2c69869.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-25","studentName":"柿木奏太　Souta Kakinoki","title":"2023年の残高推移","tools":"グーグルスプレットシート","projectUrl":"https://docs.google.com/spreadsheets/d/1BZ6Pn7HDIW2DbOD12YZfpFNdI-WpAgvweJDkSPps_uM/edit?usp=sharing","description":"①自分の銀行の残高データ\n②スプレットシートに数値を記録してグラフにして可視化した\n③自分のお金の流れがみえた\n④どの期間にどのくらいの変化があったかを可視化するために金の移動があった全ての日にあえて日付を入れずに空欄にしたこと。","imageIndex":4,"imageCount":1,"imageUrls":["assets/gallery/a508853c0b13d5f9b834ed32.png"],"imageUrl":"assets/gallery/a508853c0b13d5f9b834ed32.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-28","studentName":"岩田知機　iwata chiki","title":"ランニング記録","tools":"ノート、ペン","projectUrl":"https://docs.google.com/spreadsheets/d/1Na-rqwJZy3lzUymniJRQPAuf5TbJfZ1BV4_ZHOK7znc/edit?usp=sharing","description":"自分のランニング記録を日にちごとに棒人間の大きさと高さで可視化を行った。\n\n可視化を行ったことで、長距離を走ったあとには短距離を走ることが多くなる傾向があることに気づけた。\n\n表現上の工夫は、走っていない日は布団のイラストで走ってない日を分かりやすくしたり、距離を大きさや走るフォームによって変えることにより、パット見てわかりやすいものになった。","imageIndex":11,"imageCount":1,"imageUrls":["assets/gallery/fe8ff5e6cd231b32ec72d1a7.jpg"],"imageUrl":"assets/gallery/fe8ff5e6cd231b32ec72d1a7.jpg"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"鬼塚駿　Onitsuka Shun","title":"初代ポケモン 全151体「たかさ」vs「おもさ」散布図","tools":"Excel","projectUrl":"ポケモン徹底攻略　https://yakkun.com/","description":"①初代ポケモン全151体の「たかさ（m）」と「おもさ（kg）」のデータを選びました。\n②横軸にたかさ、縦軸におもさを取り、タイプ別に色分けした散布図として可視化しました。\n③全体の8割以上が2m・100kg以下に集中する一方、カビゴンやイワークなど極端な体格を持つポケモンの存在が浮き彫りになりました。\n④表現上の工夫として、特徴的なポケモンに数値付き注釈を配置し、全体傾向の把握と個別の識別を両立させました。","imageIndex":49,"imageCount":1,"imageUrls":["assets/gallery/f4565da7f29f0a96e24e26a4.png"],"imageUrl":"assets/gallery/f4565da7f29f0a96e24e26a4.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"吉田爽二　Soji Yoshida","title":"男女別就職率","tools":"Excel","projectUrl":"https://www.mext.go.jp/b_menu/toukei/chousa01/naitei/kekka/k_detail/1422624_00027.htm","description":"①男女別の全体・国公立大学・私立大学就職率を選びました。②区分ごとに男子と女子を並べた縦棒グラフにし、数値ラベルを付けました。③全区分で女子が男子を上回り、とくに国公立大学で差が大きいことが分かります。④値が96〜99%台に集まるため縦軸を90%始まりにして差を見やすくし、その旨を注記しました。","imageIndex":28,"imageCount":2,"imageUrls":["assets/gallery/f08654f5e776508f4db06729.png","assets/gallery/09f6ff2ae513ace16499b0ac.png"],"imageUrl":"assets/gallery/f08654f5e776508f4db06729.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"吉野翔大　Shota Yoshino","title":"エスプレッソ系コーヒー飲料の成分比率比較","tools":"ChatGPT","projectUrl":"データセット：自作データ（一般的なカフェレシピに基づくエスプレッソ・ミルク・フォームミルク・お湯の比率データ）  参考情報（標準的なコーヒーレシピ）：https://www.google.com","description":"カフェの定番メニューにおけるエスプレッソ飲料の成分配合比率のデータセットです。各ドリンクを構成するエスプレッソ・温かいミルク、フォームミルク、お湯の比率を100%積層横棒グラフとして可視化しました。名前は知っていても違いが分かりにくかった各ドリンク、例えば、カプチーノとカフェラテとフラットホワイトの液体と泡の比率の違いを一目で比較や把握ができるようになりました。\n表現上の工夫として、実際のコーヒー・ミルク・泡・水を直感的に連想できるよう、各要素の配色を別のカラーに対応させて見やすくしています。","imageIndex":48,"imageCount":1,"imageUrls":["assets/gallery/a5f158f7ef621d699bae7fd4.jpg"],"imageUrl":"assets/gallery/a5f158f7ef621d699bae7fd4.jpg"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"桑久保陽平　Youhei Kuwakubo","title":"Minecraft 各鉱石の生成量の分布","tools":"Excel","projectUrl":"https://ja.minecraft.wiki/w/%E9%89%B1%E7%9F%B3","description":"①マインクラフト(ver1.18~)における各鉱石の高さ別の生成量\n②表を作り、各層10万ブロックあたり何ブロック生成されるかを数値で記して可視化した\n③各鉱石それぞれどの高さを掘れば入手しやすいか、どの高さに生成されやすい/されにくいかという情報が見えるようになった\n④単に表を作るのではなく、実際のゲーム内のアイテムの色に近い背景色を設定することで、どの鉱石を指しているのかを視覚的にわかりやすくした","imageIndex":39,"imageCount":2,"imageUrls":["assets/gallery/270d07f171c33e1d1199db26.png","assets/gallery/fc32b5e77d31aabecaaa49b4.png"],"imageUrl":"assets/gallery/270d07f171c33e1d1199db26.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"黒川旺汰　Kurokawa Outa","title":"平均寿命と健康寿命の差の推移","tools":"excel","projectUrl":"https://www.who.int/data/gho/data/indicators/indicator-details/GHO/gho-ghe-hale-healthy-life-expectancy?utm_source=chatgpt.com","description":"①平均寿命と健康寿命の差の推の一番大きい国と小さい国と分かる範囲の平均\n②折れ線グラフで年代ごとの差を分かりやすく可視化をした\n③2011年にソマリアが平均寿命と健康寿命の差が小さくなったのが分かりやすくなった。\n④違いが分かりやすいといいと思ったので差が大きい国と小さい国を比べました。","imageIndex":27,"imageCount":2,"imageUrls":["assets/gallery/4db1a67abf96bf5f3ec93f91.png","assets/gallery/32a6d38d15b3ac2d212ab53f.png"],"imageUrl":"assets/gallery/4db1a67abf96bf5f3ec93f91.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"佐々木敬太　Keita Sasaki","title":"睡眠時間に対しての私の気分の変動","tools":"Googleスプレッドシート","projectUrl":"https://docs.google.com/spreadsheets/u/0/d/1AY7lmlcbB7zG57XHTpKEznOR5HWQL3cYHfe-kn_4koI/htmlview? ンクに飛べるようにしました。\n③今回はただ思い出を可視化したようになってしまったので、楽しかったことしか伝えることができていないように感じます。今後は移動距離や歩数、時間等を追加することで、よりデータ化することができると考えています。\n④スタンプやお店のマークからHPにとべるようにすることで、スタンプラリーをしているような体験ができるようにしました。\n\nサイトで作成したため、リンクをこちらに共有いたします。\nhttps://ibex-hd53dh.my.canva.site/peacememoriesmine\nパスワード：Mao-peacememories_081789　で開くことができます。","imageIndex":56,"imageCount":1,"imageUrls":["assets/gallery/6ba370e957d221f235d031b1.png"],"imageUrl":"assets/gallery/6ba370e957d221f235d031b1.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"森本颯太","title":"世界のトップサッカー選手10名の市場価値推移","tools":"Googleスプレッドシート","projectUrl":"Transfermarkt： https://www.transfermarkt.com/","description":"Transfermarktから現在のサッカー選手の市場価値トップ10を抽出し、過去5シーズン分の推移データを選びました。このデータをGoogleスプレッドシートにまとめ、Pythonを用いて時系列の折れ線グラフとして可視化しました。この可視化により、トップ層が安定して高水準を維持する一方で、若手選手の価値が直近で急激に上昇しているトレンドが一目でわかるように見えた。","imageIndex":52,"imageCount":2,"imageUrls":["assets/gallery/4acc8213a8fdcec735ee26e8.png","assets/gallery/0f804179e486053ab5b06be2.png"],"imageUrl":"assets/gallery/4acc8213a8fdcec735ee26e8.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"神戸宗一郎 Kanbe Souichirou","title":"MC BATTLE 都道府県勢力図","tools":"VS cord html","projectUrl":"https://github.com/a250927s-create/data-vis.git","description":"1.https://mcbattlenow.com/database/mc/c682f001-d525-438f-8d56-7978cc0cd965\n前回授業で紹介したMCバトルの優勝者データを参考に、彼らの代表する街を調べ上げ地図に反映することで、データを可視化した。\n2.地図上に色の違い、クリックしたら優勝者一覧が表示され、サイドバーに最多優勝県が表示されるようにしている。\n3.ラップバトルが強い街が一目で分かるようになり、その街のバトル、サイファー、Liveイベント等に遊びに行くことでラップを上達させることができることがわかる。\n4.街の優勝者一覧から、そのラッパーがその大会で残したバトルを閲覧することができる。\n全体的に改良の余地があるため、改良を続けていく。","imageIndex":35,"imageCount":2,"imageUrls":["assets/gallery/5c1de30d7bebab7eb9392591.png","assets/gallery/b01bb10a73981ec322f7b2ab.png"],"imageUrl":"assets/gallery/5c1de30d7bebab7eb9392591.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"須藤蒼太　Souta Sutou","title":"台北YouBikeの経路と建物影の可視化","tools":"Codexを使って作成。HTML・CSS・JavaScriptのWebアプリで可視化した。背景にはOpenStreetMapの地図を使用し、その上にSVGで経路、建物影、出発地・到着地を描画した。データの前処理と太陽位置の計算にはPythonを使用し、主なライブラリはGeoPandas、Shapely、pyproj、Pysolarである。Webアプリ上の座標変換にはProj4js、日時変更に伴う日陰の計算にはJavaScriptのWeb Workerを使用している。","projectUrl":"https://drive.google.com/drive/folders/1rWwnfbNWRcV83DsFGapaq3gc_aD4Gr9B?usp=drive_link","description":"①台北のYouBike（レンタサイクル）ステーション間から研究用に選定した15組のODを対象に、最短経路、S2の日陰優先経路、S3の日陰優先経路の計45本を選んだ。ODは出発地（Origin）と到着地（Destination）の組を意味する。これにOSM由来の道路・建物形状と建物高さ、日付・時刻ごとの太陽位置、経路の総距離・日陰距離・日なた距離を組み合わせた。\nS2はOSMの建物高さを使い、高さがない場合には階数×3mで補う。S3はさらに、用途地域別に推定した高さの中央値で欠損を補う。\n予測対象の日時は2026年9月11～16日、台北時間9:00～17:00、1分単位である。\nこれは実際の利用者の走行記録や交通量のデータではなく、選定したODについてのモデル経路と建物影の予測データである。\n\n②地図上に予測された建物影を半透明の緑色の面として重ね、最短経路を灰色、S2を橙色、S3を青色の線で表示した。\n利用者はOD、日付、時刻、建物高さのシナリオ、表示する経路を選択できる。\n数値欄には経路の総距離、予測日陰距離、日なた距離、日陰率を表示する。日陰率は「日陰距離÷総距離」で求める。日時を変えると、建物影と固定経路上の日陰距離・率が再計算される。\n経路自体は代表日時に選定したものを固定しており、変更後の日時で最適経路を再探索する仕組みではない。\nまた、背景の建物影のシナリオと経路の評価シナリオは区別する必要がある。\nS2経路の数値はS2、S3経路の数値はS3で評価され、最短経路の数値は選択した背景シナリオで評価される。\n\n③どの道路に建物影がかかると予測されるか、建物高さの補完方法や時刻を変えると影の位置・広がりがどう変化するかを確認できるようになった。\nまた、移動距離の短さと日陰の多さの関係を読み取れる。\n例えばD1の2026年9月13日9:00では、同じS3の建物モデルで評価すると、最短経路は約706m・日陰率26%、S3の日陰優先経路は約1,003m・日陰率72%だった。\n約297mの迂回によって、予測日なた距離は約525mから約279mへ減る。一方、同じS3の日陰優先経路でも15:00には日陰率が約27%となる。この例から、朝に日陰が多い経路の利点が、別の時刻にも同程度に続くとは限らないことが分かる。\nこれらは建物形状・推定高さ・太陽位置に基づく計算結果であり、実測した日陰ではない。可視化だけで現地での予測精度やS3の優位性を証明できるものではなく、樹木、天候、体感温度はこの建物影モデルの対象に含まれていない。\n\n④日陰を半透明の「面」、経路を色付きの「線」として重ねた。面で影の空間的な広がりを示し、線で移動する位置を示すことで、どの経路が影の中を通るかを同じ地図上で読み取れる。半透明にすることで、背景の道路や地名も確認できる。この表現によって、数値表だけでは捉えにくい日陰と経路の位置関係を伝えられる。\n\n実際のwebアプリのURL：https://taipei-shade-field-demo.hatsume1k4.chatgpt.site/#field/D1","imageIndex":36,"imageCount":2,"imageUrls":["assets/gallery/ab840b58a67615f4b70f6c31.jpg","assets/gallery/b14d8d844c53c46c159b434e.jpg"],"imageUrl":"assets/gallery/ab840b58a67615f4b70f6c31.jpg"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"石引響 Ishibiki Hibiki","title":"2020年から2025年の東京の降水量","tools":"Microsoft Excel","project 最初の可視化","submittedAt":"2026-09-30","studentName":"北浦義就　Yoshiyuki Kitaura","title":"政党支持率の推移","tools":"JavaScript","projectUrl":"https://docs.google.com/spreadsheets/d/1Flszvzg9TWAiU-7_ujmSCdtw1M7nvwMlrTdXBF9feDo/edit?usp=sharing","description":"①社会実績データ図録にある政党支持率の推移のデータを選んだ。\n②イラストとして出ていたグラフをAIに数値化させてCSVにしたものをもう一度折れ線グラフにして可視化した。\n③阿部内閣になってからそれ以前までは低かった自民党の支持率が一気に約２倍まで上がったことが分かった。\n④グラフで表示する内容を1年に絞ることで元のグラフより見やすくした。","imageIndex":22,"imageCount":1,"imageUrls":["assets/gallery/1af826f664990ed7bf76863f.png"],"imageUrl":"assets/gallery/1af826f664990ed7bf76863f.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"木村英明　Kimura Hideaki","title":"フォートナイトコラボスキン別統計","tools":"chatgpt、Gemini","projectUrl":"https://fndb.gg/characters/?utm_source=chatgpt.com","description":"コラボスキンの全体、日本、アメリカの3つに分け、円グラフで見やすく棒グラフでカテゴリー別の差が分かった","imageIndex":38,"imageCount":2,"imageUrls":["assets/gallery/066fa4b06fb434afab98fbf4.png","assets/gallery/6166fa4fb4bb0adeb404c543.png"],"imageUrl":"assets/gallery/066fa4b06fb434afab98fbf4.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-29","studentName":"野村隆介　Nomura Ryuusuke","title":"米派とパン派の割合","tools":"エクセル","projectUrl":"https://www.e-stat.go.jp/dbview?sid=0004023612","description":"①政府統計の窓口e-statで家計調査家計収支編総世帯から米とパンの割合を求めた、②円グラフが分かりやすいだろうと考え円グラフで可視化した、③この可視化により米派よりパン派の方が多いことが見えるようになった④グラフにも円グラフや点線グラフなどがあるが割合を図るなら円グラフが最適だろうと考え、円グラフにした。","imageIndex":18,"imageCount":1,"imageUrls":["assets/gallery/166513ed41f8b39d311cfb5c.png"],"imageUrl":"assets/gallery/166513ed41f8b39d311cfb5c.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"矢部夢華　Yumeka Yabe","title":"スタジオジブリ映画の興行収入を比較する","tools":"Googleスプレッドシート","projectUrl":"スタジオジブリ映画10作品の日本国内での興行収入データ","description":"①ジブリ10作品の興行収入\n➁横向き棒グラフ\n③作品ごとの差、高い作品\n④横向きのグラフにして作品名を見やすくした","imageIndex":32,"imageCount":1,"imageUrls":["assets/gallery/d44d29a595bb89a236472d93.png"],"imageUrl":"assets/gallery/d44d29a595bb89a236472d93.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"林瞳　Hayashi Akira","title":"-POP・ボカロヒット曲と個人嗜好におけるポジショニングおよび視覚表現の比較分析","tools":"エクセル、パワーポイント、YouTube、Gemini","projectUrl":"エクセル(二枚目のスクリーンショット)にまとめたため、それで判断しでほしいです。","description":"①YouTubeにおける一般ヒットJ-POP 10曲、ボカロヒット10曲、および自身の嗜好である叙情派・ダーク系10曲の計30曲を対象に、BPM、感情トーン、サムネイル傾向を集計した独自データセットを作成しました。\n\n②縦軸にBPM、横軸に感情トーン（切ない ↔ 明るい）を設定したポジショニングマップ上に、著作権法の引用ルールに則り枠線で識別した各曲のサムネイルと曲名カードを配置して可視化しました。\n\n③一般ヒットやボカロ曲が「明るい×ハイテンポ」を中心に分布するのに対し、自身の嗜好領域はBPMに関わらず「切ない・ダーク」に強く密集しており、市場トレンドと個人嗜好の明確な差が浮き彫りになりました。\n\n④Data Visualizationの可読性と著作権配慮を両立するため、カテゴリ別の枠線色と引用注釈を設定し、位置だけでなくデザイン・表現傾向の違いも直感的に識別できるよう選択・設計しました。","imageIndex":43,"imageCount":2,"imageUrls":["assets/gallery/1bfc8b15aa8a1cc3768e4aca.png","assets/gallery/5c789695677ab84a9b6977c4.png"],"imageUrl":"assets/gallery/1bfc8b15aa8a1cc3768e4aca.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"鈴木小太朗　Kotarou Suzuki","title":"プロ野球トップ選手の打率比較","tools":"Excel","projectUrl":"https://npb.jp/","description":"①プロ野球選手４人の１０年間の打率データを選んだ。②棒グラフにすることで年度別で比較し１０年間の打率を可視化した。③１年ごとの打率の変化の特徴が可視化され、年齢による衰え方の違いも出た。④これは個人的なこだわりだが棒グラフの色を選手の所属球団の色に寄せてみた。","imageIndex":50,"imageCount":1,"imageUrls":["assets/gallery/f366f015b3ff442697c11fe0.png"],"imageUrl":"assets/gallery/f366f015b3ff442697c11fe0.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"鈴木優　Yu Suzuki","title":"中2の妹に対する小言・喧嘩ログ","tools":"紙・Googleスプレッドシート","projectUrl":"https://docs.google.com/spreadsheets/d/1h09dnTiUopct10Yk_4NEnKKMuSV9QEQQrezXomRsWmI/edit?usp=sharing","description":"① 実家で一緒に暮らしている中2の妹とのやり取りを5日間記録して、時間やきっかけ、妹の態度、自分のイライラ度（0〜5の6段階）をまとめたオリジナルのデータセットを作りました。\n\n② 横軸に日付を置いて、イライラした度合いを上向きの「トゲの高さ」、逆に妹が親に怒られて思わず笑ってしまった瞬間（怒り度0）を下向きの「緑の丸」にして、ノートに手描きで可視化しました。\n\n③ グラフにしてみると、学校が始まってからは顔を合わせる夕方以降に衝突が集中していることや、普段のちょっとした小言（青いトゲ）よりも、煽られたり理不尽なことを言われた日（9/28の赤い大きなトゲ）に怒りが跳ね上がっているのが一目で分かりました。\n\n④ せっかく初回の課題なのでこの授業を楽しんでできるよう堅苦しいデータではなく、そして誰もやらないような自分自身のデータを取ろうと考えこのデータを可視化しました。授業内ワークで見つけた『Dear Data』のように日常のチクチクした感情が直感的に伝わるトゲのモチーフを取り入れたのですが5日間だとデータ数が少なくて余白が寂しくなってしまったのが反省点です。","imageIndex":51,"imageCount":1,"imageUrls":["assets/gallery/59220dc8f63f1bbfe832520a.jpg"],"imageUrl":"assets/gallery/59220dc8f63f1bbfe832520a.jpg"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-30","studentName":"齋藤さくら Sakura Saito","title":"私はバイト限定雨女なのか","tools":"Excel","projectUrl":"https://tenki.jp/past/2026/08/weather/3/15/47682/","description":"「tenki.jp」というサイトで2026年8月において千葉県・千葉に雨が降った日を調べ、私が8月にバイトをした日に雨が降ったかどうかを調べた。Excelで雨が降った日とバイトがあった日をまとめ、「８月の雨が降った日の割合」「バイトをした日に雨が降った日の割合」の2つの円グラフにしてまとめた。可視化により、２つの割合はほとんど変わらないことがわかった。工夫としては円グラフの色分けをし、視覚的に雨が降ったかわかりやすくした。","imageIndex":20,"imageCount":1,"imageUrls":["assets/gallery/d5d148b4a1fe9187f759dfe0.png"],"imageUrl":"assets/gallery/d5d148b4a1fe9187f759dfe0.png"}]}</script><script src="assets/i18n.js?v=default-ja-20260925"></script><script src="assets/site.js?v=gallery-two-images-20261002"></script></body></html>
