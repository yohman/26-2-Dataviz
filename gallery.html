<footer class="site-footer"><div class="wrap footer-grid"><p><strong>2026–2 Data Visualization</strong><br>Instructor: Yoh</p><p>Latest weekly work · IDs and emails private.</p><p><a href="agenda.html">Open the Agenda</a> · <a href="resources.html">Course guide</a></p></div></footer><link rel="preload" as="image" href="assets/gallery/7fcb428f189646be4f1f2b28.png"><link rel="preload" as="image" href="assets/gallery/6ec0681b506159ef1270753e.png"><link rel="preload" as="image" href="assets/gallery/34325cc15b02979b3859eb3d.jpg"><script id="gallery-snapshot" type="application/json">{"generatedAt":"2026-10-08T23:26:20.239Z","items":[{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"Welhemina Gansah","title":"Teen Fitness and the Planet Fitness High School Summer Pass","tools":"Google Sheets","projectUrl":"https://www.prnewswire.com/news-releases/planet-fitness-inspires-approximately-3-7-million-teens-to-prioritize-fitness-through-its-high-school-summer-pass-program-302876527.html","description":"I selected survey results from Planet Fitness's 2026 High School Summer Pass, a free summer program in which about 3.7 million teens ages 14-19 took part. I entered six percentages into Google Sheets and made a horizontal bar chart, ordered from highest to lowest, so the results can be compared at a glance. What became evident is that teens reported the biggest benefits for mood (93%), mental health (84%), and self-confidence (83%), while working out with a friend (53%) was far more common than working out with a sibling (20%) or a group of friends (15%). My creative choice was to color the three well-being bars one color and the three social bars another, with the percentage written on each bar, so the two themes are easy to tell apart. These results are self-reported in a survey run by Planet Fitness itself.","imageIndex":95,"imageCount":1,"imageUrls":["assets/gallery/7fcb428f189646be4f1f2b28.png"],"imageUrl":"assets/gallery/7fcb428f189646be4f1f2b28.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-06","studentName":"ティム フォン シャルペン","title":"Bundesliga Football Players Peak Value compared to their Age","tools":"Claude Ai, GitHub","projectUrl":"https://github.com/dcaribou/transfermarkt-datasets","description":"1. I used player value data from Bundesliga Strikers and Goalkeepers between the ages of 17 and 36. In total I used data from 734 Strikers and 274 Goalkeepers between 2000 and 2026. 2. I converted each players market value into percentages of their own career-high value and plotted the age-based medians using two line graphs. 3. The visualization shows that goalkeepers and strikers market value progresses relatively the same early on but strikers reach their peak market value earlier and start declining faster in comparison to the goalkeepers. 4. I used percentages instead of Euro market value as some super stars might disproportionately affect the real comparison. \n\nLink for the interactive chart:https://claude.ai/artifact/6jZZr3nfjhzgUnD8ZVHEN6","imageIndex":72,"imageCount":1,"imageUrls":["assets/gallery/6ec0681b506159ef1270753e.png"],"imageUrl":"assets/gallery/6ec0681b506159ef1270753e.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-07","studentName":"テズジャン  デイララ  Dilara Tezcan","title":"Did Asia feel as different as the research says?","tools":"Power Point , Claude, Excel","projectUrl":"Hofstede Country comparison: https://geerthofstede.com/country-comparison-bar-charts/","description":"I chose Hofstede's cultural dimension scores (power distance, individualism, uncertainty avoidance, long-term orientation) for Germany, Thailand, Malaysia, China and Japan and compared them with my own 0–100 ratings of how different each country felt from Germany. I visualized the research as a table, my experience as a dumbbell chart for Japan, and the gaps between the two as a ranked bar chart. The visualization shows that Japan is closest to Germany on paper, but that my biggest surprise was Japan's individualism, which felt 49 points more different than the research says. To guide the eye, I used orange for the key result and kept everything else in muted beige and brown tones.","imageIndex":76,"imageCount":2,"imageUrls":["assets/gallery/34325cc15b02979b3859eb3d.jpg","assets/gallery/933daf6d86d00f0ce9378b29.jpg"],"imageUrl":"assets/gallery/34325cc15b02979b3859eb3d.jpg"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-07","studentName":"モンテッラ エドウィン　MONTELLA EDWIN","title":"The Big Mac Index V2","tools":"VS Code, Claude","projectUrl":"The Economist「The Big Mac index」（公式ページ） https://www.economist.com/big-mac-index The Economist ビッグマック指数データ（GitHub） https://github.com/TheEconomist/big-mac-data 使用したCSVファイル（2000年4月〜2026年7月、54か国） https://github.com/TheEconomist/big-mac-data/blob/master/output-data/big-mac-full-index.csv","description":"本作品では、The Economistが公開している「ビッグマック指数」（2000年〜2026年、54か国）のデータを使い、同じ商品の価格をドル換算で比べることで、各国通貨の強さを読み取りました。可視化は、スライド形式のインタラクティブなウェブサイトとして制作しました。日本の対ドル評価の推移を、再生すると線が描かれていく折れ線グラフで、2000年と2026年の26か国の変化をスロープチャートで、現在の54か国を地域別のドットチャートで示しました。その結果、日本のビッグマックはアメリカより24%高かった状態から50%安い状態へと74ポイント下落し、これは26か国の中で最大の下落であることが一目で分かるようになりました。改善点として、各スライドの見出しを「何が分かるか」という結論の文にしたうえで、日本だけを青で強調し、他の国をグレーにすることで注目点を明確にしました。さらに、2008年の金融危機、2013年のアベノミクス、2022年の日米金利差という出来事の注釈をグラフに加え、変化の理由も読み取れるようにしました。\nThe Big Mac Index V1 :  https://edwin379.github.io/The-Big-Mac-Index/\nThe Big Mac Index V2 : https://edwin379.github.io/The-Big-Mac-Index-V2/","imageIndex":74,"imageCount":2,"imageUrls":["assets/gallery/bd0ab0b491c124385081a75c.png","assets/gallery/578828bda9151bbacd8f7d37.png"],"imageUrl":"assets/gallery/bd0ab0b491c124385081a75c.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-06","studentName":"粟野翔　Awano Kakeru","title":"年齢と活動開始時期の関係","tools":"Python　Claude","projectUrl":"https://docs.google.com/spreadsheets/d/1ZG5C8F2NKEpbc41lfUGUKE4qy8c1922gRfUGUaHUjQc/edit?usp=sharing","description":"①HARDCORE TANO*Cメンバーの年齢と活動年数②ダンベルチャートで年齢と活動年数の関係を可視化③活動を開始した時期は17~21歳に集中していることが分かった。④ダンベルチャートを用いることでどのメンバーが何歳で活動を開始したかを比較して可視化することができた。","imageIndex":67,"imageCount":1,"imageUrls":["assets/gallery/8d59ce324e5e3abaaa471eb4.png"],"imageUrl":"assets/gallery/8d59ce324e5e3abaaa471eb4.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"伊藤千夏Ito Chinatsu","title":"駅の利用ランキング","tools":"神","projectUrl":"https://drive.google.com/file/d/1ySGCCEbR_0Tv8rPEqoaLYD2LJVYSqG8G/view?usp=drivesdk","description":"①交通系ICカードの利用履歴から、8月10日〜16日の1週間に利用した駅・利用回数・利用した曜日をデータとして選んだ。\n②駅ごとの利用回数をマスの数で表し、それぞれのマスに利用した曜日を入れて可視化した。\n③どの駅をよく利用しているのかだけでなく、どの曜日にその駅を利用したのかも見えるようになった。\n④1マス＝1回の利用とし、曜日をマスの中に入れることで、利用回数と利用した曜日を同時に表現した。","imageIndex":109,"imageCount":1,"imageUrls":["assets/gallery/063bb4022a8a0520e6e8bfb8.jpg"],"imageUrl":"assets/gallery/063bb4022a8a0520e6e8bfb8.jpg"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-06","studentName":"伊藤拓哉　Ito Takuya","title":"セ・パ　リーグ別2025年の1試合平均観客動員数","tools":"excel","projectUrl":"https://baseball-freak.com/audience/25/","description":"①プロ野球12球団の2025年の「1試合平均観客動員数」データを選択しました。②FlourishのColumn chartを使用し、セ・リーグとパ・リーグの2つのグリッドに分けたうえで、各球団の集客数を大きい順で可視化しました。③可視化したことで、両リーグともに上位球団と下位球団の間で明確な集客力格差が存在するパターンが明確になりました。④表現上の工夫として、画面上の「色」の設定から各球団固有のチームカラーをカスタム割り当て、視覚的な直感性と識別性を大きく高めました。","imageIndex":73,"imageCount":1,"imageUrls":["assets/gallery/17ffbba77eca764aa013d07c.png"],"imageUrl":"assets/gallery/17ffbba77eca764aa013d07c.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-02","studentName":"伊澤颯馬　Soma Izawa","title":"都道府県別　ゲームセンターチェーン＆MAP","tools":"Claude、Vs code(HTML)、Datawrapper、Netlify","projectUrl":"https://calm-fox-a7206c.netlify.app/","description":"各ゲームセンターチェーン店の公式サイトから各県ごとにClaudeに集計させ、都道府県別ゲームセンター数の多いチェーン店がわかるようにしました。それぞれのチェーンを選択するとどの県に多いのかがわかるようにしたとともに、都道府県をクリックするとその県の全店舗が見られるようになっているほか、店舗をクリックするとその店の公式サイトに飛べるように設定しました。","imageIndex":61,"imageCount":2,"imageUrls":["assets/gallery/580fd5f25882752d613632c4.png","assets/gallery/30c232deb6c463041b26cb41.png"],"imageUrl":"assets/gallery/580fd5f25882752d613632c4.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-06","studentName":"永野虎太郎　Kotarou Nagano","title":"阪神タイガース来季構想","tools":"https://facounter.net/count/hst.html","projectUrl":"https://docs.google.com/spreadsheets/d/1AFbgC1hbyVhKdBTWYjziu4jDlSqPAoq9Vbjup_5fvn0/edit?usp=sharing","description":"1．前回の場合は今季の試合での結果だったのにでそして先日阪神タイガーズが優勝したのでそれに対し来シーズンにどうなるかを改めて整理しておきたいと思いこうしました。\n2．今回は国内ＦＡ権を可視化するのとそれといろいろな記事ト過去の傾向からなどを見て阪神の残留率を独断と偏見ではありますがつけてみました。\n3．今回のかしかで来シーズンに三連覇できる確率が合わってくると感じました。\n4．過去の傾向と去年の契約交渉の際佐藤選手の交渉方法と球団からの条件提示でのを見てこのような少ない確率にしました低確率ではありますがメジャーの球団の事情もあるためこのくらいの数字にしました外人選手の確率も過去の傾向をこのようにしました。","imageIndex":70,"imageCount":1,"imageUrls":["assets/gallery/1d908aaae8c6c0d72efea1d1.png"],"imageUrl":"assets/gallery/1d908aaae8c6c0d72efea1d1.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"岡本結衣　Okamoto Yui","title":"都道府県別人口ランキング","tools":"Excel、チャットGPT","projectUrl":"https://memorva.jp/ranking/japan/soumu_population_pref.php","description":"①47都道府県の人口データを選び、人口の多い都道府県を比較した。\n②人口の多い順に並べ、都道府県ごとの人口を棒グラフで表した。\n③可視化することで、東京都の人口が特に多く都道府県によって人口に大きな差があることが分かりやすくなった。\n④表現上の工夫としてシンプルな棒グラフにして、余計な装飾を減らし人口の違いに注目できるようにした。","imageIndex":78,"imageCount":1,"imageUrls":["assets/gallery/04140a37276269503aeaa03b.png"],"imageUrl":"assets/gallery/04140a37276269503aeaa03b.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-05","studentName":"岡野俊介　Syunsuke Okano","title":"オリックス・バファローズ 年度別順位の推移(2015-2025)","tools":"Googleスプレッドシート","projectUrl":"https://docs.google.com/spreadsheets/d/1t5Wq-L8TrYYQLYlA5btTEcHzJ3L7qRlxJcmQm9sxmII/edit?usp=sharing","description":"オリックス・バファローズの年度別順位データ（2015〜2025年）を選び、順位の変遷を折れ線グラフで表現しました。可視化したことで、長年のBクラス低迷から2021年の中嶋監督就任を機に3連覇という黄金期を築き上げた劇的なV字回復の軌跡が一目で読み取れるようになりました。工夫した点として、3位と4位の間にAクラスの境界線を引くとともに、最も強調したい3連覇の期間に黄色の網掛けと注釈を添え、単なる順位推移だけでなく、チームの背景や文脈が直感的に伝わるようにしました。","imageIndex":66,"imageCount":1,"imageUrls":["assets/gallery/2a5997529d5525fb7dda9e37.png"],"imageUrl":"assets/gallery/2a5997529d5525fb7dda9e37.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-04","studentName":"岡悠斗","title":"アジア大会でのメダルによる分析","tools":"Excel","projectUrl":"https://rekidai-carnival.com/asian-games-japan-medals-history/","description":"①アジア大会での日本のメダルの獲得総数などが記載されていたWebページ②Excelで歴代のアジア大会の日本のメダルの割合やメダルの総数などをグラフでわかりやすくまとめた。③そのグラフなどを見て分析を行った。\nスクリーンショット1では一番右のグラフで日本のメダルの内訳や金、銀、銅メダルの割合をまとめた。左のグラフでは自分が独自の評価基準で歴代の日本の競技レベルの推移を可視化した。\nスクリーンショット2では歴代の日本のメダル総数データをもとに、金ー銀　金ー銅　銀ー銅の3通りの組み合わせでどれだけ相関しているかを可視化したグラフ。どれも正の相関気味になっており、銀銅＞金銀＞金銅の順で正の相関が強かった。\n④グラフの背景の色などを見て棒グラフや文字の色などを気にしてなるべく見やすく工夫した。","imageIndex":63,"imageCount":2,"imageUrls":["assets/gallery/bade1b79847c5f37b8fb7f0e.png","assets/gallery/1814dc5c84c33ff0fab65e6a.png"],"imageUrl":"assets/gallery/bade1b79847c5f37b8fb7f0e.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"我如古隼人　Hayato Ganeko","title":"Steam人気ゲームTOP10の歴代最高同時接続者数と24時間ピークの比較","tools":"Python(AI)","projectUrl":"https://steamdb.info/charts/?sort=peak","description":"SteamDBから、人気ゲーム10作品の歴代最高同時接続者数と24時間ピークのデータを選びました。2つの数値を横棒グラフで重ねて表示し、ゲームごとの差を比較しやすくしました。可視化することで、歴代最高の人数が多くても現在の24時間ピークは低いゲームがある一方、Counter-Strike 2やDota 2のように現在も高い水準のゲームがあることが分かります。前回よりも2本の棒を重ねることで、過去と現在の差が一目で分かるように工夫しました。","imageIndex":99,"imageCount":1,"imageUrls":["assets/gallery/f93ebcb22940efaf6d29e18f.png"],"imageUrl":"assets/gallery/f93ebcb22940efaf6d29e18f.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-06","studentName":"貝賀杏奈　Anna Kaiga","title":"My Movie-Watching History by Year","tools":"Excel、flourish","projectUrl":"自分のデータ","description":"前回の自分が見た洋画のデータを使いました。今回は10年ごとに分けてジャンル別に可視化しました。可視化したことによって、2010sの映画はアクションを多く見ていて、ミュージカルも多く見ていました。工夫したことは、色を使って区別つきやすいようにしたことと、数が多いので10年ごとに分けました。","imageIndex":68,"imageCount":1,"imageUrls":["assets/gallery/4cb8984e7af7528ffd91b095.png"],"imageUrl":"assets/gallery/4cb8984e7af7528ffd91b095.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-03","studentName":"柿木奏太　Kakinoki Souta","title":"2023年の残高推移（改）","tools":"スプレットシート","projectUrl":"https://docs.google.com/spreadsheets/d/1BZ6Pn7HDIW2DbOD12YZfpFNdI-WpAgvweJDkSPps_uM/edit?usp=sharing","description":"①自分の2023年の口座の残高推移\n②データをスプレットシートに入力してグラフにした。\n③引き出した回数と期間が通帳を見るよりわかりやすくなった。\n④１回で２万円近くの引き出しがあった場合はそのグラフの線の上に警告マークを出して自分以外にもわかりやすくした。","imageIndex":62,"imageCount":1,"imageUrls":["assets/gallery/5ec992273057d5ee995617ad.png"],"imageUrl":"assets/gallery/5ec992273057d5ee995617ad.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"岩田知機　iwata chiki","title":"ランニング記録Ⅱ","tools":"紙　鉛筆","projectUrl":"https://docs.google.com/spreadsheets/d/1Na-rqwJZy3lzUymniJRQPAuf5TbJfZ1BV4_ZHOK7znc/edit?usp=sharing","description":"自分の走った記録を使った。前回と違い大きさだけではなく色の濃淡や、風のエフェクトを使ってよりどの日が一番多く走ったかを分かりやすくした。可視化により8月7日が一番走っていることがわかった。前回よりもより多く走った日が強調された。ただ、前回の方が記録として全体を見るのには向いているのかなと感じた。","imageIndex":88,"imageCount":1,"imageUrls":["assets/gallery/a679e75f2ef8a5bc9bcfc5d3.jpg"],"imageUrl":"assets/gallery/a679e75f2ef8a5bc9bcfc5d3.jpg"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"鬼塚駿　Onitsuka Shun","title":"初代ポケモン１５１匹体格分布","tools":"Excel,VSCode","projectUrl":"https://yakkun.com/","description":"① タイプ別の15色分類を廃止し、一般ポケモンをグレー、注目個体のみを赤で強調して視覚的階層を整えました。\n②「2m・100kg」の境界線と背景エリアを追加し、データ全体の集中の度合いをわかりやすくしました。\n③ 全体の約8割（125体）がコンパクトな領域に収まる一方、タイプを超えて極端な体格を持つ個体の存在に気づいてほしいです。\n④ 重なっていた注釈ラベルの位置を整理して指示線（矢印）を付け、視認性と識別性を高めました。","imageIndex":79,"imageCount":1,"imageUrls":["assets/gallery/63ad5848f8250bad79197a96.png"],"imageUrl":"assets/gallery/63ad5848f8250bad79197a96.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"吉田爽二　Soji Yoshida","title":"男女別就職率","tools":"PowerPoint","projectUrl":"https://www.mext.go.jp/b_menu/toukei/chousa01/naitei/kekka/k_detail/1422624_00027.htm","description":"①文部科学省の男女別の就職率を選びました。全体(男子97.5%・女子98.7%)、国公立大学(男子96.6%・女子99.3%)、私立大学(男子97.7%・女子98.6%)の3区分6個の値です。②区分ごとに男子(青)と女子(オレンジ)の点を線で結ぶドットプロットにし、点に値を、線の上に差を表示しました。③全区分で女子が男子を上回り、とくに国公立大学で差が2.7ポイントと最大で、私立大学では0.9ポイントと小さいことが一目で分かります。④表現上の工夫として、結論そのものをタイトルにし、差の大きい順に並べて国公立大学の行を強調しました。第1週の棒グラフでは縦軸を90%始まりにして差の見え方が変わっていましたが、位置で値を比べるドットプロットなら、95%始まりでも差を誇張しません。","imageIndex":86,"imageCount":1,"imageUrls":["assets/gallery/8cc2494595b4630da3956803.png"],"imageUrl":"assets/gallery/8cc2494595b4630da3956803.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"吉野翔大　Shota Yoshino","title":"エスプレッソ系コーヒー飲料の成分配合比率（100%積層縦棒グラフによる比較）","tools":"Excel、ChatGPT","projectUrl":"https://www.nichecoffee.co.uk/blogs/exploring-coffee/espresso-to-milk-ratios-getting-the-balance-right","description":"今回作成した作品は、カフェの定番メニューにおける「エスプレッソ飲料の成分配合比率（％）」のデータセットです。エスプレッソ・温かいミルク・フォームミルク・お湯の構成要素をドリンクごとに100%積層縦棒グラフとして可視化しました。ドリンクごとの「液量・泡・水のバランスの違い」を縦方向の割合で一目に比較できるようにしました。表現上の工夫として、実際のコーヒー・ミルク・泡・水を想起させる色使い（深茶・ベージュ・白・水色）を使用し、各バーの中に直接％の数値をのせることで見やすくしています。","imageIndex":83,"imageCount":1,"imageUrls":["assets/gallery/04250124e08bec09457d775b.jpg"],"imageUrl":"assets/gallery/04250124e08bec09457d775b.jpg"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"桑久保陽平　Youhei Kuwakubo","title":"Minecraft 各鉱石の分布 -改-","tools":"Excel","projectUrl":"https://ja.minecraft.wiki/w/%E9%89%B1%E7%9F%B3","description":"1:前回同様マイクラver1.18以降の鉱石の高さ別の分布を選んだ。\n2:前回の表形式の可視化に加え、折れ線グラフも用意した。\n3:折れ線グラフも用意できたことにより、細かな数字はわからないものの、表に比べて大まかな数値が分かりやすくなった。表と折れ線グラフを合わせて見ることでより鉱石の分布が可視化できるようになった。\n4:表を前回から修正し、各鉱石の生成量の期待値が最も多くなる高さの部分を目立たせて分かりやすくした。折れ線グラフについては、線の色を実際の鉱石の色に近いものにすることで凡例を見なくても直感で感じ取れるようにした。もし分からなくても凡例を見ればわかるようになっている。","imageIndex":81,"imageCount":2,"imageUrls":["assets/gallery/07c62a81d611fe8d17ba781b.png","assets/gallery/90a52595fb5f0c7bb09eccb9.png"],"imageUrl":"assets/gallery/07c62a81d611fe8d17ba781b.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-06","studentName":"佐藤陸　Riku Sato","title":"Amazon商品　レビュー×評価","tools":"Excel","projectUrl":"https://www.kaggle.com/datasets/arhamrumi/amazon-product-reviews?resource=download","description":"①Amazon商品のレビュー\n②excelのピボットテーブルを使い可視化した。\n③商品への評価は圧倒的に５が多かったこと\n　レビュー数が最も多くても最も高評価というわけではないこと\n　レビュー数は評価が多くなるほど多くなることがわかる。\n④前回と変わったところはグラフの評価を数字で表していたが★マークのほうが直感的にわかりやすいと思い変えたところ。\n　最初に見て何のグラフかわからなかったので、グラフの背景にAmazonのロゴを載せることでぱっと見でわかるようにした。","imageIndex":69,"imageCount":2,"imageUrls":["assets/gallery/f3d8548c69761f79546978f8.png","assets/gallery/47f1abe05a7ac59a24ecaed8.png"],"imageUrl":"assets/gallery/f3d8548c69761f79546978f8.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"佐藤翔　sato kakeru","title":"東京喰種のリセット狙いはどこまで打つ？","tools":"Excel","projectUrl":"https://youtu.be/-JimNTgg6lg?si=257PBfv2W3kZ8AkS","description":"東京喰種のリセット狙いにおける実戦データ9台分を選び、ATに到達した6台について、AT到達ゲーム数と収支の関係をグラフで可視化しました。これにより、ATに早く到達しても必ず大きなプラスになるわけではなく、AT到達ゲーム数と収支の関係が一様ではないことが見えるようになりました。表現上は、ゲーム数を横軸、収支を縦軸にすることで、それぞれの実戦結果を比較しやすくしました。","imageIndex":98,"imageCount":2,"imageUrls":["assets/gallery/87d13b20df4e118fae62efa3.png","assets/gallery/905d309f2f25f97eb8e3f444.png"],"imageUrl":"assets/gallery/87d13b20df4e118fae62efa3.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"坂本快　Sakamoto Kai","title":"スプラトゥーンブキランキング","tools":"Excel","projectUrl":"https://docs.google.com/spreadsheets/d/e/2PACX-1vTdnVQUTLGxET1f1ymWBSNqYdQH6IA_ShGwOMP72p3tuXJIVMA3nIlFH2Yyvlg1gxy3Jx5CAkFX3F31/pubhtml","description":"①game withというサイトの【スプラレイダース】最強武器ランキング・おすすめ武器まとめ【スプラトゥーン レイダース】というページのユーザー投票ランキング ②Excelで数値を入力し、おすすめグラフ機能から円グラフを生成 ③シンプルな操作のシューターが愛用されていて、その次に比較的簡単に大きなダメージを出せるワイパーとブラスターが並んでいる。このことから初心者から上級者まで幅広いユーザーがサイトを利用していると考えられる。 ④11種類の１つ１つに色をつけるとかえって見ずらく感じたのでじょうごに変えて数値を埋め込む形で見やすくなるようにした。","imageIndex":104,"imageCount":1,"imageUrls":["assets/gallery/1b69d4f404346119c0802b34.png"],"imageUrl":"assets/gallery/1b69d4f404346119c0802b34.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"坂野真人　Masato Sakano","title":"モンハンの作品通しての武器使用率","tools":"スプレットシート","projectUrl":"ワイルズ→https://gamewith.jp/mhwilds/494093   サンブレイク→https://game8.jp/mhrise/534224　　アイスボーン→https://game8.jp/mhw/195232　　スプレットシート→https://docs.google.com/spreadsheets/d/1b6k2KmOUPH7QE-uHsLpJ5mK0QBLTRkztlm2KMl5mn7w/edit?usp=sharing","description":"①モンスターハンターのワイルズ（2025）、サンブレイク（2022）、アイスボーン（2019）における武器の使用数のデータを選びました\n②3作品の武器使用数を比較できるように、作品ごとに色を分けた棒グラフで可視化しました\n③武器ごとの使用数の違いや、作品によってよく使われる武器が異なることが分かるようになったと思います。以前のモンスター数のグラフと比べても、武器使用数の方が作品ごとの特徴や人気の違いを直接比較しやすいと感じると思います\n④3作品を青・赤・黄色で統一して色分けし、同じ武器について3作品の使用数を横並びで比較できるようにしました","imageIndex":89,"imageCount":1,"imageUrls":["assets/gallery/6d0fa05709526569e4b2a1e8.png"],"imageUrl":"assets/gallery/6d0fa05709526569e4b2a1e8.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-02","studentName":"山崎来斗　Raito Yamasaki","title":"2027年の祝日数","tools":"Excel","projectUrl":"https://www.benri.com/calendar/2027.html","description":"1来年の祝日数\n2Excelの集合縦棒グラフで表現しました\n3祝日数の偏りがわかります\n4使う色を１色に決め、データを強調しました","imageIndex":57,"imageCount":1,"imageUrls":["assets/gallery/087b4d21ac244df2442fcf79.png"],"imageUrl":"assets/gallery/087b4d21ac244df2442fcf79.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"柴田尚槻　Shibata Naoki","title":"2022年から2026年のSpotifyチャートtop50のBPM比較","tools":"songdata, WaybackMachine, Excel, ChatGPT","projectUrl":"チャート集め（https://songdata.io/charts/japan）、過去のチャート集め（https://web.archive.org/）、グラフづくりのやり方","description":"１，\n2022年から2026年のデータが残っている日のSpotify24時間チャートデータからBPMの情報を使用\n２，\nチャートTOP50に入っている曲のBPMを箱ひげ図にし、さらに各曲のBPMをドットとして重ねた。また、平均値を×として表示した。\n３，\n各年の平均値・中央値・ばらつきの違いやBPMが集中している範囲、外れ値を含む個々の曲のBPM、年によってBPMの分布が高くなった・低くなったといった変化が見えるようになった。\n４，\n箱ひげ図はグレー、ドットは赤色の2色で可視化したことで分布がひとめで分かりやすいようにした。","imageIndex":97,"imageCount":1,"imageUrls":["assets/gallery/aa358feaaf2c41df167850a3.png"],"imageUrl":"assets/gallery/aa358feaaf2c41df167850a3.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"勝家来海　Kurumi Katsuie","title":"予想価格と実際の落札価格の関係","tools":"Excel","projectUrl":"https://github.com/marcusrprojects/What-Makes-Art-Valuable?utm_source=chatgpt.com","description":"美術品の「予想価格」と「実際の落札価格」のデータを選んだ。予想価格を横軸、実際の落札価格を縦軸とした散布図にし、両方を対数目盛で表示した。表現上の工夫として、「予想価格＝実際の落札価格」の基準線 、タイを繰り上げにした。また、ランキング内の都道府県名をクリックすることで、その都道府県に移動できるようにした。白い枠の中でリストをスクロールできるように改良した。","imageIndex":91,"imageCount":2,"imageUrls":["assets/gallery/00f3a869f8c203e9c6c03b5e.png","assets/gallery/63f6f0da1ddd2cdd15f2efe2.png"],"imageUrl":"assets/gallery/00f3a869f8c203e9c6c03b5e.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"須藤蒼太　Souta Sutou","title":"台北YouBikeの経路と建物陰の可視化","tools":"私はCodexで作成したHTML・CSS・JavaScriptのWebアプリを使用した。OpenStreetMapを背景地図とし、SVGで経路と建物影を描画した。データの前処理や太陽位置の計算にはPythonを使用している。","projectUrl":"https://drive.google.com/drive/u/1/folders/1rWwnfbNWRcV83DsFGapaq3gc_aD4Gr9B","description":"①どのデータを選んだか\n台北のYouBikeステーション間から選定した15組のOD（出発地と到着地）について、最短・S2日陰優先・S3日陰優先の計45経路を選んだ。これにOSM由来の道路・建物形状、建物高さ、日時別の太陽位置を組み合わせた。S2はOSMの高さと階数から高さを設定し、S3はさらに用途地域別の代表高さで欠損を補う。\n\n②どのように可視化したか\n予測された建物影を半透明の緑色の面、最短経路を灰色、S2を橙色、S3を青色の線で地図に重ねた。地図を大きく表示し、OD・日付・時刻・シナリオを選択できるようにした。時間バーを動かすと影と日陰率が連動して更新され、総距離・日陰距離・日陰率は比較カードで確認できる。経路自体は選定済みのものを固定している。\n\n③可視化によって何が見えるようになったか\n日陰が予測される道路の位置と、移動距離・日陰の多さの関係が分かるようになった。例えばD1の2026年9月13日9時では、S3評価の最短経路は約706m・日陰率26%、S3日陰優先経路は約1,003m・72%だった。同じ日陰優先経路も15時には約27%となる。時間バーで影の変化を確認することで、時刻によって経路の利点が変わることを読み取りやすくした。これらは建物影のモデル予測であり、実測値ではない。\n\n④表現上の工夫を一つ説明\n日陰を半透明の「面」、経路を「線」として重ねた。影の広がりと移動する位置を同時に示すことで、どの経路が影の中を通るかを読み取れる。さらに日陰の濃さを調整できるようにし、背景の道路や地名を読むときと、影の位置を確認するときで見やすさを変えられるようにした。\n\n改善版Webアプリへのリンク：https://taipei-shade-field-demo.hatsume1k4.chatgpt.site/#field/D1","imageIndex":103,"imageCount":2,"imageUrls":["assets/gallery/2df582ea3cb4fd4693de904c.png","assets/gallery/0f5f646735f54a98ce74e124.png"],"imageUrl":"assets/gallery/2df582ea3cb4fd4693de904c.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"石引響 Ishibiki Hibiki","title":"2020年から2025年の東京の降水量(改正版)","tools":"Microsoft Excel","projectUrl":"https://www.data.jma.go.jp/stats/etrn/index.php?prec_no=44\u0026block_no=47662\u0026year=\u0026month=\u0026day=\u0026view=","description":"①前回と同じく、東京都を対象として2020年から2025年までの月別にまとめた降水量のデータを使用。\n②今回は年毎の合計値と月別毎に集積した降水量のデータを分け、二つのグラフに可視化しました。月別は折れ線グラフ、年毎の合計値は棒グラフの二つで表して可視化することで、分かりやすくなりました。\n③年間に記録した降水量を比較しやすくなり、より正確に読み取れるようになった。月別のデータは折れ線グラフにすることで、月毎に降水量が比較できるようになり、年間を通した動きが見やすくなった。\n④前回可視化したグラフが非常に見にくく、比較することが難しかったので、月別の動きと年間の合計の二つの用途に分けて可視化することで、比較しやすくなった。","imageIndex":80,"imageCount":2,"imageUrls":["assets/gallery/521ad26f6cf470853d48ac3b.png","assets/gallery/66ac2734af61acd142510375.png"],"imageUrl":"assets/gallery/521ad26f6cf470853d48ac3b.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-05","studentName":"石原真汲　Makumi Ishihara","title":"妖怪ウォッチ1のプレイ時間と歩数の関係","tools":"Excel","projectUrl":"デジタルウィルビーイングによるスクリーンタイム計測とSamsung Healthによる歩数計測","description":"身の回りのデータで関連性があると思ったのがスクリーンタイムと歩数でした。歩数が多いとその分スクリーンタイムは減り、少ないとスクリーンタイムは増えます。左右にメモリをつけ折れ線と棒グラフによって異なる単位のものを関係を可視化できるようにしました。最大値と最小値を赤色で強調し、その差を明確化しました。可視化したことにより、いかに妖怪ウォッチ1にのめり込んでいるかがわかりました。","imageIndex":64,"imageCount":1,"imageUrls":["assets/gallery/d83cecfcc13447ba39578692.png"],"imageUrl":"assets/gallery/d83cecfcc13447ba39578692.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-07","studentName":"石川翔渉　ishikawa towa","title":"Nintendo Switchで最も売れたソフトは？改訂版","tools":"Googleスプレッドシート、Googleスライド","projectUrl":"https://www.nintendo.co.jp/ir/finance/software/switch.html","description":"① 任天堂公式のNintendo Switchソフトの世界累計販売本数のデータを使用しました\n② 販売本数の上位10作品を横棒グラフで可視化しました\n③ 前回はシリーズごとに色分けしていましたが、今回は1位のマリオカート8 デラックスだけを赤色にし、それ以外をグレーにすることで、最も重要な情報が最初に目に入るようにしました\n④ また、1位と2位の販売本数の差を吹き出しで強調し、このデータから分かることも追加することで、グラフから読み取れる特徴がより伝わりやすくなるように工夫しました","imageIndex":75,"imageCount":1,"imageUrls":["assets/gallery/b9615092a8a7c16536a6a178.png"],"imageUrl":"assets/gallery/b9615092a8a7c16536a6a178.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-02","studentName":"赤塚絆　Kizuna Akatsuka","title":"大谷翔平の打点と本塁打数の比較","tools":"Excel","projectUrl":"https://baseball.yahoo.co.jp/mlb/player/2100825/top","description":"①大谷翔平選手の年度別の打率と本塁打数 \n②1つの折れ線グラフにまとめた \n③双方の違いと推移\n④1つのグラフでまとめることで比較できるよう工夫した\n数値が高い順に上位3項目までピックアップし順位付けした上でグラフに表記した","imageIndex":58,"imageCount":1,"imageUrls":["assets/gallery/938e6328061b5de95cc43c79.png"],"imageUrl":"assets/gallery/938e6328061b5de95cc43c79.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"浅田寛弥　Asada　Hiroya","title":"種目別の推計実施人口","tools":"ChatGPT　Python","projectUrl":"https://www.ssf.or.jp/thinktank/sports_life/index.html","description":"① どのデータを選んだか\nスポーツ庁および笹川スポーツ財団の調査結果に基づく「日本における種目別のスポーツ・運動の推計実施人口データ」を選びました。\n② どのように可視化したか\n主要8種目の推計実施人口（万人）と実施率（%）を、数値が大きい順に並べた「横棒グラフ」で表現しました。\n③ 可視化によって何が見えるようになったか\n「散歩・ウォーキング（約4,361万人 / 45.0%）」が他の種目を圧倒しており、日本人の運動習慣が手軽で1人で始められる種目に大きく偏っている実態が一目で分かるようになりました。\n④ 表現上の工夫または選択\n棒グラフの右側に「具体人数（万人）」と「実施割合（%）」のテキストラベルを直接表示し、目盛りを参照しなくてもひと目で正確な規模感が伝わるようにしました。","imageIndex":106,"imageCount":1,"imageUrls":["assets/gallery/ba9b64eb1fe0ad487c4ba8c3.jpg"],"imageUrl":"assets/gallery/ba9b64eb1fe0ad487c4ba8c3.jpg"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"大友愛梨　Otomo Airi","title":"比較！私の好きな妖怪たち","tools":"Excel","projectUrl":"https://reitakujp-my.sharepoint.com/:x:/g/personal/a250321a_reitaku_jp/IQCsgF3QlUcLRoEKrVa-yDb9AcjlhSP3kgyOjxach2Z2vRI?e=JM9epf","description":"①妖怪ウォッチ３の各キャラクターの種族値②ランキングが分かるようにした③各キャラクターの特性が分かるようになった。④自分で見たいランキングを選択することでグラフが変化するようにした。（Excelを開いて各自で動かしていただく必要がある。以下Excelのリンク）　https://reitakujp-my.sharepoint.com/:x:/g/personal/a250321a_reitaku_jp/IQCsgF3QlUcLRoEKrVa-yDb9AcjlhSP3kgyOjxach2Z2vRI?e=Y6epPM","imageIndex":100,"imageCount":1,"imageUrls":["assets/gallery/28d869cbafaefaae47b6e2c9.png"],"imageUrl":"assets/gallery/28d869cbafaefaae47b6e2c9.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"大澤祥太郎　Osawa Shotaro","title":"サーブはリスクとリターンの関係","tools":"Excel、Python、ChatGPT","projectUrl":"https://en.volleyballworld.com/volleyball/competitions/volleyball-nations-league/statistics/men/best-servers/","description":"Volleyball World が公開しているVNL 2026男子のサーブ成績から、総サーブ数が100本以上の87選手を選んだ。横軸をサーブミス率、縦軸をサービスエース率とした散布図で、選手ごとの関係を可視化した。ミス率が高い選手ほどエース率も高い傾向があり、相関係数は r = 0.64 だった。円の大きさで総サーブ数を示し、Hanes・Leon・Darlanを強調して重要なパターンを見つけやすくした。","imageIndex":101,"imageCount":1,"imageUrls":["assets/gallery/bf8d3136427cba3c81df9d66.png"],"imageUrl":"assets/gallery/bf8d3136427cba3c81df9d66.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"猪狩蒼空　Igari Sora","title":"大学生がよく飲む飲み物","tools":"Googleスプレッドシート","projectUrl":"國學院大學「飲み物」アンケート調査","description":"大学生がよく飲む飲み物の割合データを選び、横棒グラフで可視化しました。割合が高い順に並べることで、どの飲み物が多いかを比較しやすくしました。特に、水や炭酸飲料、茶の割合が高いことが分かりやすくなりました。また、棒の横に具体的な割合を表示して、数値も確認しやすくしました。","imageIndex":82,"imageCount":1,"imageUrls":["assets/gallery/91c1ccf7f53ab1eb66269aa8.png"],"imageUrl":"assets/gallery/91c1ccf7f53ab1eb66269aa8.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"桃井優 Yu Momoi","title":"ヨルシカの楽曲分析","tools":"songdata,gemini,スプレッドシート,python","projectUrl":"https://songdata.io/https://docs.google.com/spreadsheets/d/1OJnjjLT6K3iDBFJwOlNzEw-73NON49AQgHFL7zYXyjg/edit?usp=sharing","description":"①②ヨルシカの楽曲データから物語上対をなすアルバムである だから僕は音楽を辞めた と エルマ の全収録曲を対象に選び、曲順に伴うテンポの推移を折れ線グラフで可視化しました。\n③この可視化により、冒頭の楽曲では同一のテンポで同期して始まるものの、物語が展開する中盤では一方が急減速する際にもう一方が急加速するなど、二人の感情が交差するようなドラマチックなテンポ設計が明らかになりました。\n④表現上の工夫として、各作品のプロットや軸の周辺にジャケット写真の画像を配置することで、どの系列がどちらの作品を表しているかを直感的に識別できるように工夫しました。","imageIndex":94,"imageCount":2,"imageUrls":["assets/gallery/96305af1ff07033af165f630.png","assets/gallery/d48fe9f77884c205debc20ad.png"],"imageUrl":"assets/gallery/96305af1ff07033af165f630.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"藤原叶　Fujiwara　Kanau","title":"世界と日本のFood比較","tools":"Excel , Chat GPT","projectUrl":"https://www.tasteatlas.com/best/dishes　https://share.google/ZaoCOBfu636ZDcVUq","description":"①TasteAtlas「100 Best Dishes in the World」\n　博報堂生活総研「生活定点：好きな料理ベスト3は何ですか？」\n② どのように可視化したか\n世界の人気料理100品と、日本人の好きな料理ランキングを比較できるようにした。世界のデータと日本のデータを棒グラフで表し、同じグラフの中に入れることで、世界と日本の料理の人気傾向を比べられるようにした。\n③世界では肉料理が多く含まれている一方、日本では寿司やラーメンなどが上位に入っていることが分かるようになった。世界で人気の料理と日本人が好きな料理には、共通する部分だけでなく違いもあることが見えるようになった。\n④２つの棒グラフを組み合わせ、世界と日本のデータを一つのグラフで比較できるようにした。特に、数字だけを見るのではなく、グラフの形の違いから人気の傾向を直感的に分かるようにした。","imageIndex":87,"imageCount":1,"imageUrls":["assets/gallery/59daea2eeb80bc6402d5db2a.png"],"imageUrl":"assets/gallery/59daea2eeb80bc6402d5db2a.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"八重樫旺樹","title":"leagueoflegendの降参率","tools":"java chatGPT","projectUrl":"https://developer.riotgames.com/docs/lol","description":"① どのデータを選んだか：LoLの地域・ランク別の降参率（FF率）データを選びました。\n② どのように可視化したか：地域ごとのFF率と、地域を選択したときのランク別FF率を棒グラフで可視化しました。\n③ 何が見えるようになったか：地域やランクによって降参率にどのような違いがあるかを比較でき、どの地域やランクで降参率が高いのかも分かるようにしました。\n④ 表現上の工夫：暗めのゲーム画面をイメージしたデザインとランクアイコンを使い、LoLのデータだと直感的に分かるようにしました。また、地域をクリックするとランク別のデータに切り替わるようにして、データを見やすくしました。","imageIndex":96,"imageCount":2,"imageUrls":["assets/gallery/ccb274813039bf367c77cd76.png","assets/gallery/ccb274813039bf367c77cd76.png"],"imageUrl":"assets/gallery/ccb274813039bf367c77cd76.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-06","studentName":"八木沼悠斗　Yaginuma Yuto","title":"県別の人口と睡眠グラフ","tools":"excel","projectUrl":"https://uub.jp/rnk/p_j.html　https://www.pokemonsleep.net/suimin-grandprix/","description":"①都道府県別の人口と平均睡眠時間のデータを選んだ。\n人口は都道府県ごとの規模を比較するために使用し、睡眠時間は各県の生活習慣を比較するために使用した。\n異なる2種類のデータを組み合わせることで、人口と睡眠時間にどのような関係があるのかを調べた。\n②人口と睡眠時間の関係を比較するために、組み合わせグラフを使用した。\nさらに近似曲線を追加することで、データ全体の傾向が分かるようにした。\nこれにより、各都道府県のデータだけでなく、人口が増えると睡眠時間がどのように変化するのかを視覚的に確認できるようにした。\n③グラフを確認すると、人口が多い都道府県ほど睡眠時間が短くなる傾向が見られた。\n反対に、人口が少ない都道府県では睡眠時間が長くなる傾向が見られた。\nこのことから、人口と睡眠時間には反比例に近い関係があることが分かり、人口の多さと睡眠時間の関係を視覚的に確認することができた。\n④グラフを見やすくするために、人口と睡眠時間で色を変えて区別した。\nまた、それぞれのデータに合ったグラフの種類を使用することで、数値の違いや全体的な傾向を確認しやすくした。\n情報を削るのではなく、色やグラフの種類を工夫することで、元のデータを残したまま見やすく表現することができた。","imageIndex":71,"imageCount":1,"imageUrls":["assets/gallery/9563a0d0b502c8938e0fb84b.png"],"imageUrl":"assets/gallery/9563a0d0b502c8938e0fb84b.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"木村英明　Kimura Hideaki","title":"フォートナイトコラボスキン実装年代統計","tools":"chatgpt","projectUrl":"https://fndb.gg/collaborations/?utm_source=chatgpt.com","description":"①毎日更新されているデータを使った\n②https://beamish-bublanina-da05fb.netlify.app/サイトを作った\n③2019年からアイコンシリーズの数が急速に増えた\n④カーソルを合わせるとすぐにわかるようにした","imageIndex":93,"imageCount":1,"imageUrls":["assets/gallery/247945c9669cd663d218b77f.png"],"imageUrl":"assets/gallery/247945c9669cd663d218b77f.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"矢部夢華　Yumeka Yabe","title":"スタジオジブリ映画の興行収入ランキング","tools":"Googleスプレッドシート","projectUrl":"https://www.nippon.com/ja/japan-data/h01730/","description":"スタジオジブリ映画10作品の国内興行収入のデータを選びました。興行収入を比較しやすくするため、作品をランキング順に並べた横棒グラフで可視化しました。グラフにすることで、「千と千尋の神隠し」が二位の「もののけ姫」と比べても興行収入が特に高いことがわかるようにしました。表現上の工夫として、最も興行収入が高い作品を目立たせ、棒グラフに具体的な数字を書きました。","imageIndex":84,"imageCount":1,"imageUrls":["assets/gallery/ae83b18cab09f184b71a2fdf.png"],"imageUrl":"assets/gallery/ae83b18cab09f184b71a2fdf.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"林瞳　Akira Hayashi","title":"J-POP・ボカロヒット曲と個人嗜好におけるポジショニング比較分析","tools":"Excel・powerpoint","projectUrl":"https://reitakujp-my.sharepoint.com/:x:/g/personal/a250743a_reitaku_jp/IQBJ9R1O5hAhSZLA5WpE-SccAUZ2a11ei_gCYc3oZQKPz6U?e=96pwS3","description":"①【選んだデータ】YouTubeや各種チャート上位のヒットJ-POP 10曲、ボカロヒット10曲、および自身の嗜好である叙情派・ダーク系10曲の計30曲を対象に、BPM（テンポ）、感情トーン（切ない ↔ 明るい）、サムネイル傾向を集計した独自データセットを作成しました。\n②【可視化の方法】縦軸に「楽曲のテンポ（BPM）」、横軸に「感情トーン」を設定したポジショニングマップ上に、著作権法の引用ルールに則り、統一サイズでカテゴリ別の色枠と曲名テキストを付与したサムネイルカードを配置して可視化しました。\n③【見えたこと（パターンと文脈）】可視化により、一般ヒット曲やボカロ曲が「明るい×ハイテンポ」を中心に分布（市場トレンド）するのに対し、自身の嗜好領域はBPMに関わらず「切ない・ダーク」な領域（個人嗜好）に一貫して特化しているという、両者の対比となる明確なパターンと文脈が浮き彫りになりました。\n④【表現上の工夫・選択】Data Visualizationとしての可読性と分析の即時性を高めるため、スプレッドシートと連動した枠線カラー（Semantic Color Mapping）の適用、背景色の調整、さらにマップ上へのパターン注釈カードの配置を行い、位置関係だけでなく視覚的・構造的な傾向の差異を直感的に捉えられるようデザインを設計しました。","imageIndex":92,"imageCount":2,"imageUrls":["assets/gallery/af9f3ea8af47c750533dbfc3.png","assets/gallery/7e02b8f3b7c16ce54bbb8d33.png"],"imageUrl":"assets/gallery/af9f3ea8af47c750533dbfc3.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"鈴木小太朗　Suzuki Kotarou","title":"4選手の打率推移（2015～2024年）","tools":"PowerPoint","projectUrl":"https://npb.jp/","description":"①プロ野球で活躍する４選手の打率を選んだ。\n②2015～2024年までの打率を折れ線グラフを使って比較した。\n③打率の上下が激しい選手と安定した選手がわかる。また選手の打率のピークや衰えも見える。\n④1回目では打率の数字が0.30とあまり野球では表さない表示の仕方だったので.300に変えた。また一つの基準である3割のところを赤線で強調した。","imageIndex":102,"imageCount":1,"imageUrls":["assets/gallery/c8837d6dd10bdc44d145b2e4.png"],"imageUrl":"assets/gallery/c8837d6dd10bdc44d145b2e4.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-07","studentName":"鈴木優　Yu Suzuki","title":"中2の妹に対する小言・喧嘩ログ","tools":"デジタルノートアプリ","projectUrl":"https://docs.google.com/spreadsheets/d/1h09dnTiUopct10Yk_4NEnKKMuSV9QEQQrezXomRsWmI/edit?gid=0#gid=0","description":"① 第1回で作成したデータをベースに、チャレンジャー号の教訓から学んだ視覚的階層の重要性を意識して再設計しました。\n\n② 表現方法を時系列の棒グラフから2次元の散布図へと変更し、横軸に時間（6〜24時）、縦軸に怒り度（0〜5）をとり、トラブルのカテゴリを色分けしてプロットしました。\n\n③ これにより、単なる日ごとの増減ではなく、すべてのトラブルが18時以降の夕方から夜にかけての時間帯に集中しているという構造的なパターンが一目で分かるようになりました。\n\n④ 表現上の工夫として、チャレンジャー号の事故調査のように「複雑なノイズを削ぎ落としてデータの偏りや異常値を明確に見せる」という視点を取り入れ、散布図を用いることで時間と怒り度の関係性を直感的に誤読なく伝えるデザインにブラッシュアップしました。","imageIndex":77,"imageCount":1,"imageUrls":["assets/gallery/63fd70fd1c9f8552d6bddc52.jpg"],"imageUrl":"assets/gallery/63fd70fd1c9f8552d6bddc52.jpg"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"鈴木陽太","title":"コロナきらい","tools":"Gemini","projectUrl":"https://jstb.or.jp/files/libs/5750/202511041016529511.pdf","description":"①関東地方の中学校、高校の修学旅行先がコロナ前後でどれほど変わったか\n②修学旅行先が自県、関東地方内、他地域の3種類に割合で分けた。\n③コロナ前は他地域に行く割合が全体の90％近く占めていたがコロナが発生したことにより行先が関東地方内、自県内の割合が70％まで大幅に増えた。\n④コロナによる影響だとわかりやすく伝えるためにコロナ発生の前後のデータを使った。","imageIndex":105,"imageCount":1,"imageUrls":["assets/gallery/53a6bbac462758cb9c36b557.png"],"imageUrl":"assets/gallery/53a6bbac462758cb9c36b557.png"},{"week":2,"challenge":"第2週｜再設計","submittedAt":"2026-10-08","studentName":"齋藤さくら　Sakura Saito","title":"私はバイト限定雨女なのか？","tools":"Excel","project ":"都道府県別店舗数一位のゲームセンターチェーン","tools":"Claude excel Datawrapper","projectUrl":"https://datawrapper.dwcdn.net/eFVzj/1/　https://www.fantasy.co.jp/molly-fantasy/shoplist/　https://www.gigo.co.jp/shops　https://bandainamco-am.co.jp/game_center/　https://www.taito.co.jp/store　https://www.round1.co.jp/company/company/all-shop.html","description":"①Claudeに各主要なゲームセンターの公式サイトから店舗の集計をさせ、エクセルに反映させてデータを作成した。②都道府県ごとに色でわかりやすく店舗がわかるように、まずは各県店舗数一位のリストをエクセルで作成しその後DatawrapperでClaudeに作り方を聞きつつ作品を作成した。③可視化によって、想定以上にモーリーファンタジー系列が多いのと、人口が多い県や関東ではGIGOが多い傾向にあることが見えた。④工夫として、色を各ゲームセンターのメインカラーに合うように設定した。namcoが少々悩んだが、バンダイナムコも含まれるためオレンジにすることで、taitoとの赤被りを防ぐことができた。","imageIndex":6,"imageCount":1,"imageUrls":["assets/gallery/6688a2ea879288b1e7f9d836.png"],"imageUrl":"assets/gallery/6688a2ea879288b1e7f9d836.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-29","studentName":"永野虎太郎　Kotarou Nagano","title":"阪神タイガース","tools":"プロ野球速報","projectUrl":"https://docs.google.com/spreadsheets/d/1AFbgC1hbyVhKdBTWYjziu4jDlSqPAoq9Vbjup_5fvn0/edit?usp=sharing","description":"自分は阪神タイガースのファンで優勝のマジックが点灯したのにもかかわらず最近の連敗の原因を調べたいと思いこの議題にしました。可視化で注目してほしいのはOPSですこれはチームへの貢献度を数値化したものです。可視化しこれが1に近づければとても優秀であるとなる0.6でもよい選手とも言えます。打席数立っていない人間で結果をでせている人間とかなり優秀な人物を見ることができます工夫した点は元のデータだと一軍登録されていない人と投手がまとまっていいたが別にすることでわかり役しましたこれでの結果で個人的にここ最近のチーム成績が悪いのは個人成績のタイトル争いがチーム内で行われていることだと思いますほとんどの成績で佐藤輝明選手が４巻がほぼ確実で長距離打者の夢のタイトルが本塁打王でその争いに森下翔太選手が争っていて個人成績に争いをしているからだと感じます。","imageIndex":16,"imageCount":1,"imageUrls":["assets/gallery/7bd15fa567bedbfe20ceb854.png"],"imageUrl":"assets/gallery/7bd15fa567bedbfe20ceb854.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"奥田昭真 Shoma Okuda","title":"iPhone ScreenTime TOP 3","tools":"Exel","projectUrl":"https://1drv.ms/x/c/fda0ee3a225c10e9/IQBVxIfcO7gIQqCXWaoA34xCAcuGFXj_pHwSt5qriu9Jrj0?e=aAzU09","description":"①iPhoneのスクリーンタイム\n②Exelのグラフで可視化\n➂グラフからその日が忙しかったということが分かる\n④Youtube, X, Gameと大きく区分を分けることで、視覚的にもわかりやすくしている。","imageIndex":29,"imageCount":1,"imageUrls":["assets/g allery/6ba370e957d221f235d031b1.png"],"imageUrl":"assets/gallery/6ba370e957d221f235d031b1.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"森本颯太","title":"世界のトップサッカー選手10名の市場価値推移","tools":"Googleスプレッドシート","projectUrl":"Transfermarkt： https://www.transfermarkt.com/","description":"Transfermarktから現在のサッカー選手の市場価値トップ10を抽出し、過去5シーズン分の推移データを選びました。このデータをGoogleスプレッドシートにまとめ、Pythonを用いて時系列の折れ線グラフとして可視化しました。この可視化により、トップ層が安定して高水準を維持する一方で、若手選手の価値が直近で急激に上昇しているトレンドが一目でわかるように見えた。","imageIndex":52,"imageCount":2,"imageUrls":["assets/gallery/4acc8213a8fdcec735ee26e8.png","assets/gallery/0f804179e486053ab5b06be2.png"],"imageUrl":"assets/gallery/4acc8213a8fdcec735ee26e8.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"神戸宗一郎 Kanbe Souichirou","title":"MC BATTLE 都道府県勢力図","tools":"VS cord html","projectUrl":"https://github.com/a250927s-create/data-vis.git","description":"1.https://mcbattlenow.com/database/mc/c682f001-d525-438f-8d56-7978cc0cd965\n前回授業で紹介したMCバトルの優勝者データを参考に、彼らの代表する街を調べ上げ地図に反映することで、データを可視化した。\n2.地図上に色の違い、クリックしたら優勝者一覧が表示され、サイドバーに最多優勝県が表示されるようにしている。\n3.ラップバトルが強い街が一目で分かるようになり、その街のバトル、サイファー、Liveイベント等に遊びに行くことでラップを上達させることができることがわかる。\n4.街の優勝者一覧から、そのラッパーがその大会で残したバトルを閲覧することができる。\n全体的に改良の余地があるため、改良を続けていく。","imageIndex":35,"imageCount":2,"imageUrls":["assets/gallery/5c1de30d7bebab7eb9392591.png","assets/gallery/b01bb10a73981ec322f7b2ab.png"],"imageUrl":"assets/gallery/5c1de30d7bebab7eb9392591.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"須藤蒼太　Souta Sutou","title":"台北YouBikeの経路と建物影の可視化","tools":"Codexを使って作成。HTML・CSS・JavaScriptのWebアプリで可視化した。背景にはOpenStreetMapの地図を使用し、その上にSVGで経路、建物影、出発地・到着地を描画した。データの前処理と太陽位置の計算にはPythonを使用し、主なライブラリはGeoPandas、Shapely、pyproj、Pysolarである。Webアプリ上の座標変換にはProj4js、日時変更に伴う日陰の計算にはJavaScriptのWeb Workerを使用している。","projectUrl":"https://drive.google.com/drive/folders/1rWwnfbNWRcV83DsFGapaq3gc_aD4Gr9B?usp=drive_link","description":"①台北のYouBike（レンタサイクル）ステーション間から研究用に選定した15組のODを対象に、最短経路、S2の日陰優先経路、S3の日陰優先経路の計45本を選んだ。ODは出発地（Origin）と到着地（Destination）の組を意味する。これにOSM由来の道路・建物形状と建物高さ、日付・時刻ごとの太陽位置、経路の総距離・日陰距離・日なた距離を組み合わせた。\nS2はOSMの建物高さを使い、高さがない場合には階数×3mで補う。S3はさらに、用途地域別に推定した高さの中央値で欠損を補う。\n予測対象の日時は2026年9月11～16日、台北時間9:00～17:00、1分単位である。\nこれは実際の利用者の走行記録や交通量のデータではなく、選定したODについてのモデル経路と建物影の予測データである。\n\n②地図上に予測された建物影を半透明の緑色の面として重ね、最短経路を灰色、S2を橙色、S3を青色の線で表示した。\n利用者はOD、日付、時刻、建物高さのシナリオ、表示する経路を選択できる。\n数値欄には経路の総距離、予測日陰距離、日なた距離、日陰率を表示する。日陰率は「日陰距離÷総距離」で求める。日時を変えると、建物影と固定経路上の日陰距離・率が再計算される。\n経路自体は代表日時に選定したものを固定しており、変更後の日時で最適経路を再探索する仕組みではない。\nまた、背景の建物影のシナリオと経路の評価シナリオは区別する必要がある。\nS2経路の数値はS2、S3経路の数値はS3で評価され、最短経路の数値は選択した背景シナリオで評価される。\n\n③どの道路に建物影がかかると予測されるか、建物高さの補完方法や時刻を変えると影の位置・広がりがどう変化するかを確認できるようになった。\nまた、移動距離の短さと日陰の多さの関係を読み取れる。\n例えばD1の2026年9月13日9:00では、同じS3の建物モデルで評価すると、最短経路は約706m・日陰率26%、S3の日陰優先経路は約1,003m・日陰率72%だった。\n約297mの迂回によって、予測日なた距離は約525mから約279mへ減る。一方、同じS3の日陰優先経路でも15:00には日陰率が約27%となる。この例から、朝に日陰が多い経路の利点が、別の時刻にも同程度に続くとは限らないことが分かる。\nこれらは建物形状・推定高さ・太陽位置に基づく計算結果であり、実測した日陰ではない。可視化だけで現地での予測精度やS3の優位性を証明できるものではなく、樹木、天候、体感温度はこの建物影モデルの対象に含まれていない。\n\n④日陰を半透明の「面」、経路を色付きの「線」として重ねた。面で影の空間的な広がりを示し、線で移動する位置を示すことで、どの経路が影の中を通るかを同じ地図上で読み取れる。半透明にすることで、背景の道路や地名も確認できる。この表現によって、数値表だけでは捉えにくい日陰と経路の位置関係を伝えられる。\n\n実際のwebアプリのURL：https://taipei-shade-field-demo.hatsume1k4.chatgpt.site/#field/D1","imageIndex":36,"imageCount":2,"imageUrls":["assets/gallery/ab840b58a67615f4b70f6c31.jpg","assets/gallery/b14d8d844c53c46c159b434e.jpg"],"imageUrl":"assets/gallery/ab840b58a67615f4b70f6c31.jpg"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"石引響 Ishibiki Hibiki","title":"2020年から2025年の東京の降水量","tools":"Microsoft Excel","projectUrl":"https://www.data.jma.go.jp/stats/etrn/index.php?prec_no=44\u0026block_no=47662\u0026year=\u0026month=\u0026day=\u0026view=","description":"①気象庁が公表している2020年から2025年までの東京都の月別にまとめた降水量のデータを月別と年ごとの合計値の二つでまとめ直しました。\n②月別の降水量を棒グラフ、年ごとの合計値を折れ線グラフとし、この二つのデータを統合した複合グラフにしました。\n③雨が集中している月と、年全体で見た時の合計値の差が分かりやすくなった。\n④量データを見比べることができるように複合グラフにして表したこと。","imageIndex":30," 合をスプレッドシートを使って棒グラフにしました。\n③グラフにすることで、どの飲み物が多く選ばれているのかを比較しやすくしました。\n④飲み物の種類が多いため、それぞれの違いが分かりやすいように棒グラフを使いました。","imageIndex":31,"imageCount":1,"imageUrls":["assets/gallery/0b7d3841bd33975fdce3318b.png"],"imageUrl":"assets/gallery/0b7d3841bd33975fdce3318b.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-28","studentName":"張替 世珠　Seiju Harigae","title":"1日あたりの歩数と睡眠時間の相関関係","tools":"Excel","projectUrl":"https://reitakujp-my.sharepoint.com/:x:/g/personal/a250432s_reitaku_jp/IQAufxARgeaZR4sO2lh7LyiQATBSqr5BVAxBhT2h-nL1WHw?e=dccnwO","description":"個人データとして9月15日から21日までの「1日あたりの歩数」と「睡眠時間」のデータを選択しました。これを2軸の複合グラフにし、歩数を青の棒グラフ、睡眠時間をオレンジの折れ線グラフで可視化しました。可視化によって、歩数が少ない日（9/16や9/21など）は睡眠時間の長さにかかわらず在宅生活や車移動が中心であった可能性が見えてくる一方で、歩数が伸びた日（9/20）はアクティブな行動量と睡眠のバランスが変化しているなど、行動パターンと睡眠の複雑な関連性が見えるようになりました。表現上の工夫として、単位や数値のスケールが異なる2つの指標を比較しやすくするため、左右に独立したY軸を設定して配置しました。","imageIndex":13,"imageCount":1,"imageUrls":["assets/gallery/19eb8ca945db1f1d75218063.png"],"imageUrl":"assets/gallery/19eb8ca945db1f1d75218063.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"桃井優 Yu Momoi","title":"ヨルシカの楽曲の傾向","tools":"スプレッドシート、python、gemini","projectUrl":"https://songdata.io/https://docs.google.com/spreadsheets/d/1OJnjjLT6K3iDBFJwOlNzEw-73NON49AQgHFL7zYXyjg/edit?usp=sharing","description":"ヨルシカのアルバム5作品を対象に、各楽曲の曲順やテンポを示すBPM、調性を整理したデータセットを作成しました。このデータをもとにPythonを用いて、アルバムごとの平均テンポ、テンポのばらつき、長調と短調の比率、トラック順のテンポ推移という4つの視点から可視化を行いました。各アルバムごとをイメージする色をグラフの中に用いて少しでも直感的にデータを読み取れるように工夫しました。","imageIndex":41,"imageCount":2,"imageUrls":["assets/gallery/83d44777a50e6f7ab763f01d.png","assets/gallery/83364792f00dd3f1bfa05b73.png"],"imageUrl":"assets/gallery/83d44777a50e6f7ab763f01d.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-30","studentName":"藤原叶　Fujiwara Kanau","title":"世界のfood人気ランキング項目別調査","tools":"Excel","projectUrl":"TasteAtlas「100 Best Dishes in the World」　https://www.tasteatlas.com/best/dishes","description":"①TasteAtlas「100 Best Dishes in the World」　世界のベスト100料理 が一気に約２倍まで上がったことが分かった。\n④グラフで表示する内容を1年に絞ることで元のグラフより見やすくした。","imageIndex":22,"imageCount":1,"imageUrls":["assets/gallery/1af826f664990ed7bf76863f.png"],"imageUrl":"assets/gallery/1af826f664990ed7bf76863f.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"木村英明　Kimura Hideaki","title":"フォートナイトコラボスキン別統計","tools":"chatgpt、Gemini","projectUrl":"https://fndb.gg/characters/?utm_source=chatgpt.com","description":"コラボスキンの全体、日本、アメリカの3つに分け、円グラフで見やすく棒グラフでカテゴリー別の差が分かった","imageIndex":38,"imageCount":2,"imageUrls":["assets/gallery/066fa4b06fb434afab98fbf4.png","assets/gallery/6166fa4fb4bb0adeb404c543.png"],"imageUrl":"assets/gallery/066fa4b06fb434afab98fbf4.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-29","studentName":"野村隆介　Nomura Ryuusuke","title":"米派とパン派の割合","tools":"エクセル","projectUrl":"https://www.e-stat.go.jp/dbview?sid=0004023612","description":"①政府統計の窓口e-statで家計調査家計収支編総世帯から米とパンの割合を求めた、②円グラフが分かりやすいだろうと考え円グラフで可視化した、③この可視化により米派よりパン派の方が多いことが見えるようになった④グラフにも円グラフや点線グラフなどがあるが割合を図るなら円グラフが最適だろうと考え、円グラフにした。","imageIndex":18,"imageCount":1,"imageUrls":["assets/gallery/166513ed41f8b39d311cfb5c.png"],"imageUrl":"assets/gallery/166513ed41f8b39d311cfb5c.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"矢部夢華　Yumeka Yabe","title":"スタジオジブリ映画の興行収入を比較する","tools":"Googleスプレッドシート","projectUrl":"スタジオジブリ映画10作品の日本国内での興行収入データ","description":"①ジブリ10作品の興行収入\n➁横向き棒グラフ\n③作品ごとの差、高い作品\n④横向きのグラフにして作品名を見やすくした","imageIndex":32,"imageCount":1,"imageUrls":["assets/gallery/d44d29a595bb89a236472d93.png"],"imageUrl":"assets/gallery/d44d29a595bb89a236472d93.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"林瞳　Hayashi Akira","title":"-POP・ボカロヒット曲と個人嗜好におけるポジショニングおよび視覚表現の比較分析","tools":"エクセル、パワーポイント、YouTube、Gemini","projectUrl":"エクセル(二枚目のスクリーンショット)にまとめたため、それで判断しでほしいです。","description":"①YouTubeにおける一般ヒットJ-POP 10曲、ボカロヒット10曲、および自身の嗜好である叙情派・ダーク系10曲の計30曲を対象に、BPM、感情トーン、サムネイル傾向を集計した独自データセットを作成しました。\n\n②縦軸にBPM、横軸に感情トーン（切ない ↔ 明るい）を設定したポジショニングマップ上に、著作権法の引用ルールに則り枠線で識別した各曲のサムネイルと曲名カードを配置して可視化しました。\n\n③一般ヒットやボカロ曲が「明るい×ハイテンポ」を中心に分布するのに対し、自身の嗜好領域はBPMに関わらず「切ない・ダーク」に強く密集しており、市場トレンドと個人嗜好の明確な差が浮き彫りになりました。\n\n④Data Visualizationの可読性と著作権配慮を両立するため、カテゴリ別の枠線色と引用注釈を設定し、位置だけでなくデザイン・表現傾向の違いも直感的に識別できるよう選択・設計しました。","imageIndex":43,"imageCount":2,"imageUrls":["assets/gallery/1bfc8b15aa8a1cc3768e4aca.png","assets/gallery/5c789695677ab84a9b6977c4.png"],"imageUrl":"assets/gallery/1bfc8b15aa8a1cc3768e4aca.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"鈴木小太朗　Kotarou Suzuki","title":"プロ野球トップ選手の打率比較","tools":"Excel","projectUrl":"https://npb.jp/","description":"①プロ野球選手４人の１０年間の打率データを選んだ。②棒グラフにすることで年度別で比較し１０年間の打率を可視化した。③１年ごとの打率の変化の特徴が可視化され、年齢による衰え方の違いも出た。④これは個人的なこだわりだが棒グラフの色を選手の所属球団の色に寄せてみた。","imageIndex":50,"imageCount":1,"imageUrls":["assets/gallery/f366f015b3ff442697c11fe0.png"],"imageUrl":"assets/gallery/f366f015b3ff442697c11fe0.png"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-10-01","studentName":"鈴木優　Yu Suzuki","title":"中2の妹に対する小言・喧嘩ログ","tools":"紙・Googleスプレッドシート","projectUrl":"https://docs.google.com/spreadsheets/d/1h09dnTiUopct10Yk_4NEnKKMuSV9QEQQrezXomRsWmI/edit?usp=sharing","description":"① 実家で一緒に暮らしている中2の妹とのやり取りを5日間記録して、時間やきっかけ、妹の態度、自分のイライラ度（0〜5の6段階）をまとめたオリジナルのデータセットを作りました。\n\n② 横軸に日付を置いて、イライラした度合いを上向きの「トゲの高さ」、逆に妹が親に怒られて思わず笑ってしまった瞬間（怒り度0）を下向きの「緑の丸」にして、ノートに手描きで可視化しました。\n\n③ グラフにしてみると、学校が始まってからは顔を合わせる夕方以降に衝突が集中していることや、普段のちょっとした小言（青いトゲ）よりも、煽られたり理不尽なことを言われた日（9/28の赤い大きなトゲ）に怒りが跳ね上がっているのが一目で分かりました。\n\n④ せっかく初回の課題なのでこの授業を楽しんでできるよう堅苦しいデータではなく、そして誰もやらないような自分自身のデータを取ろうと考えこのデータを可視化しました。授業内ワークで見つけた『Dear Data』のように日常のチクチクした感情が直感的に伝わるトゲのモチーフを取り入れたのですが5日間だとデータ数が少なくて余白が寂しくなってしまったのが反省点です。","imageIndex":51,"imageCount":1,"imageUrls":["assets/gallery/59220dc8f63f1bbfe832520a.jpg"],"imageUrl":"assets/gallery/59220dc8f63f1bbfe832520a.jpg"},{"week":1,"challenge":"第1週｜最初の可視化","submittedAt":"2026-09-30","studentName":"齋藤さくら Sakura Saito","title":"私はバイト限定雨女なのか","tools":"Excel","projectUrl":"https://tenki.jp/past/2026/08/weather/3/15/47682/","description":"「tenki.jp」というサイトで2026年8月において千葉県・千葉に雨が降った日を調べ、私が8月にバイトをした日に雨が降ったかどうかを調べた。Excelで雨が降った日とバイトがあった日をまとめ、「８月の雨が降った日の割合」「バイトをした日に雨が降った日の割合」の2つの円グラフにしてまとめた。可視化により、２つの割合はほとんど変わらないことがわかった。工夫としては円グラフの色分けをし、視覚的に雨が降ったかわかりやすくした。","imageIndex":20,"imageCount":1,"imageUrls":["assets/gallery/d5d148b4a1fe9187f759dfe0.png"],"imageUrl":"assets/gallery/d5d148b4a1fe9187f759dfe0.png"}]}</script><script src="assets/i18n.js?v=default-ja-20260925"></script><script src="assets/site.js?v=gallery-heart-sort-20261009"></script></body></html>
