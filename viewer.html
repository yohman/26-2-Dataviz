<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Lecture slides · 2026–2 Data Visualization</title>
  <link rel="icon" href="favicon.svg?v=course-family-20261026" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400..800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body class="viewer-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="index.html"><span>DV / 26–2</span> Seeing Data</a>
    <nav class="site-nav" aria-label="Course navigation">
      <a href="agenda.html">AGENDA</a><a href="gallery.html">GALLERY</a><a href="resources.html">COURSE GUIDE</a>
      <button class="language-toggle" type="button" data-language-toggle>JP</button>
    </nav>
  </header>
  <main id="main" class="viewer-main wrap">
    <a class="viewer-back" data-viewer-back href="agenda.html">← <span data-copy="back">Back to the Agenda</span></a>
    <header class="viewer-heading">
      <div><p class="eyebrow" data-copy="eyebrow">LECTURE SLIDE PREVIEW</p><h1 data-viewer-title>Lecture slides</h1></div>
    </header>
    <section class="pdf-viewer" aria-label="Lecture slide preview">
      <div class="pdf-toolbar">
        <div class="pdf-navigation">
          <button type="button" data-previous aria-label="Previous / 前へ" title="Previous / 前へ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
          <label><span class="sr-only" data-copy="page">Page</span><input aria-label="Page / ページ" data-page-input type="number" min="1" value="1" inputmode="numeric"><span data-page-total>/ —</span></label>
          <button type="button" data-next aria-label="Next / 次へ" title="Next / 次へ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
        </div>
        <div class="pdf-toolbar-actions">
          <span class="pdf-zoom-controls" aria-label="Slide zoom controls">
            <button type="button" data-zoom-out aria-label="Zoom out" title="Zoom out / 縮小">−</button>
            <button type="button" data-zoom-reset aria-label="Fit slide / 全体を表示" title="Fit slide / 全体を表示"><output data-zoom-level>100%</output></button>
            <button type="button" data-zoom-in aria-label="Zoom in" title="Zoom in / 拡大">＋</button>
          </span>
          <button type="button" data-fullscreen aria-pressed="false" aria-label="Full screen / 全画面" title="Full screen / 全画面"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span class="sr-only" data-fullscreen-label>Full screen</span></button>
        </div>
      </div>
      <div class="pdf-stage" data-pdf-stage aria-label="Pinch or Ctrl/⌘ + scroll to zoom; drag to pan / ピンチ・Ctrl/⌘＋スクロールで拡大、ドラッグで移動">
        <p class="pdf-loading" data-status><span data-copy="loading">Loading slides…</span></p>
        <div class="pdf-page" data-pdf-page hidden>
          <canvas class="pdf-canvas" data-pdf-canvas></canvas>
          <div class="pdf-link-layer" data-pdf-links></div>
        </div>
      </div>
    </section>
    <section class="slide-notes" data-slide-notes hidden aria-live="polite">
      <h2 data-notes-heading>Presenter notes</h2>
      <p data-notes-text></p>
      <p data-notes-sources></p>
    </section>
  </main>
  <link rel="stylesheet" href="assets/slide-notes.css?v=20261023">
  <script src="assets/slide-notes.js?v=voices-opening-20261106"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="assets/slide-swipe.js?v=20261016"></script>
  <script src="assets/slide-viewport.js?v=studio-20261106"></script>
  <script src="assets/slide-annotations.js?v=studio-20261106"></script>
  <script>
    const parameters = new URLSearchParams(location.search);
    const requestedFile = parameters.get('file') || '';
    const file = /^lectures\/[A-Za-z0-9._-]+\.pdf$/i.test(requestedFile) ? requestedFile : '';
    const title = parameters.get('title') || 'Lecture slides';
    const week = parameters.get('week') || '';
    const requestedReturn = parameters.get('return') || '';
    const returnTo = /^(?:agenda\.html(?:\?[-\w.~%=&+]*)?#week-\d+|resources\.html)$/.test(requestedReturn) ? requestedReturn : 'agenda.html';
    const strings = {
      back: ['Back to the Agenda', 'AGENDAに戻る'], eyebrow: ['LECTURE SLIDE PREVIEW', '講義スライドのプレビュー'],
      previous: ['Previous', '前へ'], next: ['Next', '次へ'],
      page: ['Page', 'ページ'], fullscreen: ['Full screen', '全画面'], exitFullscreen: ['Exit full screen', '全画面を終了'],
      zoomIn: ['Zoom in', '拡大'], zoomOut: ['Zoom out', '縮小'],
      loading: ['Loading slides…', 'スライドを読み込んでいます…'],
      openSource: ['Open linked source', '出典を開く'],
      failed: ['The preview could not load. Download the PDF instead.', 'プレビューを読み込めませんでした。PDFをダウンロードしてください。']
    };
    let language = 'ja';
    try { language = localStorage.getItem('dv-language') || 'ja'; } catch { /* Japanese fallback. */ }
    const copy = key => strings[key][language === 'ja' ? 1 : 0];
    const slideNotes = window.createSlideNotes({ root: document.querySelector('[data-slide-notes]'), file,
      language: () => language, page: Math.max(1, Number(parameters.get('page')) || 1) });
    const applyLanguage = () => {
      document.documentElement.lang = language;
      document.querySelectorAll('[data-copy]').forEach(node => { node.textContent = copy(node.dataset.copy); });
      const button = document.querySelector('[data-language-toggle]');
      button.textContent = language === 'ja' ? 'EN' : 'JP';
      button.setAttribute('aria-label', language === 'ja' ? 'Switch to English' : '日本語に切り替える');
      const fullscreenLabel = document.querySelector('[data-fullscreen-label]');
      fullscreenLabel.textContent = copy(document.querySelector('.pdf-viewer')?.classList.contains('is-fullscreen') ? 'exitFullscreen' : 'fullscreen');
      document.querySelector('[data-zoom-out]').setAttribute('aria-label', copy('zoomOut'));
      document.querySelector('[data-zoom-in]').setAttribute('aria-label', copy('zoomIn'));
      slideNotes.render();
    };
    document.querySelector('[data-language-toggle]').addEventListener('click', () => {
      language = language === 'ja' ? 'en' : 'ja';
      try { localStorage.setItem('dv-language', language); } catch { /* Continue without persistence. */ }
      applyLanguage();
    });
    applyLanguage();

    const fullTitle = week ? `${week} · ${title}` : title;
    document.title = `${fullTitle} · Preview`;
    document.querySelector('[data-viewer-title]').textContent = fullTitle;
    document.querySelector('[data-viewer-back]').href = returnTo;

    const stage = document.querySelector('[data-pdf-stage]');
    const pdfPage = document.querySelector('[data-pdf-page]');
    const canvas = document.querySelector('[data-pdf-canvas]');
    const linkLayer = document.querySelector('[data-pdf-links]');
    const status = document.querySelector('[data-status]');
    const previous = document.querySelector('[data-previous]');
    const next = document.querySelector('[data-next]');
    const fullscreen = document.querySelector('[data-fullscreen]');
    const zoomOut = document.querySelector('[data-zoom-out]');
    const zoomIn = document.querySelector('[data-zoom-in]');
    const zoomLevel = document.querySelector('[data-zoom-level]');
    const pageInput = document.querySelector('[data-page-input]');
    const pageTotal = document.querySelector('[data-page-total]');
    const inkFile = file === 'lectures/w06_lores.pdf' ? `${file}:voices-opening-20261106` : file;
    const ink = window.bindSlideAnnotations({surface:pdfPage,viewport:stage,toolbar:document.querySelector('.pdf-toolbar'),file:inkFile});
    fullscreen.before(document.querySelector('.slide-ink-toggle'));
    let pdf;
    let activePage = Math.max(1, Number(parameters.get('page')) || 1);
    let renderTask, currentPdfPage, currentViewport;
    let renderRevision = 0, paintRevision = 0, zoomScale = 1;
    const minimumZoom = 1, maximumZoom = 4;
    const viewer = document.querySelector('.pdf-viewer');
    const viewportControl = window.createSlideViewport({viewport:stage,surface:pdfPage,
      onChange(scale) {
        zoomScale=scale;
        zoomLevel.value=`${Math.round(scale*100)}%`;
        zoomOut.disabled=scale<=minimumZoom;zoomIn.disabled=scale>=maximumZoom;
      },
      onSettle() { if(currentPdfPage && currentViewport) paintPage(currentPdfPage,currentViewport,renderRevision); }
    });
    const showFailure = () => {
      ink.loading();status.hidden=false;status.textContent=copy('failed');pdfPage.hidden=true;
      previous.disabled=true;next.disabled=true;pageInput.disabled=true;
    };
    const updateUrl = () => {
      const url=new URL(location.href);
      if(activePage===1) url.searchParams.delete('page');else url.searchParams.set('page',activePage);
      history.replaceState(null,'',url);
    };
    // Draw offscreen, then swap in one frame. Gestures transform the existing
    // slide immediately; PDF detail is refreshed only when movement settles.
    async function paintPage(page,viewport,revision) {
      const paint=++paintRevision;
      if(renderTask) {try{renderTask.cancel();}catch{}}
      const budget=Math.sqrt(16000000/(viewport.width*viewport.height));
      const density=Math.min(budget,(window.devicePixelRatio||1)*Math.max(1,zoomScale));
      const buffer=document.createElement('canvas');
      buffer.width=Math.round(viewport.width*density);buffer.height=Math.round(viewport.height*density);
      renderTask=page.render({canvasContext:buffer.getContext('2d'),viewport,transform:[density,0,0,density,0,0]});
      try {await renderTask.promise;}catch(error){if(error?.name==='RenderingCancelledException')return;throw error;}
      if(revision!==renderRevision||paint!==paintRevision)return;
      canvas.width=buffer.width;canvas.height=buffer.height;
      canvas.getContext('2d').drawImage(buffer,0,0);
      buffer.width=buffer.height=0;
    }
    async function renderPage(requestedPage) {
      if(!pdf)return;
      const requested=Math.min(pdf.numPages,Math.max(1,Number(requestedPage)||1));
      const reset=requested!==activePage || !currentViewport;
      const revision=++renderRevision;activePage=requested;currentPdfPage=null;
      ink.loading();
      const page=await pdf.getPage(activePage);
      if(revision!==renderRevision)return;
      const base=page.getViewport({scale:1});
      const fit=Math.min((stage.clientWidth-16)/base.width,(stage.clientHeight-16)/base.height);
      const viewport=page.getViewport({scale:Math.max(.1,fit)});
      for(const element of [canvas,pdfPage]) {element.style.width=`${viewport.width}px`;element.style.height=`${viewport.height}px`;}
      viewportControl.layout(viewport.width,viewport.height,{reset});
      currentViewport=viewport;
      await paintPage(page,viewport,revision);
      if(revision!==renderRevision)return;
      const annotations=await page.getAnnotations({intent:'display'});
      if(revision!==renderRevision)return;
      linkLayer.replaceChildren();
      annotations.forEach((annotation,index)=>{
        if(annotation.subtype!=='Link'||!annotation.url||!annotation.rect)return;
        let target;try{target=new URL(annotation.url);if(!['http:','https:'].includes(target.protocol))return;}catch{return;}
        const [x1,y1,x2,y2]=viewport.convertToViewportRectangle(annotation.rect);
        const link=document.createElement('a');link.href=target.href;link.target='_blank';link.rel='noopener';
        link.setAttribute('aria-label',`${copy('openSource')} ${index+1}`);
        Object.assign(link.style,{left:`${Math.min(x1,x2)}px`,top:`${Math.min(y1,y2)}px`,width:`${Math.abs(x2-x1)}px`,height:`${Math.abs(y2-y1)}px`});
        linkLayer.append(link);
      });
      currentPdfPage=page;pdfPage.hidden=false;status.hidden=true;
      ink.rendered(activePage);slideNotes.setPage(activePage);
      pageInput.value=activePage;pageInput.max=pdf.numPages;pageTotal.textContent=`/ ${pdf.numPages}`;
      previous.disabled=activePage===1;next.disabled=activePage===pdf.numPages;
      updateUrl();
    }
    previous.addEventListener('click',()=>renderPage(activePage-1));
    next.addEventListener('click',()=>renderPage(activePage+1));
    window.installSlideSwipes(stage,{
      canSwipe:()=>Boolean(pdf)&&!pdfPage.hidden&&stage.dataset.slideDrawing !== 'true'&&stage.dataset.pinching!=='true'&&zoomScale<=1.01&&(window.visualViewport?.scale||1)<=1.01,
      next:()=>{if(activePage<pdf.numPages)renderPage(activePage+1);},
      previous:()=>{if(activePage>1)renderPage(activePage-1);}
    });
    const setZoom=value=>viewportControl.zoomTo(Math.min(maximumZoom,Math.max(minimumZoom,value)));
    zoomOut.addEventListener('click',()=>setZoom(zoomScale/1.2));
    zoomIn.addEventListener('click',()=>setZoom(zoomScale*1.2));
    document.querySelector('[data-zoom-reset]').addEventListener('click',()=>viewportControl.fit());
    const setFullscreen=active=>{
      viewer.classList.toggle('is-fullscreen',active);document.body.classList.toggle('viewer-fullscreen',active);
      fullscreen.setAttribute('aria-pressed',String(active));
      fullscreen.setAttribute('aria-label',copy(active?'exitFullscreen':'fullscreen'));
      document.querySelector('[data-fullscreen-label]').textContent=copy(active?'exitFullscreen':'fullscreen');
      requestAnimationFrame(()=>renderPage(activePage));
    };
    fullscreen.addEventListener('click',()=>setFullscreen(!viewer.classList.contains('is-fullscreen')));
    pageInput.addEventListener('change',()=>renderPage(pageInput.value));
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'&&viewer.classList.contains('is-fullscreen')){setFullscreen(false);return;}
      if(event.target.matches('input,textarea,select')||event.altKey||event.ctrlKey||event.metaKey)return;
      if(event.key==='ArrowLeft'){event.preventDefault();renderPage(activePage-1);}
      if(event.key==='ArrowRight'){event.preventDefault();renderPage(activePage+1);}
      if(event.key==='+'||event.key==='='){event.preventDefault();setZoom(zoomScale*1.2);}
      if(event.key==='-'){event.preventDefault();setZoom(zoomScale/1.2);}
      if(event.key==='0'){event.preventDefault();viewportControl.fit();}
    });
    let resizeTimer;
    const resizeSlides=()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>renderPage(activePage),150);};
    new ResizeObserver(resizeSlides).observe(stage);

    (async () => {
      try {
        if (!file || !window.pdfjsLib) throw new Error('PDF preview unavailable');
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const response = await fetch(`${encodeURI(file)}?v=week6-voices-opening-20261106`, {cache:'no-cache'});
        if (!response.ok) throw new Error('PDF unavailable');
        pdf = await window.pdfjsLib.getDocument({ data: await response.arrayBuffer() }).promise;
        await renderPage(activePage);
      } catch (error) {
        console.error(error);
        showFailure();
      }
    })();
  </script>
</body>
